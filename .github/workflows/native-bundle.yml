name: Native bundle producer

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      inputs_hash:
        required: true
        type: string
    outputs:
      artifact:
        value: ${{ jobs.native.outputs.artifact }}

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: Native bundle (${{ inputs.platform }})
    if: github.repository == 'openai/openai-agents-js'
    runs-on: ${{ fromJSON(github.repository == 'openai/openai-agents-js' && inputs.platform == 'linux-x64' && '{"group":"codex-runners","labels":"codex-linux-x64-xl"}' || github.repository == 'openai/openai-agents-js' && inputs.platform == 'win32-x64' && '{"group":"codex-runners","labels":"codex-windows-x64"}' || '"macos-15-xlarge"') }}
    timeout-minutes: 180
    outputs:
      artifact: ${{ toJSON(steps.upload.outputs) }}
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_PLATFORM: ${{ inputs.platform }}
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: ${{ inputs.platform == 'linux-x64' &&64 || inputs.platform == 'win32-x64' &&16 ||5 }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check runner platform
        run: node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'
      - name: Install Rust
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-target" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang cmake pkg-config protobuf-compiler libssl-dev
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf protobuf openssl@3
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Build the native runtime
        env:
          CC_ENABLE_DEBUG_OUTPUT: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: node packages/agents-codex/scripts/native.mjs package
      - name: Test Windows project-search filename handling
        if: runner.os == 'Windows'
        working-directory: packages/agents-codex/native/.upstream/reviewed-codex/codex-rs
        run: |
          native_host=$(rustc -vV | sed -n 's/^host: //p')
          cargo test --locked --release --target "$native_host" -p codex-exec-server --lib invalid_filename -- --nocapture
      - name: Build the executor test fixture
        if: runner.os == 'Linux' || runner.os == 'macOS'
        working-directory: packages/agents-codex/native
        # Keep this equal to the runtime build so cc does not rerun and replace
        # the saved C compiler command output used for allocator verification.
        env:
          CC_ENABLE_DEBUG_OUTPUT: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          native_host=$(rustc -vV | sed -n 's/^host: //p')
          export RUSTY_V8_ARCHIVE="$PWD/.cache/v8/librusty_v8_ptrcomp_sandbox_release_${native_host}.a.gz"
          export RUSTY_V8_SRC_BINDING_PATH="$PWD/.cache/v8/src_binding_ptrcomp_sandbox_release_${native_host}.rs"
          cargo build --locked --release --example exec-server-fixture
          mkdir -p test-bin
          install -m 0755 "$CARGO_TARGET_DIR/release/examples/exec-server-fixture" test-bin/exec-server-fixture
      - name: Record Linux private allocator evidence
        if: runner.os == 'Linux'
        working-directory: packages/agents-codex
        run: |
          evidence="$RUNNER_TEMP/private-allocator-evidence"
          mkdir -p "$evidence"
          rustc -Vv > "$evidence/rustc.txt"
          cargo -V > "$evidence/cargo.txt"
          cc --version > "$evidence/cc.txt"
          cp native/Cargo.lock "$evidence/Cargo.lock"
          cp native/build-receipt.json "$evidence/build-receipt.json"
          cargo tree --locked --manifest-path native/Cargo.toml --target x86_64-unknown-linux-gnu -e features -i libmimalloc-sys > "$evidence/allocator-features.txt"
          : > "$evidence/mimalloc-c-commands.txt"
          for output in "$CARGO_TARGET_DIR"/release/build/libmimalloc-sys-*/output; do
            test -f "$output"
            label=$(basename "$(dirname "$output")")
            cp "$output" "$evidence/$label.output.txt"
            grep -F 'mimalloc/v2/src/static.c' "$output" >> "$evidence/mimalloc-c-commands.txt"
          done
          grep -F -- '-ftls-model=local-dynamic' "$evidence/mimalloc-c-commands.txt"
          if grep -E -- 'MI_MALLOC_OVERRIDE|initial-exec' "$evidence/mimalloc-c-commands.txt"; then
            exit 1
          fi
          files=(native/codex.node bin/codex-sdk-runtime bin/codex-linux-sandbox bin/codex-execve-wrapper bin/codex-code-mode-host native/test-bin/exec-server-fixture)
          sha256sum "${files[@]}" > "$evidence/product-sha256.txt"
          for file in "${files[@]}"; do
            label=${file//\//_}
            readelf -W -d "$file" > "$evidence/$label.dynamic.txt"
            readelf -W -r "$file" > "$evidence/$label.relocations.txt"
            readelf -W -s "$file" > "$evidence/$label.symbols.txt"
            nm -D --defined-only "$file" > "$evidence/$label.exports.txt"
            nm --defined-only "$file" > "$evidence/$label.all-symbols.txt"
            if [[ "$file" != native/codex.node ]]; then
              if grep -E '[[:space:]]_?mi_(malloc|free|zalloc|realloc)' "$evidence/$label.all-symbols.txt"; then
                exit 1
              fi
            fi
          done
          if grep -E 'STATIC_TLS' "$evidence/native_codex.node.dynamic.txt" || grep -E 'R_X86_64_(TPOFF|GOTTPOFF)' "$evidence/native_codex.node.relocations.txt"; then
            exit 1
          fi
          if grep -E '[[:space:]](malloc|calloc|realloc|free|aligned_alloc|posix_memalign)(@@[^[:space:]]+)?$' "$evidence/native_codex.node.exports.txt"; then
            exit 1
          fi
      - name: Preserve Linux private allocator evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-allocator-evidence-linux-x64
          path: ${{ runner.temp }}/private-allocator-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Archive the native bundle
        working-directory: packages/agents-codex
        env:
          INPUTS: ${{ inputs.inputs_hash }}
        run: |
          products=(native/codex.node native/build-receipt.json bin)
          if [[ "$EXPECTED_PLATFORM" == linux-x64 || "$EXPECTED_PLATFORM" == darwin-arm64 ]]; then
            products+=(native/test-bin/exec-server-fixture)
          fi
          tar -czf - "${products[@]}" > "$RUNNER_TEMP/native-$INPUTS-$EXPECTED_PLATFORM.tar.gz"
      - name: Publish native bundle
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/native-${{ inputs.inputs_hash }}-${{ inputs.platform }}.tar.gz
          archive: false
          if-no-files-found: error
          # Automatic reuse is opportunistic; an expired bundle is rebuilt immediately.
          retention-days: 90
