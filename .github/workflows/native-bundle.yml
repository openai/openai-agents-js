name: Native bundle producer

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      inputs_hash:
        required: true
        type: string
    outputs:
      artifact:
        value: ${{ jobs.native.outputs.artifact }}

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: Native bundle (${{ inputs.platform }})
    if: github.repository == 'openai/openai-agents-js'
    runs-on: ${{ fromJSON(github.repository == 'openai/openai-agents-js' && inputs.platform == 'linux-x64' && '{"group":"codex-runners","labels":"codex-linux-x64-xl"}' || github.repository == 'openai/openai-agents-js' && inputs.platform == 'win32-x64' && '{"group":"codex-runners","labels":"codex-windows-x64"}' || '"macos-15-xlarge"') }}
    timeout-minutes: 180
    outputs:
      artifact: ${{ toJSON(steps.upload.outputs) }}
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_PLATFORM: ${{ inputs.platform }}
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: ${{ inputs.platform == 'linux-x64' &&64 || inputs.platform == 'win32-x64' &&16 ||5 }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check runner platform
        run: node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'
      - name: Install Rust
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-target" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang cmake pkg-config protobuf-compiler libssl-dev
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf protobuf openssl@3
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Build the native runtime
        run: node packages/agents-codex/scripts/native.mjs package
      - name: Build the macOS WSS test fixture
        if: runner.os == 'macOS'
        working-directory: packages/agents-codex/native
        run: |
          export RUSTY_V8_ARCHIVE="$PWD/.cache/v8/librusty_v8_ptrcomp_sandbox_release_aarch64-apple-darwin.a.gz"
          export RUSTY_V8_SRC_BINDING_PATH="$PWD/.cache/v8/src_binding_ptrcomp_sandbox_release_aarch64-apple-darwin.rs"
          cargo build --locked --release --example exec-server-fixture
          mkdir -p test-bin
          install -m 0755 "$CARGO_TARGET_DIR/release/examples/exec-server-fixture" test-bin/exec-server-fixture
      - name: Archive the native bundle
        working-directory: packages/agents-codex
        env:
          INPUTS: ${{ inputs.inputs_hash }}
        run: |
          products=(native/codex.node native/build-receipt.json bin)
          if [[ "$EXPECTED_PLATFORM" == darwin-arm64 ]]; then
            products+=(native/test-bin/exec-server-fixture)
          fi
          tar -czf - "${products[@]}" > "$RUNNER_TEMP/native-$INPUTS-$EXPECTED_PLATFORM.tar.gz"
      - name: Publish native bundle
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/native-${{ inputs.inputs_hash }}-${{ inputs.platform }}.tar.gz
          archive: false
          if-no-files-found: error
          # Automatic reuse is opportunistic; an expired bundle is rebuilt immediately.
          retention-days: 90
