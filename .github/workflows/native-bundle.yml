name: Native bundle producer

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      inputs_hash:
        required: true
        type: string
    outputs:
      artifact:
        value: ${{ jobs.native.outputs.artifact }}

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: Native bundle (${{ inputs.platform }})
    if: github.repository == 'openai/openai-agents-js'
    runs-on: >-
      ${{ fromJSON(
        github.repository == 'openai/openai-agents-js' && inputs.platform == 'linux-x64' && '{"group":"codex-runners","labels":"codex-linux-x64-xl"}' ||
        github.repository == 'openai/openai-agents-js' && github.event_name == 'push' && (github.ref == 'refs/heads/feat/codex-harness' || startsWith(github.ref, 'refs/heads/ci/hillclimb/')) && inputs.platform == 'win32-x64' && '{"group":"codex-runners","labels":"codex-windows-x64-xl"}' ||
        github.repository == 'openai/openai-agents-js' && inputs.platform == 'win32-x64' && '{"group":"codex-runners","labels":"codex-windows-x64"}' ||
        github.repository == 'openai/openai-agents-js' && github.event_name == 'push' && (github.ref == 'refs/heads/feat/codex-harness' || startsWith(github.ref, 'refs/heads/ci/hillclimb/')) && inputs.platform == 'linux-arm64' && '{"group":"codex-runners","labels":"codex-linux-arm64"}' ||
        inputs.platform == 'linux-arm64' && '"ubuntu-24.04-arm"' ||
        (github.repository == 'openai/openai-agents-js' && github.event_name == 'push' && (github.ref == 'refs/heads/feat/codex-harness' || startsWith(github.ref, 'refs/heads/ci/hillclimb/')) &&
         '"macos-26-xlarge"' || '"macos-15-xlarge"')
      ) }}
    timeout-minutes: 180
    outputs:
      artifact: ${{ toJSON(steps.upload.outputs) }}
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_PLATFORM: ${{ inputs.platform }}
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: ${{ inputs.platform == 'linux-x64' &&64 || inputs.platform == 'win32-x64' && (github.repository == 'openai/openai-agents-js' && github.event_name == 'push' && (github.ref == 'refs/heads/feat/codex-harness' || startsWith(github.ref, 'refs/heads/ci/hillclimb/')) &&48 ||16) || inputs.platform == 'linux-arm64' && (github.repository == 'openai/openai-agents-js' && github.event_name == 'push' && (github.ref == 'refs/heads/feat/codex-harness' || startsWith(github.ref, 'refs/heads/ci/hillclimb/')) &&16 ||4) ||5 }}
      CARGO_INCREMENTAL: '0'
      NATIVE_PARALLEL_WINDOWS: ${{ github.repository == 'openai/openai-agents-js' && github.event_name == 'push' && (github.ref == 'refs/heads/feat/codex-harness' || startsWith(github.ref, 'refs/heads/ci/hillclimb/')) && inputs.platform == 'win32-x64' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check runner platform
        run: node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'
      - name: Configure the isolated test compilation profile
        if: github.repository == 'openai/openai-agents-js' && github.event_name == 'push' && github.ref == 'refs/heads/ci/hillclimb/js-cold-test-profile-26'
        run: |
          echo 'CARGO_PROFILE_RELEASE_LTO=off' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_RELEASE_OPT_LEVEL=1' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_RELEASE_DEBUG=0' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG=0' >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-target" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          bash scripts/install-linux-native-build-tools.sh
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf protobuf openssl@3
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Build the native runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          native_args=(package)
          if [[ "$NATIVE_PARALLEL_WINDOWS" == 1 ]]; then
            native_args+=(--parallel-windows)
            # Divide the 48-job Windows build budget across both Cargo graphs.
            export CARGO_BUILD_JOBS=24
          fi
          node packages/agents-codex/scripts/native.mjs "${native_args[@]}"
      - name: Test Windows project-search filename handling
        if: runner.os == 'Windows' && !(github.repository == 'openai/openai-agents-js' && github.event_name == 'push' && (github.ref == 'refs/heads/feat/codex-harness' || startsWith(github.ref, 'refs/heads/ci/hillclimb/')))
        working-directory: packages/agents-codex/native/.upstream/reviewed-codex/codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/agents-project-search-target
        run: |
          native_host=$(rustc -vV | sed -n 's/^host: //p')
          cargo test --locked --release --target "$native_host" -p codex-exec-server --lib invalid_filename -- --nocapture
      - name: Build the executor test fixture
        working-directory: packages/agents-codex/native
        run: |
          native_host=$(rustc -vV | sed -n 's/^host: //p')
          native_args=(build --locked --release --example exec-server-fixture)
          native_output="$CARGO_TARGET_DIR/release"
          native_archive="librusty_v8_ptrcomp_sandbox_release_${native_host}.a.gz"
          native_suffix=""
          if [[ "$EXPECTED_PLATFORM" == win32-x64 ]]; then
            if [[ "$NATIVE_PARALLEL_WINDOWS" == 1 ]]; then
              export CARGO_TARGET_DIR="$CARGO_TARGET_DIR/windows-helpers"
            fi
            native_args+=(--config "$PWD/.upstream/reviewed-codex/codex-rs/.cargo/config.toml" --target "$native_host")
            native_output="$CARGO_TARGET_DIR/$native_host/release"
            native_archive="rusty_v8_ptrcomp_sandbox_release_${native_host}.lib.gz"
            native_suffix=".exe"
          fi
          export RUSTY_V8_ARCHIVE="$PWD/.cache/v8/$native_archive"
          export RUSTY_V8_SRC_BINDING_PATH="$PWD/.cache/v8/src_binding_ptrcomp_sandbox_release_${native_host}.rs"
          cargo "${native_args[@]}"
          mkdir -p test-bin
          install -m 0755 "$native_output/examples/exec-server-fixture$native_suffix" "test-bin/exec-server-fixture$native_suffix"
      - name: Archive the native bundle
        working-directory: packages/agents-codex
        env:
          INPUTS: ${{ inputs.inputs_hash }}
        run: |
          products=(native/codex.node native/build-receipt.json bin)
          if [[ "$EXPECTED_PLATFORM" == win32-x64 ]]; then
            products+=(native/test-bin/exec-server-fixture.exe)
          else
            products+=(native/test-bin/exec-server-fixture)
          fi
          tar -czf - "${products[@]}" > "$RUNNER_TEMP/native-$INPUTS-$EXPECTED_PLATFORM.tar.gz"
      - name: Publish native bundle
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/native-${{ inputs.inputs_hash }}-${{ inputs.platform }}.tar.gz
          archive: false
          if-no-files-found: error
          # Automatic reuse is opportunistic; an expired bundle is rebuilt immediately.
          retention-days: 90

  windows-filenames:
    name: Windows project-search filename handling
    if: >-
      github.repository == 'openai/openai-agents-js' && github.event_name == 'push' && (github.ref == 'refs/heads/feat/codex-harness' || startsWith(github.ref, 'refs/heads/ci/hillclimb/')) && inputs.platform == 'win32-x64'
    runs-on:
      group: codex-runners
      labels: codex-windows-x64
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: 16
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Rust
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-project-search-target" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install Windows build tools
        shell: pwsh
        run: choco install protoc --yes --no-progress
      - name: Prepare the reviewed native source
        run: node packages/agents-codex/scripts/native.mjs prepare
      - name: Test Windows project-search filename handling
        working-directory: packages/agents-codex/native/.upstream/reviewed-codex/codex-rs
        run: |
          native_host=$(rustc -vV | sed -n 's/^host: //p')
          cargo test --locked --release --target "$native_host" -p codex-exec-server --lib invalid_filename -- --nocapture
      - name: Audit the reviewed native source
        run: node packages/agents-codex/scripts/native.mjs audit
