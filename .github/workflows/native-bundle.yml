name: Native bundle producer

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      inputs_hash:
        required: true
        type: string
      managed_arm:
        type: boolean
        default: false
    outputs:
      artifact:
        value: ${{ inputs.platform == 'win32-x64' && jobs.windows-bundle.outputs.artifact || jobs.native.outputs.artifact }}

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: ${{ inputs.platform == 'win32-x64' && 'Build Windows native addon' || format('Native bundle ({0})', inputs.platform) }}
    if: github.repository == 'openai/openai-agents-js'
    runs-on: >-
      ${{ fromJSON(
        github.repository == 'openai/openai-agents-js' && inputs.platform == 'linux-x64' && '{"group":"codex-runners","labels":"codex-linux-x64-xl"}' ||
        github.repository == 'openai/openai-agents-js' && inputs.platform == 'win32-x64' && '{"group":"codex-runners","labels":"codex-windows-x64"}' ||
        inputs.platform == 'linux-arm64' && inputs.managed_arm && '{"group":"codex-runners","labels":"codex-linux-arm64"}' ||
        inputs.platform == 'linux-arm64' && '"ubuntu-24.04-arm"' ||
        github.repository == 'openai/openai-agents-js' && inputs.platform == 'darwin-arm64' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/feat/codex-harness') ||
           (github.event_name == 'pull_request' && github.base_ref == 'feat/codex-harness' &&
            github.event.pull_request.head.repo.full_name == github.repository)) && '"macos-26-xlarge"' ||
        '"macos-15-xlarge"'
      ) }}
    timeout-minutes: 180
    outputs:
      artifact: ${{ toJSON(steps.upload.outputs) }}
      windows_addon: ${{ toJSON(steps.upload_addon.outputs) }}
    defaults: &native_defaults
      run:
        shell: bash
    env: &native_env
      EXPECTED_PLATFORM: ${{ inputs.platform }}
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: ${{ inputs.platform == 'linux-x64' && 64 || inputs.platform == 'win32-x64' && 16 || inputs.platform == 'linux-arm64' && (inputs.managed_arm && 16 || 4) || 5 }}
      CARGO_INCREMENTAL: '0'
    steps:
      - &native_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - &native_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - &native_platform
        name: Check runner platform
        run: node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'
      - &native_rust
        name: Install Rust
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-target" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          bash scripts/install-linux-native-build-tools.sh
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf protobuf openssl@3
      - &native_windows_tools
        name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Build the native runtime
        env:
          OPENAI_AGENTS_NATIVE_TIMINGS: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EXPECTED_PLATFORM" == win32-x64 ]]; then
            node packages/agents-codex/scripts/native.mjs package --windows-component addon
          else
            node packages/agents-codex/scripts/native.mjs package
          fi
      - name: Retain Cargo timing report
        if: inputs.platform == 'linux-arm64' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cargo-timing-linux-arm64
          path: ${{ runner.temp }}/agents-target/cargo-timings/cargo-timing-*.html
          if-no-files-found: error
          retention-days: 14
      - name: Archive the Windows addon
        if: inputs.platform == 'win32-x64'
        working-directory: packages/agents-codex
        run: tar -czf - native/build-receipt.json native/codex.node > "$RUNNER_TEMP/windows-addon-$GITHUB_RUN_ATTEMPT.tar.gz"
      - name: Transfer the Windows addon
        id: upload_addon
        if: inputs.platform == 'win32-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/windows-addon-${{ github.run_attempt }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Build the executor test fixture
        if: inputs.platform != 'win32-x64'
        working-directory: packages/agents-codex/native
        run: |
          native_host=$(rustc -vV | sed -n 's/^host: //p')
          native_archive="librusty_v8_ptrcomp_sandbox_release_${native_host}.a.gz"
          export RUSTY_V8_ARCHIVE="$PWD/.cache/v8/$native_archive"
          export RUSTY_V8_SRC_BINDING_PATH="$PWD/.cache/v8/src_binding_ptrcomp_sandbox_release_${native_host}.rs"
          cargo build --locked --release --example exec-server-fixture
          mkdir -p test-bin
          install -m 0755 "$CARGO_TARGET_DIR/release/examples/exec-server-fixture" test-bin/exec-server-fixture
      - name: Archive the native bundle
        if: inputs.platform != 'win32-x64'
        working-directory: packages/agents-codex
        env:
          INPUTS: ${{ inputs.inputs_hash }}
        run: |
          products=(native/codex.node native/build-receipt.json bin)
          products+=(native/test-bin/exec-server-fixture)
          tar -czf - "${products[@]}" > "$RUNNER_TEMP/native-$INPUTS-$EXPECTED_PLATFORM.tar.gz"
      - name: Publish native bundle
        id: upload
        if: inputs.platform != 'win32-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/native-${{ inputs.inputs_hash }}-${{ inputs.platform }}.tar.gz
          archive: false
          if-no-files-found: error
          # Automatic reuse is opportunistic; an expired bundle is rebuilt immediately.
          retention-days: 90

  windows-filenames:
    name: Windows project-search filename handling
    if: github.repository == 'openai/openai-agents-js' && inputs.platform == 'win32-x64'
    runs-on:
      group: codex-runners
      labels: codex-windows-x64
    timeout-minutes: 180
    defaults: *native_defaults
    env: *native_env
    outputs:
      windows_helpers: ${{ toJSON(steps.upload_helpers.outputs) }}
    steps:
      - *native_checkout
      - *native_node
      - *native_platform
      - *native_rust
      - *native_windows_tools
      - name: Prepare the reviewed native source
        run: node packages/agents-codex/scripts/native.mjs prepare
      - name: Test Windows project-search filename handling
        if: runner.os == 'Windows'
        working-directory: packages/agents-codex/native/.upstream/reviewed-codex/codex-rs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/agents-project-search-target
        run: |
          native_host=$(rustc -vV | sed -n 's/^host: //p')
          cargo test --locked --release --target "$native_host" -p codex-exec-server --lib invalid_filename -- --nocapture
      - name: Audit the reviewed native source
        run: node packages/agents-codex/scripts/native.mjs audit
      - name: Build the Windows helpers and executor fixture
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node packages/agents-codex/scripts/native.mjs package --windows-component helpers
      - name: Archive the Windows helpers and executor fixture
        working-directory: packages/agents-codex
        run: |
          tar -czf - native/build-receipt.json \
            bin/codex-sdk-runtime.exe bin/codex-code-mode-host.exe native/test-bin/exec-server-fixture.exe \
            > "$RUNNER_TEMP/windows-helpers-$GITHUB_RUN_ATTEMPT.tar.gz"
      - name: Transfer the Windows helpers and executor fixture
        id: upload_helpers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/windows-helpers-${{ github.run_attempt }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 90

  windows-bundle:
    name: Native bundle (win32-x64)
    needs: [native, windows-filenames]
    if: github.repository == 'openai/openai-agents-js' && inputs.platform == 'win32-x64'
    runs-on:
      group: codex-runners
      labels: codex-windows-x64
    timeout-minutes: 15
    defaults: *native_defaults
    env: *native_env
    outputs:
      artifact: ${{ toJSON(steps.upload.outputs) }}
    steps:
      - *native_checkout
      - *native_node
      - *native_platform
      - name: Verify and assemble the Windows release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_ADDON: ${{ needs.native.outputs.windows_addon }}
          WINDOWS_HELPERS: ${{ needs.windows-filenames.outputs.windows_helpers }}
          WINDOWS_PARTS: ${{ runner.temp }}/windows-native-parts
          NATIVE_INPUTS: ${{ inputs.inputs_hash }}
        run: |
          node scripts/restore-windows-native-parts.mjs
          node packages/agents-codex/scripts/native.mjs assemble-windows --windows-parts "$WINDOWS_PARTS"
      - name: Archive the native bundle
        working-directory: packages/agents-codex
        env:
          INPUTS: ${{ inputs.inputs_hash }}
        run: |
          tar -czf - native/codex.node native/build-receipt.json bin native/test-bin/exec-server-fixture.exe \
            > "$RUNNER_TEMP/native-$INPUTS-$EXPECTED_PLATFORM.tar.gz"
      - name: Publish native bundle
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/native-${{ inputs.inputs_hash }}-${{ inputs.platform }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 90
