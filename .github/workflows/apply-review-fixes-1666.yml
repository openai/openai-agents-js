name: Apply review fixes 1666

on:
  push:
    branches:
      - feat/model-attempt-timeout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('packages/agents-core/src/runner/modelRetry.ts')
          source = source_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matched {count} times')
              return text.replace(old, new)

          source = replace_once(
              source,
              "const RETRY_AFTER_HEADER = 'retry-after';\n",
              "const RETRY_AFTER_HEADER = 'retry-after';\nconst MAX_TIMER_DELAY_MS = 2_147_483_647;\n",
              'timer constant anchor',
          )

          timeout_anchor = "  return timeoutMs;\n}\n\nfunction createModelAttemptTimeoutError("
          timeout_replacement = (
              "  if (timeoutMs > MAX_TIMER_DELAY_MS) {\n"
              "    throw new UserError(\n"
              "      `modelSettings.retry.attemptTimeoutMs must be less than or equal to ${MAX_TIMER_DELAY_MS}ms.`,\n"
              "    );\n"
              "  }\n"
              "  return timeoutMs;\n"
              "}\n\n"
              "function createModelAttemptTimeoutError("
          )
          source = replace_once(
              source,
              timeout_anchor,
              timeout_replacement,
              'timeout validation anchor',
          )

          predicate_anchor = "  return error;\n}\n\nfunction createModelAttemptScope("
          predicate_replacement = (
              "  return error;\n"
              "}\n\n"
              "function isModelAttemptTimeoutError(\n"
              "  error: unknown,\n"
              "): error is ModelAttemptTimeoutError {\n"
              "  return (\n"
              "    isRecord(error) &&\n"
              "    error.name === 'ModelAttemptTimeoutError' &&\n"
              "    error.code === 'ETIMEDOUT' &&\n"
              "    typeof error.timeoutMs === 'number'\n"
              "  );\n"
              "}\n\n"
              "function createModelAttemptScope("
          )
          source = replace_once(
              source,
              predicate_anchor,
              predicate_replacement,
              'timeout predicate anchor',
          )

          acceptance_start = source.index('function requestMayHaveBeenAccepted(')
          acceptance_end = source.index('\n\nfunction withProviderRetryAuthority(', acceptance_start)
          acceptance_replacement = (
              "function requestMayHaveBeenAccepted(\n"
              "  authority: ProviderRetryAuthority,\n"
              "  request: ModelRequest,\n"
              "  error: unknown,\n"
              "): boolean {\n"
              "  const statefulRequest = Boolean(\n"
              "    request.previousResponseId || request.conversationId,\n"
              "  );\n"
              "  const timedOutWithUnknownAcceptance =\n"
              "    statefulRequest &&\n"
              "    authority.replaySafety !== 'safe' &&\n"
              "    isModelAttemptTimeoutError(error);\n"
              "  return (\n"
              "    authority.replaySafety === 'unsafe' ||\n"
              "    authority.responseStarted === true ||\n"
              "    timedOutWithUnknownAcceptance\n"
              "  );\n"
              "}"
          )
          source = source[:acceptance_start] + acceptance_replacement + source[acceptance_end:]

          old_call = 'requestMayHaveBeenAccepted(authority)'
          if source.count(old_call) != 2:
              raise SystemExit(f'acceptance call count was {source.count(old_call)}')
          source = source.replace(
              old_call,
              'requestMayHaveBeenAccepted(authority, request, error)',
          )
          source_path.write_text(source)

          test_path = Path('packages/agents-core/test/modelAttemptTimeout.test.ts')
          test = test_path.read_text()
          test = replace_once(
              test,
              "import { Usage } from '../src/usage';\n",
              "import { getResponseWithRetry } from '../src/runner/modelRetry';\nimport { Usage } from '../src/usage';\n",
              'test import anchor',
          )

          insertion_anchor = (
              "    expect(model.calls).toBe(0);\n"
              "  });\n\n"
              "  it('does not turn parent run cancellation into a retryable timeout', async () => {\n"
          )
          insertion = (
              "    expect(model.calls).toBe(0);\n"
              "  });\n\n"
              "  it('rejects attempt timeouts above the platform timer limit', async () => {\n"
              "    const model = new TimeoutThenResponseModel();\n"
              "    const agent = new Agent({\n"
              "      name: 'OverflowAttemptTimeoutAgent',\n"
              "      model,\n"
              "      modelSettings: { retry: { attemptTimeoutMs: 2_147_483_648 } },\n"
              "    });\n\n"
              "    await expect(run(agent, 'hello')).rejects.toThrow(\n"
              "      'modelSettings.retry.attemptTimeoutMs must be less than or equal to 2147483647ms',\n"
              "    );\n"
              "    expect(model.calls).toBe(0);\n"
              "  });\n\n"
              "  it('marks a surfaced stateful timeout as possibly accepted', async () => {\n"
              "    vi.useFakeTimers();\n"
              "    const model = new TimeoutThenResponseModel();\n"
              "    const onPossiblyAcceptedRequestFailure = vi.fn();\n"
              "    const request = {\n"
              "      conversationId: 'conv_timeout',\n"
              "      modelSettings: { retry: { attemptTimeoutMs: 25 } },\n"
              "    } as ModelRequest;\n\n"
              "    const responsePromise = getResponseWithRetry(model, request, {\n"
              "      onPossiblyAcceptedRequestFailure,\n"
              "    });\n"
              "    await vi.advanceTimersByTimeAsync(25);\n\n"
              "    await expect(responsePromise).rejects.toMatchObject({\n"
              "      name: 'ModelAttemptTimeoutError',\n"
              "      code: 'ETIMEDOUT',\n"
              "    });\n"
              "    expect(onPossiblyAcceptedRequestFailure).toHaveBeenCalledOnce();\n"
              "  });\n\n"
              "  it('does not mark a stateful timeout accepted when the provider says replay is safe', async () => {\n"
              "    vi.useFakeTimers();\n"
              "    const model = new TimeoutThenResponseModel();\n"
              "    model.getRetryAdvice = vi.fn().mockReturnValue({ replaySafety: 'safe' });\n"
              "    const onPossiblyAcceptedRequestFailure = vi.fn();\n"
              "    const request = {\n"
              "      previousResponseId: 'resp_timeout',\n"
              "      modelSettings: { retry: { attemptTimeoutMs: 25 } },\n"
              "    } as ModelRequest;\n\n"
              "    const responsePromise = getResponseWithRetry(model, request, {\n"
              "      onPossiblyAcceptedRequestFailure,\n"
              "    });\n"
              "    await vi.advanceTimersByTimeAsync(25);\n\n"
              "    await expect(responsePromise).rejects.toMatchObject({\n"
              "      name: 'ModelAttemptTimeoutError',\n"
              "      code: 'ETIMEDOUT',\n"
              "    });\n"
              "    expect(onPossiblyAcceptedRequestFailure).not.toHaveBeenCalled();\n"
              "  });\n\n"
              "  it('does not turn parent run cancellation into a retryable timeout', async () => {\n"
          )
          test = replace_once(test, insertion_anchor, insertion, 'test insertion anchor')
          test_path.write_text(test)
          PY

      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/apply-review-fixes-1666.yml
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add packages/agents-core/src/runner/modelRetry.ts packages/agents-core/test/modelAttemptTimeout.test.ts .github/workflows/apply-review-fixes-1666.yml
          git commit -m "fix(core): harden model attempt timeout safety"
          git push origin HEAD:${GITHUB_REF_NAME}
