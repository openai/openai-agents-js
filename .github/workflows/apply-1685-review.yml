name: Apply realtime transform review fixes

on:
  push:
    branches:
      - feat/realtime-session-payload-transform-466-rebased

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/realtime-session-payload-transform-466-rebased
      - name: Apply patch
        run: python .github/scripts/apply-1685-review.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(realtime): preserve canonical transformed session state"
          git push origin HEAD:feat/realtime-session-payload-transform-466-rebased
