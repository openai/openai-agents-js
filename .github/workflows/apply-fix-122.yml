name: Apply fix 122

on:
  push:
    branches:
      - fix/twilio-g711-handoff-122

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Twilio audio format handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matched {count} times')
              return text.replace(old, new)

          path = Path('packages/agents-extensions/src/TwilioRealtimeTransport.ts')
          source = path.read_text()
          source = replace_once(
              source,
              "  RealtimeSessionConfig,\n} from '@openai/agents/realtime';\n",
              "  RealtimeSessionConfig,\n  RealtimeAudioFormat,\n} from '@openai/agents/realtime';\n",
              'audio format import',
          )
          source = replace_once(
              source,
              "type LegacyRealtimeAudioConfig = Partial<RealtimeSessionConfig> & {\n  inputAudioFormat?: 'pcm16' | 'g711_ulaw' | 'g711_alaw';\n  outputAudioFormat?: 'pcm16' | 'g711_ulaw' | 'g711_alaw';\n};\n",
              "type LegacyRealtimeAudioConfig = Partial<RealtimeSessionConfig> & {\n  inputAudioFormat?: 'pcm16' | 'g711_ulaw' | 'g711_alaw';\n  outputAudioFormat?: 'pcm16' | 'g711_ulaw' | 'g711_alaw';\n};\n\nfunction toTwilioAudioFormat(\n  format: RealtimeAudioFormat | undefined,\n): RealtimeAudioFormat {\n  if (format === 'g711_ulaw' || format === 'g711_alaw') {\n    return format;\n  }\n  if (\n    typeof format === 'object' &&\n    format !== null &&\n    (format.type === 'audio/pcmu' || format.type === 'audio/pcma')\n  ) {\n    return format;\n  }\n  return 'g711_ulaw';\n}\n\nfunction toTwilioLegacyAudioFormat(\n  format: LegacyRealtimeAudioConfig['inputAudioFormat'],\n): 'g711_ulaw' | 'g711_alaw' {\n  return format === 'g711_alaw' ? 'g711_alaw' : 'g711_ulaw';\n}\n",
              'audio format helpers',
          )
          source = replace_once(
              source,
              "    inputAudioFormat: config.inputAudioFormat ?? 'g711_ulaw',\n    outputAudioFormat: config.outputAudioFormat ?? 'g711_ulaw',\n",
              "    inputAudioFormat: toTwilioLegacyAudioFormat(config.inputAudioFormat),\n    outputAudioFormat: toTwilioLegacyAudioFormat(config.outputAudioFormat),\n",
              'legacy defaults',
          )
          source = replace_once(
              source,
              "            format: audioConfig.input?.format ?? 'g711_ulaw',\n",
              "            format: toTwilioAudioFormat(audioConfig.input?.format),\n",
              'nested input format',
          )
          source = replace_once(
              source,
              "            format: audioConfig.output?.format ?? 'g711_ulaw',\n",
              "            format: toTwilioAudioFormat(audioConfig.output?.format),\n",
              'nested output format',
          )
          path.write_text(source)

          test_path = Path('packages/agents-extensions/test/TwilioRealtimeTransport.test.ts')
          test = test_path.read_text()
          test = replace_once(
              test,
              "    expect(\n      transport._setInputAndOutputAudioFormat({ inputAudioFormat: 'foo' }),\n    ).toEqual({ inputAudioFormat: 'foo', outputAudioFormat: 'g711_ulaw' });\n",
              "    expect(\n      transport._setInputAndOutputAudioFormat({ inputAudioFormat: 'pcm16' }),\n    ).toEqual({\n      inputAudioFormat: 'g711_ulaw',\n      outputAudioFormat: 'g711_ulaw',\n    });\n",
              'legacy regression',
          )
          marker = "  test('validates the Twilio input inactivity timeout', () => {\n"
          addition = (
              "  test('coerces explicit PCM session formats after handoff', () => {\n"
              "    const transport = new TwilioRealtimeTransportLayer({\n"
              "      twilioWebSocket: asTwilioWebSocket(new FakeTwilioWebSocket()),\n"
              "    });\n\n"
              "    expect(\n"
              "      transport._setInputAndOutputAudioFormat({\n"
              "        audio: {\n"
              "          input: { format: { type: 'audio/pcm', rate: 24_000 } },\n"
              "          output: { format: { type: 'audio/pcm', rate: 24_000 } },\n"
              "        },\n"
              "      } as any),\n"
              "    ).toEqual({\n"
              "      audio: {\n"
              "        input: { format: 'g711_ulaw' },\n"
              "        output: { format: 'g711_ulaw' },\n"
              "      },\n"
              "    });\n"
              "  });\n\n"
              "  test('preserves explicitly compatible G.711 formats', () => {\n"
              "    const transport = new TwilioRealtimeTransportLayer({\n"
              "      twilioWebSocket: asTwilioWebSocket(new FakeTwilioWebSocket()),\n"
              "    });\n\n"
              "    expect(\n"
              "      transport._setInputAndOutputAudioFormat({\n"
              "        audio: {\n"
              "          input: { format: { type: 'audio/pcmu' } },\n"
              "          output: { format: 'g711_alaw' },\n"
              "        },\n"
              "      } as any),\n"
              "    ).toEqual({\n"
              "      audio: {\n"
              "        input: { format: { type: 'audio/pcmu' } },\n"
              "        output: { format: 'g711_alaw' },\n"
              "      },\n"
              "    });\n"
              "  });\n\n"
          )
          test = replace_once(test, marker, addition + marker, 'test insertion')
          test_path.write_text(test)
          PY
      - name: Commit patch
        run: |
          rm .github/workflows/apply-fix-122.yml
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add packages/agents-extensions/src/TwilioRealtimeTransport.ts packages/agents-extensions/test/TwilioRealtimeTransport.test.ts .github/workflows/apply-fix-122.yml
          git commit -m "fix(extensions): keep Twilio session updates on G.711"
          git push origin HEAD:${GITHUB_REF_NAME}
