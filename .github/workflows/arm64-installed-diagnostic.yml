name: ARM64 installed receipts diagnostic

on:
  push:
    branches: [mark/nov9-js-arm64-installed-receipts]

permissions:
  contents: read
  actions: read

concurrency:
  group: arm64-installed-receipts-diagnostic
  cancel-in-progress: true

jobs:
  installed:
    name: Exact ARM64 installed consumers
    if: github.repository == 'openai/openai-agents-js' && github.ref == 'refs/heads/mark/nov9-js-arm64-installed-receipts'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ALPHA_VERSION: 0.22.0-alpha.2
      EXPECTED_PLATFORM: linux-arm64
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      NATIVE_INPUTS: a14bbf8598f837569deb51ee40406e644d16a295d93223a6c49117d09df80595
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5c2dca1dfec9c58e4f357acc9c43f7139b184140
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check runner and exact source
        run: |
          test "$(git rev-parse HEAD)" = 5c2dca1dfec9c58e4f357acc9c43f7139b184140
          git diff --exit-code
          node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'
      - name: Restore the exact verified native transfer
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT: '{"artifact-id":"13745601686","artifact-digest":"7e8ab51d76ee9b437a890a40fa40434b93648b9b3e37ebc26be5ff25a6ac3c14"}'
        run: node scripts/restore-native-bundle.mjs
      - name: Install Linux worker prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor-profiles bubblewrap
          if ! bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          uname -sr
          bwrap --version
          bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the exact SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Create the release bundles
        run: node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$RUNNER_TEMP/agents-alpha"
      - name: Test both extracted bundles with the existing-file fixture
        run: |
          echo "AppArmor unprivileged user namespace restriction"
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          dd --version | sed -n '1p'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const consumer = readFileSync('scripts/verify-alpha-consumer.mjs', 'utf8');
          const original = 'if (printf overwritten > ../sentinel) 2>/dev/null; then exit 1; fi; printf granted > ../writable/proof.txt';
          const existing = 'command -v dd >/dev/null || exit 1; if (printf overwritten | dd of=../sentinel conv=nocreat status=none) 2>/dev/null; then exit 1; fi; printf granted > ../writable/proof.txt';
          assert.equal(consumer.split(original).length, 2);
          writeFileSync(
            'scripts/.verify-alpha-consumer-existing-file.mjs',
            consumer.replace(original, existing),
            { flag: 'wx' },
          );
          const verifier = readFileSync('scripts/verify-alpha-package.mjs', 'utf8');
          const fixture = './verify-alpha-consumer.mjs';
          assert.equal(verifier.split(fixture).length, 2);
          writeFileSync(
            'scripts/.verify-alpha-package-existing-file.mjs',
            verifier.replace(fixture, './.verify-alpha-consumer-existing-file.mjs'),
            { flag: 'wx' },
          );
          NODE
          directory="$RUNNER_TEMP/agents-alpha"
          diff_status=0
          diff -u --label verify-alpha-consumer.mjs --label verify-alpha-consumer-existing-file.mjs \
            scripts/verify-alpha-consumer.mjs scripts/.verify-alpha-consumer-existing-file.mjs \
            > "$directory/FIXTURE.diff" || diff_status=$?
          test "$diff_status" -eq 1
          sha256sum scripts/{verify-alpha-consumer,.verify-alpha-consumer-existing-file,verify-alpha-package,.verify-alpha-package-existing-file}.mjs \
            > "$directory/FIXTURE-SHA256SUMS"
          printf '%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$directory/EXACT-SDK"
          node scripts/.verify-alpha-package-existing-file.mjs --directory "$directory"
          git diff --exit-code
      - name: Check both installed receipts and record evidence checksums
        run: |
          cd "$RUNNER_TEMP/agents-alpha"
          test -s installed-starter-linux-arm64.json
          test -s installed-app-linux-arm64.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          for (const profile of ['starter', 'app']) {
            const receipt = JSON.parse(readFileSync(`installed-${profile}-linux-arm64.json`, 'utf8'));
            assert.equal(receipt.sourceCommit, '5c2dca1dfec9c58e4f357acc9c43f7139b184140');
            assert.equal(receipt.profile, profile);
            assert.equal(receipt.platform, 'linux-arm64');
            assert.equal(receipt.arch, 'arm64');
            assert(receipt.verified.includes('local-sandbox'));
          }
          NODE
          sha256sum -c SHA256SUMS-linux-arm64
          sha256sum installed-starter-linux-arm64.json installed-app-linux-arm64.json SHA256SUMS-linux-arm64 EXACT-SDK FIXTURE.diff FIXTURE-SHA256SUMS > DIAGNOSTIC-SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arm64-installed-receipts-existing-file-5c2dca1dfec9
          path: |
            ${{ runner.temp }}/agents-alpha/installed-starter-linux-arm64.json
            ${{ runner.temp }}/agents-alpha/installed-app-linux-arm64.json
            ${{ runner.temp }}/agents-alpha/SHA256SUMS-linux-arm64
            ${{ runner.temp }}/agents-alpha/DIAGNOSTIC-SHA256SUMS
            ${{ runner.temp }}/agents-alpha/EXACT-SDK
            ${{ runner.temp }}/agents-alpha/FIXTURE.diff
            ${{ runner.temp }}/agents-alpha/FIXTURE-SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
