name: ARM64 installed receipts diagnostic

on:
  push:
    branches: [mark/nov9-js-arm64-installed-receipts]

permissions:
  contents: read
  actions: read

concurrency:
  group: arm64-installed-receipts-diagnostic
  cancel-in-progress: true

jobs:
  installed:
    name: Exact ARM64 installed consumers
    if: github.repository == 'openai/openai-agents-js' && github.ref == 'refs/heads/mark/nov9-js-arm64-installed-receipts'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ALPHA_VERSION: 0.22.0-alpha.2
      EXPECTED_PLATFORM: linux-arm64
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      NATIVE_INPUTS: a14bbf8598f837569deb51ee40406e644d16a295d93223a6c49117d09df80595
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5c2dca1dfec9c58e4f357acc9c43f7139b184140
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check runner and exact source
        run: |
          test "$(git rev-parse HEAD)" = 5c2dca1dfec9c58e4f357acc9c43f7139b184140
          git diff --exit-code
          node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'
      - name: Restore the exact verified native transfer
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT: '{"artifact-id":"13745601686","artifact-digest":"7e8ab51d76ee9b437a890a40fa40434b93648b9b3e37ebc26be5ff25a6ac3c14"}'
        run: node scripts/restore-native-bundle.mjs
      - name: Install Linux worker prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor-profiles bubblewrap
          if ! bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          uname -sr
          bwrap --version
          bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the exact SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Create the release bundles
        run: node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$RUNNER_TEMP/agents-alpha"
      - name: Test the extracted bundles
        id: installed_verify
        run: |
          date --iso-8601=seconds > "$RUNNER_TEMP/agents-alpha-verify-start"
          node scripts/verify-alpha-package.mjs --directory "$RUNNER_TEMP/agents-alpha"
      - name: Read matching kernel audit for the exact verifier
        if: failure() && steps.installed_verify.outcome == 'failure'
        run: |
          started=$(cat "$RUNNER_TEMP/agents-alpha-verify-start")
          echo "Reading kernel audit since $started for the original verifier"
          journal_status=0
          sudo journalctl --kernel --no-pager --quiet --output=short-iso --since "$started" \
            --grep='apparmor="DENIED".*(unprivileged_userns|comm="bwrap"|codex-linux-sandbox)' \
            || journal_status=$?
          echo "Kernel audit query status $journal_status"
      - name: Capture the existing synthetic command result privately
        if: failure() && steps.installed_verify.outcome == 'failure'
        run: |
          umask 077
          export ARM64_DIAGNOSTIC_FILE="$RUNNER_TEMP/arm64-synthetic-result.json"
          probe="$RUNNER_TEMP/agents-alpha-sandbox-probe"
          cp -a "$RUNNER_TEMP/agents-alpha" "$probe"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          let consumer = readFileSync('scripts/verify-alpha-consumer.mjs', 'utf8');
          const exactOpening = [
            "          const session = await agent.session({",
            "            environment: Environment.local({",
            "              cwd,",
            "              tools: ['exec_command'],",
            "              writableRoots: [writable],",
            "            }),",
            "          });",
          ].join('\n');
          assert.equal(consumer.split(exactOpening).length, 2);
          consumer = consumer.replace(exactOpening, [
            "          const environment = Environment.local({",
            "            cwd,",
            "            tools: ['exec_command'],",
            "            writableRoots: [writable],",
            "          });",
            "          const session = await agent.session({ environment });",
          ].join('\n'));
          const marker = "            assert.equal(\n              command?.status,";
          assert.equal(consumer.split(marker).length, 2);
          const diagnostic = [
            '            if (command?.status !== "completed") {',
            '              await writeFile(process.env.ARM64_DIAGNOSTIC_FILE, JSON.stringify({',
            '                diagnostic: "synthetic sandbox command",',
            '                status: command?.status,',
            '                exitCode: command?.exitCode,',
            '                output: command?.output?.slice(0, 2048),',
            '                sentinelProtected: (await readFile(sentinel)).equals(Buffer.from("protected")),',
            '                grantWritten: await readFile(join(writable, "proof.txt")).then(',
            '                  (value) => value.equals(Buffer.from("granted")),',
            '                  (error) => { if (error.code === "ENOENT") return false; throw error; },',
            '                ),',
            '                localConfinementRequired: environment.kind === "local" && environment.writePolicy === "strict",',
            '                nativeTestFlag: process.env.OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX === "1",',
            '                underSystemTemp: root.startsWith("/tmp/"),',
            '              }), { mode: 0o600, flag: "wx" });',
            '            }',
            '',
          ].join('\n');
          writeFileSync(
            'scripts/.verify-alpha-consumer-diagnostic.mjs',
            consumer.replace(marker, diagnostic + marker),
            { flag: 'wx' },
          );
          const verifier = readFileSync('scripts/verify-alpha-package.mjs', 'utf8');
          const fixture = './verify-alpha-consumer.mjs';
          assert.equal(verifier.split(fixture).length, 2);
          writeFileSync(
            'scripts/.verify-alpha-package-diagnostic.mjs',
            verifier.replace(fixture, './.verify-alpha-consumer-diagnostic.mjs'),
            { flag: 'wx' },
          );
          NODE
          started=$(date --iso-8601=seconds)
          probe_status=0
          node scripts/.verify-alpha-package-diagnostic.mjs --directory "$probe" || probe_status=$?
          echo "Reading kernel audit since $started for the disposable replay"
          journal_status=0
          sudo journalctl --kernel --no-pager --quiet --output=short-iso --since "$started" \
            --grep='apparmor="DENIED".*(unprivileged_userns|comm="bwrap"|codex-linux-sandbox)' \
            || journal_status=$?
          echo "Kernel audit query status $journal_status"
          if [[ -s "$ARM64_DIAGNOSTIC_FILE" ]]; then
            cat > "$RUNNER_TEMP/arm64-diagnostic-recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIDKzCCAhOgAwIBAgIUTAhV86TAQci2VCanHw+iValgtFkwDQYJKoZIhvcNAQEL
          BQAwJTEjMCEGA1UEAwwaQVJNNjQgaW5zdGFsbGVkIGRpYWdub3N0aWMwHhcNMjYx
          MTEwMDg0MDM2WhcNMjYxMTEyMDg0MDM2WjAlMSMwIQYDVQQDDBpBUk02NCBpbnN0
          YWxsZWQgZGlhZ25vc3RpYzCCASIwDQYJKoZIhvcNAQEBBQADggEPADCCAQoCggEB
          AJgtXMoPIuvKSTdJqq8SLZ93Wpaaxf3PXdm0s0JNtmOYqg8bXkRXCEaO1VXDaYMf
          uozd2nHM08O7QoLQFbYyc/cu+gKhfgDOoKOC5m7/OWT8M3iuYzupPg4OcTsqpI9m
          az2kyC2TYxGHZkF+Xl4UhySznHIVZyQvUETLuz9OzwKVUZRwYX9J0spulask7YQk
          X+OS2zUCiWb3HyXM7kexkyevGBYspM3hZ1QFZrs1j24AwpHphF4+WtNTgzVjS45m
          972B7M83lSdlo6uiYvPQUrQDIVcyUHm4KaPyoseb9AfxPArsDpi+EX84JNxFzW58
          jMYobQ493feWpHArcM+hSY0CAwEAAaNTMFEwHQYDVR0OBBYEFL4C82joAOgoCwAg
          MjZpcCp2c7FtMB8GA1UdIwQYMBaAFL4C82joAOgoCwAgMjZpcCp2c7FtMA8GA1Ud
          EwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggEBAFv6lJlm3whm1JhO0y5Y2VWC
          Y+6V2SEzr/x7YjbDWOm4f1vlNlYuQvCJHCbmyYrCrsgnpPlc8lzEjrh4ZrEGU2Rm
          c68ioVHdT8EcpWgTl2Li1b4XDJlQNVb7wS7RrG8kQ77uAF4bQhahl9VZDrg4tYrh
          lZ4XCYmDGA/X0Y+yA5TKyNBHqVJEkdz+XqQrPV9o7rySpjq7j1dNyDwjZJ/0kdxu
          WtVfz/5jahBShCA9NBbw7GPRjmWJpJg+vdcXLZfpSM1Ru5NK1fEvOk0EsuSYaGFA
          sux2nDDWGd7jWETDhkFqvYesUuzUd2hbwsHMRQTaJcRixbU2WXkDKAz+ESXqnho=
          -----END CERTIFICATE-----
          CERT
            openssl cms -encrypt -binary -aes-256-gcm -outform DER \
              -in "$ARM64_DIAGNOSTIC_FILE" -out "$RUNNER_TEMP/arm64-synthetic-result.cms" \
              "$RUNNER_TEMP/arm64-diagnostic-recipient.pem"
            rm "$ARM64_DIAGNOSTIC_FILE"
          fi
          exit "$probe_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.installed_verify.outcome == 'failure'
        with:
          name: arm64-installed-sandbox-diagnostic-5c2dca1dfec9
          path: ${{ runner.temp }}/arm64-synthetic-result.cms
          if-no-files-found: ignore
          retention-days: 7
      - name: Check both installed receipts and record evidence checksums
        run: |
          cd "$RUNNER_TEMP/agents-alpha"
          test -s installed-starter-linux-arm64.json
          test -s installed-app-linux-arm64.json
          sha256sum -c SHA256SUMS-linux-arm64
          sha256sum installed-starter-linux-arm64.json installed-app-linux-arm64.json SHA256SUMS-linux-arm64 > DIAGNOSTIC-SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arm64-installed-receipts-5c2dca1dfec9
          path: |
            ${{ runner.temp }}/agents-alpha/installed-starter-linux-arm64.json
            ${{ runner.temp }}/agents-alpha/installed-app-linux-arm64.json
            ${{ runner.temp }}/agents-alpha/SHA256SUMS-linux-arm64
            ${{ runner.temp }}/agents-alpha/DIAGNOSTIC-SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
