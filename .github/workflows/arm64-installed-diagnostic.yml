name: Stock ARM64 focused installed verification

on:
  push:
    branches: [mark/nov9-js-arm64-installed-receipts]

permissions:
  contents: read
  actions: read

jobs:
  installed:
    name: Verify both stock ARM64 installed profiles
    if: github.repository == 'openai/openai-agents-js' && github.ref == 'refs/heads/mark/nov9-js-arm64-installed-receipts'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      ALPHA_VERSION: 0.22.0-alpha.2
      NATIVE_INPUTS: '2babfa949833e5fc9dc66a4b0d5191c82ccbcaed492e2143c3ec51b902395607'
      NATIVE_TRANSFER_ID: '13770499829'
      NATIVE_TRANSFER_SHA256: 'e8c9f0d62c4ffb490cff56a51c10e7f19e9ff4a1358059280a3acc75425d3178'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '79e2d75ae3e7dcf4460cabb2447fdd1720303985'
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify exact source and architecture
        run: |
          test "$(git rev-parse HEAD)" = '79e2d75ae3e7dcf4460cabb2447fdd1720303985'
          test "$(git rev-parse 'HEAD^{tree}')" = 'baa6e9760e7692b68d26a47af8fc099f9ef2ca81'
          test "$(node --input-type=module -e 'import {nativeInputs} from "./scripts/native-bundle-inputs.mjs"; console.log(nativeInputs())')" = "$NATIVE_INPUTS"
          node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, "linux-arm64")'
          git show -s --format='%H %T %P' HEAD
      - name: Restore and verify matching native products
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT: '{"artifact-id":"13770499829","artifact-digest":"e8c9f0d62c4ffb490cff56a51c10e7f19e9ff4a1358059280a3acc75425d3178"}'
        run: |
          node scripts/restore-native-bundle.mjs
          (cd packages/agents-codex && sha256sum -c - <<'SUMS'
          c968588bfbd95f864e006d2751c4f0b4438bcd6f99da5a0c73f3bc986f24f72e  native/build-receipt.json
          d4afed1e06e0ca9ec16ca2d518eca6f70c4e1b1aecf1d7ab42ea675714eee8f8  bin/codex-code-mode-host
          67a30fa8c74d73d715459f9bdbc2d6a5270561a7d021fb9f5a9c74d306701d09  bin/codex-execve-wrapper
          67a30fa8c74d73d715459f9bdbc2d6a5270561a7d021fb9f5a9c74d306701d09  bin/codex-linux-sandbox
          67a30fa8c74d73d715459f9bdbc2d6a5270561a7d021fb9f5a9c74d306701d09  bin/codex-sdk-runtime
          626bbfa0aa533df6adf0d8b2fe981f5aec92447fccab08634d1c4b42c1127e99  native/codex.node
          b245b95930106707fb74a56a8bcedbf9f6a1d858c36f9304cb406181888135e4  native/test-bin/exec-server-fixture
          SUMS
          )
      - name: Install stock Linux worker prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor-profiles bubblewrap
          if ! bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          uname -srmo
          bwrap --version
          bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true
          test "$(cat /sys/module/apparmor/parameters/enabled)" = Y
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the exact SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Create the exact release bundles
        run: |
          directory="$RUNNER_TEMP/agents-alpha"
          node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$directory"
          git diff --exit-code
          native_package="$directory/openai-agents-codex-$ALPHA_VERSION-linux-arm64.tgz"
          tar -xOzf "$native_package" package/native/build-receipt.json | cmp - packages/agents-codex/native/build-receipt.json
          git show -s --format='%H %T %P' HEAD > "$directory/EXACT-SDK"
          printf '%s %s %s\n' "$NATIVE_TRANSFER_ID" "$NATIVE_TRANSFER_SHA256" "$NATIVE_INPUTS" > "$directory/NATIVE-TRANSFER"
          printf 'apparmor=%s\nunprivileged_userns_restriction=%s\n' "$(cat /sys/module/apparmor/parameters/enabled)" "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" > "$directory/SANDBOX"
          sha256sum scripts/{alpha-package,verify-alpha-package,verify-alpha-consumer}.mjs > "$directory/VERIFIER-SHA256SUMS"
      - name: Test both fresh extracted profiles
        run: |
          directory="$RUNNER_TEMP/agents-alpha"
          node scripts/verify-alpha-package.mjs --directory "$directory" 2>&1 | tee "$directory/installed.log"
          cd "$directory"
          test -s installed-starter-linux-arm64.json
          test -s installed-app-linux-arm64.json
          sha256sum -c SHA256SUMS-linux-arm64
          sha256sum installed-*-linux-arm64.json build-linux-arm64.json SHA256SUMS-linux-arm64 EXACT-SDK NATIVE-TRANSFER SANDBOX VERIFIER-SHA256SUMS installed.log > DIAGNOSTIC-SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: arm64-focused-installed-79e2d75a
          path: |
            ${{ runner.temp }}/agents-alpha/*.tgz
            ${{ runner.temp }}/agents-alpha/*.tar.gz
            ${{ runner.temp }}/agents-alpha/installed-*.json
            ${{ runner.temp }}/agents-alpha/build-*.json
            ${{ runner.temp }}/agents-alpha/*SHA256SUMS*
            ${{ runner.temp }}/agents-alpha/EXACT-SDK
            ${{ runner.temp }}/agents-alpha/NATIVE-TRANSFER
            ${{ runner.temp }}/agents-alpha/SANDBOX
            ${{ runner.temp }}/agents-alpha/installed.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
