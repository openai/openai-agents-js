name: Format realtime session update tracking

on:
  push:
    branches:
      - feat/realtime-session-payload-transform-466-rebased

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/realtime-session-payload-transform-466-rebased
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec prettier --write packages/agents-realtime/src/openaiRealtimeBase.ts
      - name: Commit and self-clean
        run: |
          rm -f .github/workflows/format-1685.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(realtime): format session update tracking"
          git push origin HEAD:feat/realtime-session-payload-transform-466-rebased
