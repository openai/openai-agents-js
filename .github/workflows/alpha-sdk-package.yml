name: Alpha SDK qualification

on:
  workflow_call:
    inputs:
      snapshots:
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  sdk:
    if: >-
      github.repository == 'openai/openai-agents-js' &&
      ((github.event_name == 'push' && github.event.deleted != true) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))
    name: SDK and package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            snapshot_job: native_linux
          - platform: darwin-arm64
            runner: macos-15
            snapshot_job: native_macos
          - platform: win32-x64
            runner: windows-2025
            snapshot_job: native_windows
    # Keep macOS on its ARM runner and preserve standard runners for fork-owned repositories.
    runs-on: ${{ fromJSON(github.repository == 'openai/openai-agents-js' && matrix.platform == 'linux-x64' && '{"group":"codex-runners","labels":"codex-linux-x64"}' || github.repository == 'openai/openai-agents-js' && matrix.platform == 'win32-x64' && '{"group":"codex-runners","labels":"codex-windows-x64"}' || toJSON(matrix.runner)) }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      ALPHA_VERSION: 0.22.0-alpha.1
      EXPECTED_PLATFORM: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check runner platform
        run: |
          node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'

      - name: Identify the executed workflow
        id: workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { join } = require('node:path');
            const { executedNativeRecipe } = await import(pathToFileURL(join(process.env.GITHUB_WORKSPACE, 'packages/agents/scripts/native-donor.mjs')).href);
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            const recipe = await executedNativeRecipe({ github, repo: context.repo, run,
              workflowSha: process.env.GITHUB_WORKFLOW_SHA });
            core.setOutput('sha', recipe);

      - name: Identify native inputs
        id: native
        env:
          NATIVE_WORKFLOW_BLOB: ${{ steps.workflow.outputs.sha }}
        run: node packages/agents/scripts/native-artifact.mjs identity

      - name: Capture native snapshot
        id: snapshot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          NATIVE_SNAPSHOTS: ${{ inputs.snapshots }}
          SNAPSHOT_JOB: ${{ matrix.snapshot_job }}
          NATIVE_ARTIFACT_NAME: ${{ steps.native.outputs.name }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { join } = require('node:path');
            const { validateCurrentSnapshot } = await import(pathToFileURL(join(process.env.GITHUB_WORKSPACE, 'packages/agents/scripts/native-donor.mjs')).href);
            const snapshot = JSON.parse(process.env.NATIVE_SNAPSHOTS)[process.env.SNAPSHOT_JOB]?.outputs;
            const selected = await validateCurrentSnapshot({ github, context,
              name: process.env.NATIVE_ARTIFACT_NAME, platform: process.env.EXPECTED_PLATFORM, snapshot });
            core.setOutput('artifact_id', selected.artifactId);

      - name: Download captured native snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2.
        with:
          artifact-ids: ${{ steps.snapshot.outputs.artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/native-snapshot

      - name: Verify and restore native snapshot
        env:
          NATIVE_EXPECTED_PROVENANCE: ${{ fromJSON(inputs.snapshots)[matrix.snapshot_job].outputs.provenance }}
        run: node packages/agents/scripts/native-artifact.mjs restore "$RUNNER_TEMP/native-snapshot"

      - name: Begin SDK execution
        run: echo 'All native snapshots were published before SDK execution.'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm

      - name: Build SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Test native artifact reuse
        run: node --test scripts/native-artifact.test.mjs scripts/alpha-package.test.mjs

      - name: Create the release bundles
        run: node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$RUNNER_TEMP/agents-alpha"
      - name: Test the extracted bundles
        run: node scripts/verify-alpha-package.mjs --directory "$RUNNER_TEMP/agents-alpha"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agents-alpha-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/agents-alpha/*.tgz
            ${{ runner.temp }}/agents-alpha/*.tar.gz
            ${{ runner.temp }}/agents-alpha/SHA256SUMS-*
            ${{ runner.temp }}/agents-alpha/build-*.json
            ${{ runner.temp }}/agents-alpha/installed-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
