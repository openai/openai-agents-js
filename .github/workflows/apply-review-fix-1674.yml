name: Apply review fix 1674

on:
  push:
    branches:
      - feat/realtime-session-payload-transform-466

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical session state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matched {count} times')
              return text.replace(old, new)

          path = Path('packages/agents-realtime/src/openaiRealtimeBase.ts')
          source = path.read_text()

          anchor = "function normalizeRealtimeMessageContent(\n"
          helper = (
              "function mergeCanonicalSessionPayload(\n"
              "  current: Record<string, any> | null,\n"
              "  update: RealtimeSessionPayload,\n"
              "): Record<string, any> {\n"
              "  const merged = { ...(current ?? {}), ...update };\n"
              "  const currentAudio = current?.audio;\n"
              "  const updateAudio = update.audio;\n"
              "  if (currentAudio || updateAudio) {\n"
              "    merged.audio = { ...(currentAudio ?? {}), ...(updateAudio ?? {}) };\n"
              "    if (currentAudio?.input || updateAudio?.input) {\n"
              "      merged.audio.input = {\n"
              "        ...(currentAudio?.input ?? {}),\n"
              "        ...(updateAudio?.input ?? {}),\n"
              "      };\n"
              "    }\n"
              "    if (currentAudio?.output || updateAudio?.output) {\n"
              "      merged.audio.output = {\n"
              "        ...(currentAudio?.output ?? {}),\n"
              "        ...(updateAudio?.output ?? {}),\n"
              "      };\n"
              "    }\n"
              "  }\n"
              "  return merged;\n"
              "}\n\n"
          )
          source = replace_once(source, anchor, helper + anchor, 'merge helper')

          source = replace_once(
              source,
              "    if (parsed.type === 'session.updated') {\n      this.#rawSessionConfig = parsed.session;\n    }\n",
              "    if (parsed.type === 'session.updated') {\n      if (!this.#transformSessionPayload || this.#rawSessionConfig === null) {\n        this.#rawSessionConfig = parsed.session;\n      }\n    }\n",
              'session updated state',
          )

          source = replace_once(
              source,
              "  protected _sendSessionUpdate(payload: RealtimeSessionPayload): void {\n    const session = this.#transformSessionPayload?.(payload) ?? payload;\n",
              "  protected _sendSessionUpdate(payload: RealtimeSessionPayload): void {\n    this.#rawSessionConfig = mergeCanonicalSessionPayload(\n      this.#rawSessionConfig,\n      payload,\n    );\n    const session = this.#transformSessionPayload?.(payload) ?? payload;\n",
              'send session update',
          )
          path.write_text(source)
          PY
      - name: Commit patch
        run: |
          rm .github/workflows/apply-review-fix-1674.yml
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add packages/agents-realtime/src/openaiRealtimeBase.ts .github/workflows/apply-review-fix-1674.yml
          git commit -m "fix(realtime): preserve canonical session state"
          git push origin HEAD:${GITHUB_REF_NAME}
