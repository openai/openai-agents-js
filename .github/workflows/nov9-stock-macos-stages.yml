{
  "name": "Private frozen4b stock macOS all-stage baseline",
  "on": {
    "push": {
      "branches": [
        "diag/js-stock-4b7b617b-stages"
      ],
      "paths": [
        ".github/workflows/nov9-stock-macos-stages.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "stock-mac": {
      "if": "github.repository == 'openai/openai-agents-js'",
      "runs-on": "macos-15",
      "timeout-minutes": 30,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Record stock passwd and UID before preparation",
          "run": "set +e\nstage=before-preparation\nroot=\"$RUNNER_TEMP/nov9-stock-host\"; mkdir -p \"$root/$stage\"\nprobe() {\n  name=\"$1\"; shift\n  /usr/bin/perl -e 'alarm 5; exec @ARGV; exit 127' -- \"$@\" > \"$root/$stage/$name.stdout\" 2> \"$root/$stage/$name.stderr\"\n  code=$?; printf '%s\\n' \"$code\" > \"$root/$stage/$name.exit\"\n}\nprobe uid /usr/bin/id -u\nprobe username /usr/bin/id -un\nprobe whoami /usr/bin/whoami\nprobe identity /usr/bin/id\nprobe passwd-sha256 /usr/bin/shasum -a 256 /etc/passwd\nprobe passwd-stat /usr/bin/stat -f '%m %z %i' /etc/passwd\nprobe passwd /bin/cat /etc/passwd\nuid=\"$(cat \"$root/$stage/uid.stdout\")\"\nif [[ \"$uid\" =~ ^[0-9]+$ ]]; then probe directory-user /usr/bin/dscacheutil -q user -a uid \"$uid\"; fi\nprintf '%s\\n' \"$GITHUB_SHA\" > \"$root/$stage/diagnostic-head\"\nprintf '%s\\n' \"$GITHUB_REF\" > \"$root/$stage/diagnostic-ref\"\nexit 0"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 2,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24",
            "package-manager-cache": false
          }
        },
        {
          "name": "Initialize sealed private payload outside checkout",
          "run": "mkdir -p \"$RUNNER_TEMP/nov9-stock-packet\"\nprintf 'NOV9_STOCK_PACKET=%s\\n' \"$RUNNER_TEMP/nov9-stock-packet\" >> \"$GITHUB_ENV\"\n: > \"$RUNNER_TEMP/nov9-stock-packet/payload.b64\""
        },
        {
          "name": "Stage sealed payload part1 of11",
          "run": "printf '%s' '' >> \"$NOV9_STOCK_PACKET/payload.b64\""
        },
        {
          "name": "Stage sealed payload part2 of11",
          "run": "printf '%s' '' >> \"$NOV9_STOCK_PACKET/payload.b64\""
        },
        {
          "name": "Stage sealed payload part3 of11",
          "run": "printf '%s' '' >> \"$NOV9_STOCK_PACKET/payload.b64\""
        },
        {
          "name": "Stage sealed payload part4 of11",
          "run": "printf '%s' '' >> \"$NOV9_STOCK_PACKET/payload.b64\""
        },
        {
          "name": "Stage sealed payload part5 of11",
          "run": "printf '%s' '' >> \"$NOV9_STOCK_PACKET/payload.b64\""
        },
        {
          "name": "Stage sealed payload part6 of11",
          "run": "printf '%s' '' >> \"$NOV9_STOCK_PACKET/payload.b64\""
        },
        {
          "name": "Stage sealed payload part7 of11",
          "run": "printf '%s' '' >> \"$NOV9_STOCK_PACKET/payload.b64\""
        },
        {
          "name": "Stage sealed payload part8 of11",
          "run": "printf '%s' '' >> \"$NOV9_STOCK_PACKET/payload.b64\""
        },
        {
          "name": "Stage sealed payload part9 of11",
          "run": "printf '%s' '' >> \"$NOV9_STOCK_PACKET/payload.b64\""
        },
        {
          "name": "Stage sealed payload part10 of11",
          "run": "printf '%s' '' >> \"$NOV9_STOCK_PACKET/payload.b64\""
        },
        {
          "name": "Stage sealed payload part11 of11",
          "run": "printf '%s' '' >> \"$NOV9_STOCK_PACKET/payload.b64\""
        },
        {
          "name": "Decode sealed private execution files",
          "run": "python3 - <<'PY_PACKET'\nimport base64,json,os\nfrom pathlib import Path\np=Path(os.environ['NOV9_STOCK_PACKET']);files=json.loads(base64.b64decode((p/'payload.b64').read_bytes()))\nfor name,value in files.items(): (p/name).write_bytes(base64.b64decode(value))\nPY_PACKET"
        },
        {
          "name": "Admit exact signed4b Darwin publication and signed workflow-only diagnostic head",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 \"$NOV9_STOCK_PACKET/admit-and-restore.py\""
        },
        {
          "uses": "pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413",
          "with": {
            "run_install": false
          }
        },
        {
          "name": "Install locked dependencies without native builds",
          "run": "pnpm install --frozen-lockfile --ignore-scripts"
        },
        {
          "name": "Apply repository native receipt integrity check",
          "run": "node --input-type=module -e 'const {verifyNativeReceipt}=await import(\"./scripts/alpha-package.mjs\");await verifyNativeReceipt(process.cwd(),\"darwin-arm64\")'"
        },
        {
          "name": "Apply sealed all-stage test-only fixture and verify exact baseline composition",
          "run": "python3 - <<'PY_PATCH'\nimport hashlib,os,subprocess\nfrom pathlib import Path\npacket=Path(os.environ['NOV9_STOCK_PACKET']);patch=packet/'stock-macos-native-trust-test-only.patch'\nassert hashlib.sha256(patch.read_bytes()).hexdigest()=='50acb9a5733af7f5e547b06bbd224fd535cd0ddb93fef55526322be4e2141210'\nsubprocess.run(['git','apply','--check',str(patch)],check=True)\nsubprocess.run(['git','apply',str(patch)],check=True)\nfile='packages/agents-codex/test/native/local-executor-policy-native.test.ts'\nassert subprocess.check_output(['git','diff','--name-only']).decode().splitlines()==[file]\nenv={**os.environ,'GIT_INDEX_FILE':str(packet/'fixture.index')}\nsubprocess.run(['git','read-tree','4b7b617bc8342b0f5c5b7dee71d3ddcc3dd3fe1e'],check=True,env=env)\nsubprocess.run(['git','add','--',file],check=True,env=env)\nassert subprocess.check_output(['git','write-tree'],env=env).decode().strip()=='abcdbdac6419623b8613ba5a887483f3543bacb5'\n(packet/'test-only.diff').write_bytes(subprocess.check_output(['git','diff','--',file]))\nPY_PATCH\nnode --input-type=module -e 'import assert from \"node:assert/strict\";import {nativeInputs} from \"./scripts/native-bundle-inputs.mjs\";assert.equal(nativeInputs(),\"54aab1ef7f1c30cd22346f23192d8b18d00d093321f13d1a9be11857e0a67c55\")'\n"
        },
        {
          "name": "Run all stock safety controls and seven-stage direct witness in clean HOME",
          "run": "set +e\nhome=\"$(mktemp -d \"$RUNNER_TEMP/nov9-stock-test-home.XXXXXX\")\"\ntemp=\"$(mktemp -d \"$RUNNER_TEMP/nov9-stock-test-temp.XXXXXX\")\"\nprintf '%s\\n' \"$home\" > \"$NOV9_STOCK_PACKET/test-home\"\nprintf '%s\\n' \"$temp\" > \"$NOV9_STOCK_PACKET/test-temp\"\nenv -i PATH=\"$PATH\" HOME=\"$home\" TMPDIR=\"$temp\" RUNNER_TEMP=\"$RUNNER_TEMP\" OPENAI_AGENTS_NATIVE_TESTS=1 OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX=1 CODEX_EXEC_SERVER_TEST_BINARY=\"$PWD/packages/agents-codex/native/test-bin/exec-server-fixture\" pnpm test:native packages/agents-codex/test/native/local-executor-policy-native.test.ts -t \"$(cat \"$NOV9_STOCK_PACKET/selector-regex.txt\")\" --maxWorkers=1 --reporter=verbose --reporter=json --outputFile=\"$NOV9_STOCK_PACKET/checkout-policy.json\" > \"$NOV9_STOCK_PACKET/test.log\" 2>&1\ntest_code=$?; printf '%s\\n' \"$test_code\" > \"$NOV9_STOCK_PACKET/test.exit\"\npython3 \"$NOV9_STOCK_PACKET/verify-results.py\" \"$NOV9_STOCK_PACKET/checkout-policy.json\" > \"$NOV9_STOCK_PACKET/result-check.log\" 2>&1\ncheck_code=$?; printf '%s\\n' \"$check_code\" > \"$NOV9_STOCK_PACKET/result-check.exit\"\ncat \"$NOV9_STOCK_PACKET/result-check.log\"\nif [ \"$test_code\" -ne 0 ]; then exit \"$test_code\"; fi\nexit \"$check_code\""
        },
        {
          "name": "Record stock passwd and UID after all outcomes",
          "if": "always()",
          "run": "set +e\nstage=after-all-outcomes\nroot=\"$RUNNER_TEMP/nov9-stock-host\"; mkdir -p \"$root/$stage\"\nprobe() {\n  name=\"$1\"; shift\n  /usr/bin/perl -e 'alarm 5; exec @ARGV; exit 127' -- \"$@\" > \"$root/$stage/$name.stdout\" 2> \"$root/$stage/$name.stderr\"\n  code=$?; printf '%s\\n' \"$code\" > \"$root/$stage/$name.exit\"\n}\nprobe uid /usr/bin/id -u\nprobe username /usr/bin/id -un\nprobe whoami /usr/bin/whoami\nprobe identity /usr/bin/id\nprobe passwd-sha256 /usr/bin/shasum -a 256 /etc/passwd\nprobe passwd-stat /usr/bin/stat -f '%m %z %i' /etc/passwd\nprobe passwd /bin/cat /etc/passwd\nuid=\"$(cat \"$root/$stage/uid.stdout\")\"\nif [[ \"$uid\" =~ ^[0-9]+$ ]]; then probe directory-user /usr/bin/dscacheutil -q user -a uid \"$uid\"; fi\nprintf '%s\\n' \"$GITHUB_SHA\" > \"$root/$stage/diagnostic-head\"\nprintf '%s\\n' \"$GITHUB_REF\" > \"$root/$stage/diagnostic-ref\"\nexit 0"
        },
        {
          "name": "Preserve checkout-policy evidence only",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "private-stock-mac-baseline4b-all-stages",
            "path": "${{ runner.temp }}/nov9-stock-host/**\n${{ runner.temp }}/nov9-stock-packet/runtime-admission.json\n${{ runner.temp }}/nov9-stock-packet/checkout-policy.json\n${{ runner.temp }}/nov9-stock-packet/test-only.diff\n${{ runner.temp }}/nov9-stock-packet/*.log\n${{ runner.temp }}/nov9-stock-packet/*.exit\n${{ runner.temp }}/nov9-stock-packet/test-home\n${{ runner.temp }}/nov9-stock-packet/test-temp",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        }
      ],
      "name": "Stock macOS baseline4b (checkout policy only)"
    }
  }
}
