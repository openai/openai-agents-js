name: Diagnose the macOS child-tracing check

on:
  push:
    branches: [ci/bench/js-xl-child-trace-20261105]

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: macos-15-xlarge
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bbb63439896880fe987a3c19a0be8515c6ae865f
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore the exact Mac binaries from the failed job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/openai/openai-agents-js/actions/artifacts/13398682835/zip > "$RUNNER_TEMP/native.tar.gz"
          printf '%s  %s\n' '2bc8b6029b11f4dfdf69283ae57f7df3502eee3f80e795765b0b487c70623109' "$RUNNER_TEMP/native.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/native.tar.gz" -C packages/agents-codex
          test -x packages/agents-codex/native/test-bin/exec-server-fixture
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the SDK from the original source
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Apply the fixture correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/agents-codex/test/native/child-turn-events-native.test.ts")
          source = path.read_text()
          before = "task_name: 'policy-child'"
          assert source.count(before) == 1
          path.write_text(source.replace(before, "task_name: 'policy_child'"))
          PY
      - name: Trace the waits without changing the test assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/agents-codex/test/native/child-turn-events-native.test.ts")
          text = path.read_text()
          marker = "it('keeps child tracing policy for explicit starts and active steering'"
          before, case = text.split(marker, 1)
          before = "import { appendFileSync } from 'node:fs';\n" + before
          before += """function traceProbe(stage: string, detail?: unknown) {
            appendFileSync(process.env.TRACE_PROBE_FILE!, JSON.stringify({ stage, detail }) + '\\n');
          }
          """
          def append(needle, extra):
              global case
              assert case.count(needle) == 1, needle
              case = case.replace(needle, needle + "\n" + extra)
          append("      let approvals = 0;", "      traceProbe('loop', { disabled });")
          append("        const span = telemetry.getCurrentSpan()!;", """        traceProbe('check', {
                    steps, hasSpan: Boolean(span), sameTrace: telemetry.getCurrentTrace() === workflow,
                    expectedDisabled: disabled, actualDisabled: span?.context.disabled,
                    includeSensitiveData: span?.context.includeSensitiveData,
                  });""")
          append("        rootId ??= id;", """        traceProbe('model', { root: rootId === id, roots, childModels,
                    outcomes: (Array.isArray(request.input) ? request.input : [])
                      .filter((item) => item?.call_id === 'spawn-policy' && String(item.type).endsWith('output'))
                      .map((item) => String(item.output).slice(0, 380)) });""")
          append("              beforeStep: async () => {", "                traceProbe('beforeStep', { steps });")
          append("                  entered.resolve();", "                  traceProbe('hook entered');")
          append("                  await release.promise;", "                  traceProbe('hook released');")
          append("            approval: () => {", "              traceProbe('approval', { approvals });")
          append("        const { child, turn } = await oneChild(session);", "        traceProbe('one child', { roots, childModels, steps });")
          append("        expect((await turn.wait()).finalOutput).toBe('initial child done');", "        traceProbe('initial turn done');")
          append("            const second = await child.submit('new child turn');", "            traceProbe('second submit returned');")
          append("            await entered.promise;", "            traceProbe('test saw entered');")
          append("            expect(await child.submit('steer active child')).toBe(second);", "            traceProbe('steer returned');")
          append("        expect(approvals).toBe(1);", "        traceProbe('approval checked');")
          path.write_text(before + marker + case)
          PY
      - name: Identify the blocked operation
        run: |
          export TRACE_PROBE_FILE="$RUNNER_TEMP/child-trace-progress.jsonl"
          status=0
          pnpm test:native packages/agents-codex/test/native/child-turn-events-native.test.ts -t 'keeps child tracing policy for explicit starts and active steering' --reporter=verbose || status=1
          cat "$TRACE_PROBE_FILE"
          exit "$status"
