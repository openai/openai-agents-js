name: Diagnose the macOS child-tracing check

on:
  push:
    branches: [ci/bench/js-xl-child-trace-20261105]

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: macos-15-xlarge
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore the exact Mac binaries from the failed job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/openai/openai-agents-js/actions/artifacts/13398682835/zip > "$RUNNER_TEMP/native.tar.gz"
          printf '%s  %s\n' '2bc8b6029b11f4dfdf69283ae57f7df3502eee3f80e795765b0b487c70623109' "$RUNNER_TEMP/native.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/native.tar.gz" -C packages/agents-codex
          test -x packages/agents-codex/native/test-bin/exec-server-fixture
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the SDK from the original source
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Capture the missing trace at its source boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/agents-codex/test/native/child-turn-events-native.test.ts")
          source = path.read_text()
          marker = "it('keeps child tracing policy for explicit starts and active steering'"
          prefix, case = source.split(marker, 1)
          prefix = "import { appendFileSync } from 'node:fs';\n" + prefix
          prefix += """function traceProbe(stage: string, detail?: unknown) {
            appendFileSync(process.env.TRACE_PROBE_FILE!, JSON.stringify({ stage, detail }) + '\\n');
          }
          """
          additions = {
            "      let approvals = 0;": "      traceProbe('loop', {disabled});",
            "        const span = telemetry.getCurrentSpan()!;": """        traceProbe('callback', {
                    disabled, roots, childModels, steps, approvals, holdNextChildStep,
                    hasSpan: Boolean(span), sameTrace: telemetry.getCurrentTrace() === workflow,
                    actualDisabled: span?.context.disabled, sensitive: span?.context.includeSensitiveData,
                  });""",
            "        expect((await turn.wait()).finalOutput).toBe('initial child done');": "        traceProbe('initial done', {disabled, steps});",
            "            const second = await child.submit('new child turn');": "            traceProbe('explicit submit', {disabled, steps});",
            "            await entered.promise;": "            traceProbe('entered', {disabled, steps});",
            "            expect(steered).toBe(second);": "            traceProbe('steered', {disabled, steps});",
            "        model.assertExhausted();": "        traceProbe('loop done', {disabled, steps});",
          }
          for needle, extra in additions.items():
              assert case.count(needle) == 1, needle
              case = case.replace(needle, needle + "\n" + extra)
          path.write_text(prefix + marker + case)
          path = Path("packages/agents-codex/src/runtime/session.ts")
          source = "import { appendFileSync as appendTraceProbe } from 'node:fs';\n" + path.read_text()
          needle = "        const selected = await withNativeCallbackContext(\n"
          assert source.count(needle) == 1
          source = source.replace(needle, """        appendTraceProbe(process.env.TRACE_PROBE_FILE!, JSON.stringify({
                    stage: 'child step event', turnId: owner.turnId, stepIndex: capturedSelection.stepIndex,
                    hasWireContext: typeof event.msg.tracing_context === 'string',
                  }) + '\\n');
          """ + needle)
          path.write_text(source)
          PY
      - name: Identify which child step lost its trace
        run: |
          export TRACE_PROBE_FILE="$RUNNER_TEMP/missing-child-trace.jsonl"
          status=0
          pnpm test:native packages/agents-codex/test/native/child-turn-events-native.test.ts -t 'keeps child tracing policy for explicit starts and active steering' --reporter=verbose || status=1
          cat "$TRACE_PROBE_FILE"
          exit "$status"
