name: Diagnose the macOS child-tracing check

on:
  push:
    branches: [ci/bench/js-xl-child-trace-20261105]

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: macos-15-xlarge
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bbb63439896880fe987a3c19a0be8515c6ae865f
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore the exact Mac binaries from the failed job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/openai/openai-agents-js/actions/artifacts/13398682835/zip > "$RUNNER_TEMP/native.tar.gz"
          printf '%s  %s\n' '2bc8b6029b11f4dfdf69283ae57f7df3502eee3f80e795765b0b487c70623109' "$RUNNER_TEMP/native.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/native.tar.gz" -C packages/agents-codex
          test -x packages/agents-codex/native/test-bin/exec-server-fixture
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the SDK from the original source
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Apply the fixture correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/agents-codex/test/native/child-turn-events-native.test.ts")
          source = path.read_text()
          before = "task_name: 'policy-child'"
          assert source.count(before) == 1
          path.write_text(source.replace(before, "task_name: 'policy_child'"))
          PY
      - name: Run both original Mac child-tracing checks twice
        run: |
          for trial in 1 2; do
            echo "Trial $trial"
            pnpm test:native packages/agents-codex/test/native/child-turn-events-native.test.ts -t 'keeps child tracing policy for explicit starts and active steering'
            pnpm test:native packages/agents-codex/test/native/native-questions.test.ts -t 'keeps original child tracing through question reply and physical handler cleanup'
          done
