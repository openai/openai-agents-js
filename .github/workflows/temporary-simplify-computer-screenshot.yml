name: Simplify computer screenshot capture

on:
  push:
    branches:
      - fix/computer-screenshot-reuse

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/computer-screenshot-reuse

      - name: Apply maintainer-requested simplification
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('packages/agents-core/src/runner/toolExecution.ts')
          text = runtime_path.read_text()

          replacements = [
              (
                  "  let screenshot: string | undefined;\n\n",
                  "",
              ),
              (
                  "      case 'screenshot':\n        screenshot = await computer.screenshot(runContext);\n        break;",
                  "      case 'screenshot':\n        break;",
              ),
              (
                  "    if (action.type !== 'screenshot') {\n      screenshot = undefined;\n    }\n",
                  "",
              ),
              (
                  "  if (typeof screenshot === 'undefined' && typeof computer.screenshot === 'function') {\n    screenshot = await computer.screenshot(runContext);\n    if (signal?.aborted) {\n      return { type: 'cancelled' };\n    }\n  }\n  if (typeof screenshot !== 'undefined') {\n    return { type: 'completed', output: screenshot };\n  }",
                  "  if (typeof computer.screenshot === 'function') {\n    const screenshot = await computer.screenshot(runContext);\n    if (signal?.aborted) {\n      return { type: 'cancelled' };\n    }\n    if (typeof screenshot !== 'undefined') {\n      return { type: 'completed', output: screenshot };\n    }\n  }",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one runtime target, found {count}: {old!r}')
              text = text.replace(old, new)

          runtime_path.write_text(text)

          test_path = Path('packages/agents-core/test/runner/computerScreenshotReuse.test.ts')
          test_text = test_path.read_text()
          old_tests = """describe('computer screenshot observations', () => {
  it('reuses an explicit screenshot as the returned observation', async () => {
    const screenshot = vi
      .fn()
      .mockResolvedValueOnce('requested')
      .mockResolvedValueOnce('unexpected-second-capture');
    const computer = createComputer(screenshot);
    const toolCall: protocol.ComputerUseCallItem = {
      type: 'computer_call',
      callId: 'screenshot-call',
      status: 'completed',
      action: { type: 'screenshot' },
    };

    const items = await execute(toolCall, computer);

    expect(screenshot).toHaveBeenCalledTimes(1);
    expect((items[0] as any).output).toBe(
      'data:image/png;base64,requested',
    );
  });

  it('takes a fresh observation after a later non-screenshot action', async () => {
    const screenshot = vi
      .fn()
      .mockResolvedValueOnce('before')
      .mockResolvedValueOnce('after');
    const computer = createComputer(screenshot);
    const toolCall: protocol.ComputerUseCallItem = {
      type: 'computer_call',
      callId: 'screenshot-then-click',
      status: 'completed',
      actions: [
        { type: 'screenshot' },
        { type: 'click', x: 1, y: 2, button: 'left' },
      ],
    };

    const items = await execute(toolCall, computer);

    expect(computer.click).toHaveBeenCalledTimes(1);
    expect(screenshot).toHaveBeenCalledTimes(2);
    expect((items[0] as any).output).toBe('data:image/png;base64,after');
  });
});
"""
          new_tests = """describe('computer screenshot observations', () => {
  it('captures a standalone screenshot once as the final observation', async () => {
    const screenshot = vi.fn().mockResolvedValueOnce('requested');
    const computer = createComputer(screenshot);
    const toolCall: protocol.ComputerUseCallItem = {
      type: 'computer_call',
      callId: 'screenshot-call',
      status: 'completed',
      action: { type: 'screenshot' },
    };

    const items = await execute(toolCall, computer);

    expect(screenshot).toHaveBeenCalledTimes(1);
    expect((items[0] as any).output).toBe(
      'data:image/png;base64,requested',
    );
  });

  it('captures once after a later non-screenshot action', async () => {
    const screenshot = vi.fn().mockResolvedValueOnce('after');
    const computer = createComputer(screenshot);
    const toolCall: protocol.ComputerUseCallItem = {
      type: 'computer_call',
      callId: 'screenshot-then-click',
      status: 'completed',
      actions: [
        { type: 'screenshot' },
        { type: 'click', x: 1, y: 2, button: 'left' },
      ],
    };

    const items = await execute(toolCall, computer);

    expect(computer.click).toHaveBeenCalledTimes(1);
    expect(screenshot).toHaveBeenCalledTimes(1);
    expect(computer.click.mock.invocationCallOrder[0]).toBeLessThan(
      screenshot.mock.invocationCallOrder[0],
    );
    expect((items[0] as any).output).toBe('data:image/png;base64,after');
  });
});
"""
          if test_text.count(old_tests) != 1:
              raise SystemExit(f'expected exactly one test block, found {test_text.count(old_tests)}')
          test_path.write_text(test_text.replace(old_tests, new_tests))

          changeset_path = Path('.changeset/reuse-computer-screenshot.md')
          changeset = changeset_path.read_text()
          old_summary = 'fix(core): reuse explicit computer screenshots as the returned observation'
          new_summary = 'fix(core): capture one final computer screenshot after each action batch'
          if changeset.count(old_summary) != 1:
              raise SystemExit(f'expected exactly one changeset summary, found {changeset.count(old_summary)}')
          changeset_path.write_text(changeset.replace(old_summary, new_summary))
          PY

      - name: Commit simplification and remove temporary workflow
        run: |
          git rm .github/workflows/temporary-simplify-computer-screenshot.yml
          git add packages/agents-core/src/runner/toolExecution.ts
          git add packages/agents-core/test/runner/computerScreenshotReuse.test.ts
          git add .changeset/reuse-computer-screenshot.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(core): simplify computer screenshot capture"
          git push origin HEAD:fix/computer-screenshot-reuse
