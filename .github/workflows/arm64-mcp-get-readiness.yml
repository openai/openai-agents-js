name: ARM64 MCP GET readiness candidate

on:
  push:
    branches: [mark/nov9-js-mcp-get-readiness-arm64]

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    defaults:
      run:
        working-directory: sdk
    env:
      NATIVE_INPUTS: a22ce0556587982ac0a522b046060a8f49b8b756b7b4d0758534a22c235c6b4f
      OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 91eb0398584a7000cb4afdeda76e17e72e202da7
          path: sdk
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: sdk/package.json
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml
      - name: Verify stock runner and exact source
        run: |
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = 91eb0398584a7000cb4afdeda76e17e72e202da7
          test "$(git rev-parse 'HEAD^{tree}')" = e333a0456584646f489dcce07a345c4afdbfca23
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor-profiles bubblewrap
          if ! bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true
          uname -srmo
          node --version
          pnpm --version
          test "$(cat /sys/module/apparmor/parameters/enabled)" = Y
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
      - name: Restore the exact native transfer
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT: '{"artifact-id":"13762542999","artifact-digest":"07ab0543dfe4fe760b7161b5fbb70e7af7fe95b5fb3d0390e029bf07796eb098"}'
        run: |
          node scripts/restore-native-bundle.mjs
          echo 'f1eb49e7c941324cea7def5336295f05a8b43c47f965a8ea9acfd78798c5bb65  packages/agents-codex/native/codex.node' | sha256sum -c -
          echo 'fa9d51b6678eb0b59060dd7fba07e97b1f1002494a8f8ab597bf203a0a201538  packages/agents-codex/native/build-receipt.json' | sha256sum -c -
      - name: Apply and verify the exact candidate tree
        run: |
          patch="$GITHUB_WORKSPACE/diagnostic/.github/diagnostics/mcp-get-readiness-candidate.patch"
          test "$(sha256sum "$patch" | cut -d' ' -f1)" = 19210453c41eb675db9f7ffe1ca33a38c262e9c9ee3ee7733e7a0ebdb9696d76
          git apply --index "$patch"
          test "$(git write-tree)" = 8e7d0d458731331693e5a41ac1f4516c4466f38d
          test "$(node --input-type=module -e 'import {nativeInputs} from "./scripts/native-bundle-inputs.mjs"; console.log(nativeInputs())')" = "$NATIVE_INPUTS"
          git diff --cached --check
      - name: Build the exact SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Verify the exact fixture without diagnostic instrumentation
        run: |
          out="$RUNNER_TEMP/mcp-get-readiness/exact"
          mkdir -p "$out"
          TMPDIR="$out" pnpm test:native \
            packages/agents-codex/test/native/native-question-ownership.test.ts \
            -t 'declines late unassociated delivery while a successor uses the same server$' \
            --mode full --maxWorkers=1 --reporter=verbose --reporter=json \
            --outputFile.json="$out/vitest.json"
          node --input-type=module - "$out/vitest.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.numPassedTests, 1);
          assert.equal(report.numFailedTests, 0);
          NODE
          (cd "$out" && sha256sum vitest.json > SHA256SUMS)
      - name: Repeat the existing synthetic row with GET lifetime receipts
        env:
          AGENTS_TEST_MCP_GET_TRACE: '1'
        run: |
          patch="$GITHUB_WORKSPACE/diagnostic/.github/diagnostics/mcp-get-readiness-candidate-trace.patch"
          test "$(sha256sum "$patch" | cut -d' ' -f1)" = afa703a6522e7d4be865874c4286c0c10b2a33f425d42f294ca494f38d2b9a5d
          git apply --check "$patch"
          git apply "$patch"
          out="$RUNNER_TEMP/mcp-get-readiness/traces"
          mkdir -p "$out"
          test_file=packages/agents-codex/test/native/native-question-ownership.test.ts
          title='declines late unassociated delivery while a successor uses the same server$'
          run_case() {
            local attempt=$1 code=0
            mkdir -p "$out/$attempt"
            TMPDIR="$out/$attempt" pnpm test:native "$test_file" -t "$title" \
              --mode full --maxWorkers=1 --reporter=verbose \
              > "$out/$attempt/vitest.log" 2>&1 || code=$?
            echo "$code" > "$out/$attempt/exit"
            test -s "$out/$attempt/mcp-get-trace.jsonl"
          }
          for group in 1 2; do
            pids=()
            for lane in 1 2 3 4; do
              run_case "$group-$lane" &
              pids+=("$!")
            done
            for pid in "${pids[@]}"; do wait "$pid"; done
            if grep -qvx 0 "$out"/"$group"-*/exit; then break; fi
          done
          for attempt in "$out"/*; do
            printf '\nTrial %s exit %s\n' "${attempt##*/}" "$(cat "$attempt/exit")"
            cat "$attempt/mcp-get-trace.jsonl"
            grep -E 'No unsolicited GET stream|Tests ' "$attempt/vitest.log" || true
          done
          (cd "$out" && sha256sum */exit */*.jsonl */vitest.log > SHA256SUMS)
          if grep -qvx 0 "$out"/*/exit; then exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: arm64-mcp-get-readiness-candidate-8e7d0d45
          path: ${{ runner.temp }}/mcp-get-readiness
          if-no-files-found: warn
          retention-days: 14
