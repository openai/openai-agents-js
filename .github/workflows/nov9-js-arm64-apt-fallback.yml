name: Nov 9 JS official ARM64 installed qualification

on:
  push:
    branches: [codex/nov9-js-4c5e035d-arm64-apt-fallback]
    paths: [.github/workflows/nov9-js-arm64-apt-fallback.yml]

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    name: Qualify the official JS transfer on stock ARM64
    if: github.repository == 'openai/openai-agents-js'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      ALPHA_VERSION: 0.22.0-alpha.2
      EXPECTED_PLATFORM: linux-arm64
      NATIVE_INPUTS: 12335820ec8eaabae9ac626c03c02f350ba7d752dff37f0d4fadc3ce27121e6f
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3c78a7167ec8cb8dd9cc1285290b3c3b3b3557d9
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify signed source, native inputs and stock ARM64
        run: |
          test "$(git rev-parse HEAD)" = "3c78a7167ec8cb8dd9cc1285290b3c3b3b3557d9"
          test "$(git rev-parse 'HEAD^{tree}')" = "fde7b5fc89b6459753545f51605e0696c50592e2"
          git diff --quiet HEAD --
          grep -qx 'VERSION_CODENAME=noble' /etc/os-release
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          test "$(node -p 'process.platform + "-" + process.arch')" = linux-arm64
          test "$(node --input-type=module -e 'import { nativeInputs } from "./scripts/native-bundle-inputs.mjs"; console.log(nativeInputs())')" = "$NATIVE_INPUTS"
          git show -s --format='%H %T %P'
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -a
          getconf GNU_LIBC_VERSION
          test "$(cat /sys/module/apparmor/parameters/enabled)" = Y
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          echo "AppArmor enabled; unprivileged user namespace restriction = 1"
          evidence="$RUNNER_TEMP/nov9-native-tests"
          mkdir -p "$evidence"
          {
            git show -s --format='%H %T %P'
            printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            uname -a
            node -v
            getconf GNU_LIBC_VERSION
            echo "AppArmor enabled; unprivileged user namespace restriction = 1"
          } > "$evidence/platform-initial.txt"
      - name: Install Linux tools from the authenticated Ubuntu Ports mirror
        run: |
          apt_dir=$(mktemp -d "$RUNNER_TEMP/apt.XXXXXX")
          chmod 755 "$apt_dir"
          mkdir "$apt_dir/sourceparts" "$apt_dir/lists" "$apt_dir/archives"
          cat > "$apt_dir/ubuntu.sources" <<'SOURCES'
          Types: deb
          URIs: https://mirrors.ocf.berkeley.edu/ubuntu-ports/
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          options=(
            -o "Dir::Etc::sourcelist=$apt_dir/ubuntu.sources"
            -o "Dir::Etc::sourceparts=$apt_dir/sourceparts"
            -o "Dir::State::lists=$apt_dir/lists"
            -o "Dir::Cache::archives=$apt_dir/archives"
            -o Acquire::Retries=1
            -o Acquire::https::Timeout=20
            -o Acquire::Languages=none
          )
          sudo apt-get "${options[@]}" --error-on=any update
          packages=(apparmor-profiles bubblewrap)
          sudo apt-get "${options[@]}" install --yes --no-install-recommends "${packages[@]}"
          dpkg-query -W "${packages[@]}"
      - name: Qualify Bubblewrap with AppArmor enabled
        run: |
          if ! bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          uname -sr
          bwrap --version
          bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true
          test "$(cat /sys/module/apparmor/parameters/enabled)" = Y
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          echo "AppArmor enabled; unprivileged user namespace restriction = 1"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - name: Install SDK dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Restore official release transfer 13870449255
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/official-native-linux-arm64.tar.gz"
          evidence="$RUNNER_TEMP/nov9-native-tests"
          mkdir -p "$evidence"
          gh api --method GET repos/openai/openai-agents-js/actions/artifacts/13870449255/zip > "$archive"
          unset GH_TOKEN
          printf '%s  %s\n' c27d27c4fccac7e782e6f1fa7a87d0c34106bf1b62ec2b9d3a7a991c4e807413 "$archive" | sha256sum -c
          tar -xzf "$archive" -C packages/agents-codex
          printf '%s\n' 'Run 43049808803 job 130623664551 artifact 13870449255' \
            'Archive SHA-256 c27d27c4fccac7e782e6f1fa7a87d0c34106bf1b62ec2b9d3a7a991c4e807413' \
            'Native fingerprint 12335820ec8eaabae9ac626c03c02f350ba7d752dff37f0d4fadc3ce27121e6f' \
            > "$evidence/official-transfer.log"
      - name: Verify release native receipts, products and executor
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { verifyNativeReceipt } from './scripts/alpha-package.mjs';
          await verifyNativeReceipt(process.cwd(), 'linux-arm64');
          const receipt = JSON.parse(readFileSync('packages/agents-codex/native/build-receipt.json'));
          assert.equal(Object.keys(receipt.inputs).length, 353);
          const inputMap = Object.fromEntries(Object.keys(receipt.inputs).sort().map((name) => [name, receipt.inputs[name]]));
          const inputDigest = createHash('sha256').update(JSON.stringify(inputMap)).digest('hex');
          assert.equal(inputDigest, '9638d8a17dcd69241b3b31707ed24bcc519e45110c2a04287912c5fa2c75ab91');
          console.log('Native receipt inputs:', Object.keys(inputMap).length, inputDigest);
          assert.equal(receipt.sources.codex.result_tree, '6d41142833d3dc955c4090786dde58118c5aefc7');
          assert.equal(receipt.sources.codex.manifest_sha256, '3d937e936e21d4a9b5e5451ce420c124d5e0884f3099ae402946c027b4387fc2');
          assert.equal(receipt.sources['rust-sdk'].result_tree, '24324fe84298bf5c169e37bcaf8539b29bc6a16c');
          assert.equal(receipt.sources['rust-sdk'].manifest_sha256, '3e947fd3c6567ce7a9183575aad4d7e78d85ffea58306a05da07bc9dd468b463');
          NODE
          package=packages/agents-codex
          executor="$package/native/test-bin/exec-server-fixture"
          test -x "$executor"
          products=("$package/native/codex.node" "$package/bin/codex-sdk-runtime" "$package/bin/codex-code-mode-host" "$package/bin/codex-linux-sandbox" "$package/bin/codex-execve-wrapper" "$executor")
          for product in "${products[@]}"; do
            LC_ALL=C readelf --file-header "$product" | grep -E 'Machine:[[:space:]]+AArch64$'
          done
          evidence="$RUNNER_TEMP/nov9-native-tests"
          mkdir -p "$evidence"
          for product in "${products[@]}"; do
            test "$(stat -c %a "$product")" = 755
          done
          test "$(stat -c %a "$package/native/build-receipt.json")" = 644
          stat -c '%a %n' "$package/native/build-receipt.json" "${products[@]}" | tee "$evidence/native-modes.txt"
          cat > "$evidence/native-SHA256SUMS" <<'SHA256SUMS'
          19e5f33e35a5b21b927d90569d6843121da3289dd47d6f4c61eb09e0b92eebf4  packages/agents-codex/native/build-receipt.json
          18cb12bb7a66b8ee29585fed2ba4998fada54ee2950ea6138e39a991bf7ffc18  packages/agents-codex/native/codex.node
          8e06fcd566f030fa50d306b9abf96d85fb5bb05f9bdaf9a0f0d387e022f30f2f  packages/agents-codex/bin/codex-sdk-runtime
          12e2c3a0881929371d74657b3f5790f40342a26c3c59a5f90a30f2905bc34fd9  packages/agents-codex/bin/codex-code-mode-host
          8e06fcd566f030fa50d306b9abf96d85fb5bb05f9bdaf9a0f0d387e022f30f2f  packages/agents-codex/bin/codex-linux-sandbox
          8e06fcd566f030fa50d306b9abf96d85fb5bb05f9bdaf9a0f0d387e022f30f2f  packages/agents-codex/bin/codex-execve-wrapper
          6eac2b3ac7a03b92279e19bf9f72a14736eb95ff19382ccc59276b7ef29f863a  packages/agents-codex/native/test-bin/exec-server-fixture
          SHA256SUMS
          sha256sum -c "$evidence/native-SHA256SUMS"
          cp "$package/native/build-receipt.json" "$evidence/native-build-receipt.json"
      - name: Build SDK package assets with restored native products
        id: sdk-build
        run: |
          pnpm build
          sha256sum -c "$RUNNER_TEMP/nov9-native-tests/native-SHA256SUMS"
      - name: Prepare the repository OTLP test collector
        id: collector
        run: |
          python3 -m venv "$RUNNER_TEMP/agents-otel-collector"
          "$RUNNER_TEMP/agents-otel-collector/bin/python" -m pip install grpcio==1.85.0 opentelemetry-proto==1.45.1
      - name: Create the release bundles
        id: release-bundles
        if: ${{ !cancelled() && steps.sdk-build.outcome == 'success' }}
        run: |
          evidence="$RUNNER_TEMP/nov9-native-tests"
          mkdir -p "$evidence"
          node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$RUNNER_TEMP/agents-alpha" 2>&1 | tee "$evidence/create-release-bundles.log"
      - name: Test the extracted bundles
        if: ${{ !cancelled() && steps.release-bundles.outcome == 'success' }}
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: |
          node scripts/verify-alpha-package.mjs --directory "$RUNNER_TEMP/agents-alpha" 2>&1 | tee "$RUNNER_TEMP/nov9-native-tests/verify-release-bundles.log"
      - name: Run focused native behavior controls
        if: ${{ !cancelled() && steps.sdk-build.outcome == 'success' && steps.collector.outcome == 'success' }}
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
          NO_COLOR: '1'
          FORCE_COLOR: '0'
          AGENTS_REQUIRE_TRACING_QUALIFICATION: '1'
          OTLP_TEST_PYTHON: ${{ runner.temp }}/agents-otel-collector/bin/python
          CODEX_EXEC_SERVER_TEST_BINARY: ${{ github.workspace }}/packages/agents-codex/native/test-bin/exec-server-fixture
        run: |
          evidence="$RUNNER_TEMP/nov9-native-tests"
          mkdir -p "$evidence"
          export CODEX_HOME="$(mktemp -d "$RUNNER_TEMP/nov9-codex-home.XXXXXX")"
          unset OPENAI_API_KEY OPENAI_IDENTITY_TOKEN_FILE OPENAI_ORG_ID OPENAI_PROJECT_ID
          unset OPENAI_BASE_URL OPENAI_API_BASE CODEX_API_KEY GITHUB_TOKEN GH_TOKEN
          failed=0
          run() {
            local label=$1 status=0
            shift
            pnpm test:native "$@" 2>&1 | tee "$evidence/$label.log" || status=$?
            printf '%s %s\n' "$label" "$status" | tee -a "$evidence/exit-codes.txt"
            if (( status != 0 )); then failed=1; fi
          }
          child=packages/agents-codex/test/native/child-callback-publication-native.test.ts
          trace=packages/agents-codex/test/native/trace-context-native.test.ts
          focused=(--maxWorkers=1 --reporter=verbose)
          run missing-trace-admission "$child" -t '^owns a child callback whose ordered start is held until missing-trace-admission$' "${focused[@]}"
          run graceful-tree-stop "$child" -t '^skips child step callbacks after admission expires at graceful tree stop$' "${focused[@]}"
          run callback-ancestry-recovery "$trace" -t '^exports isolated root and compaction parents, queued snapshots, exact callback ancestry, and fresh-worker manual recovery$' "${focused[@]}"
          run durable-sender packages/agents-codex/test/native/tracing-parity.test.ts -t '^qualifies real native tracing control \(REQ423-429\)$' "${focused[@]}"
          run mailbox-receiver-policy packages/agents-codex/test/native/tracing-parity.test.ts -t '^qualifies real native tracing mailbox-receiver-(scoped|bare)-(disabled|metadata-only|permissive) \(REQ423-429\)$' "${focused[@]}"
          run buffered-raw-observation packages/agents-codex/test/native/raw-provider-events-native.test.ts -t '^captures buffered Responses with model output opt-in=(false|true)$' "${focused[@]}"
          run item-reference-boundaries packages/agents-codex/test/native/model-context-callbacks.test.ts packages/agents-codex/test/native/opaque-history-reference-native.test.ts packages/agents-codex/test/native/canonical-history.test.ts -t '^(prevents dispatch when context transformation is (lossy|throw)|rejects opaque service item references as public input before dispatch|rejects opaque-reference lossy projection in restricted preparation before dispatch|forwards provider item references after native history restore)$' "${focused[@]}"
          run forced-tool-reset packages/agents-codex/test/native/forced-tool-reset-native.test.ts "${focused[@]}"
          for entry in forced-tool-reset:9 missing-trace-admission:1 graceful-tree-stop:1 callback-ancestry-recovery:1 durable-sender:1 mailbox-receiver-policy:6 buffered-raw-observation:2 item-reference-boundaries:5; do
            name=${entry%:*}
            expected=${entry#*:}
            count=$(grep -Ec '^ +✓ .* > ' "$evidence/$name.log" || true)
            test "$count" -eq "$expected" || failed=1
          done
          sha256sum "$evidence"/*.log "$evidence/exit-codes.txt" > "$evidence/SHA256SUMS"
          exit "$failed"
      - name: Record final AppArmor state
        if: always()
        run: |
          test "$(cat /sys/module/apparmor/parameters/enabled)" = Y
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          echo "AppArmor enabled; unprivileged user namespace restriction = 1" | tee "$RUNNER_TEMP/nov9-native-tests/platform-final.txt"
      - name: Upload native and installed qualification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nov9-js-3c78a716-official-arm64-qualification
          path: |
            ${{ runner.temp }}/nov9-native-tests/
            ${{ runner.temp }}/agents-alpha/*.tgz
            ${{ runner.temp }}/agents-alpha/*.tar.gz
            ${{ runner.temp }}/agents-alpha/SHA256SUMS-*
            ${{ runner.temp }}/agents-alpha/build-*.json
            ${{ runner.temp }}/agents-alpha/installed-*.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
