name: Apply review fix 1676

on:
  push:
    branches:
      - fix/twilio-g711-handoff-122

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize Twilio to mu-law only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matched {count} times')
              return text.replace(old, new)

          source_path = Path('packages/agents-extensions/src/TwilioRealtimeTransport.ts')
          source = source_path.read_text()
          source = replace_once(
              source,
              "  if (format === 'g711_ulaw' || format === 'g711_alaw') {\n    return format;\n  }\n",
              "  if (format === 'g711_ulaw') {\n    return format;\n  }\n",
              'legacy format branch',
          )
          source = replace_once(
              source,
              "    (format.type === 'audio/pcmu' || format.type === 'audio/pcma')\n",
              "    format.type === 'audio/pcmu'\n",
              'object format branch',
          )
          source = replace_once(
              source,
              "function toTwilioLegacyAudioFormat(\n  format: LegacyRealtimeAudioConfig['inputAudioFormat'],\n): 'g711_ulaw' | 'g711_alaw' {\n  return format === 'g711_alaw' ? 'g711_alaw' : 'g711_ulaw';\n}\n",
              "function toTwilioLegacyAudioFormat(\n  _format: LegacyRealtimeAudioConfig['inputAudioFormat'],\n): 'g711_ulaw' {\n  return 'g711_ulaw';\n}\n",
              'legacy helper',
          )
          source_path.write_text(source)

          test_path = Path('packages/agents-extensions/test/TwilioRealtimeTransport.test.ts')
          test = test_path.read_text()
          test = replace_once(
              test,
              "  test('preserves explicitly compatible G.711 formats', () => {\n",
              "  test('preserves mu-law and normalizes A-law formats', () => {\n",
              'test title',
          )
          test = replace_once(
              test,
              "      audio: {\n        input: { format: { type: 'audio/pcmu' } },\n        output: { format: 'g711_alaw' },\n      },\n",
              "      audio: {\n        input: { format: { type: 'audio/pcmu' } },\n        output: { format: 'g711_ulaw' },\n      },\n",
              'nested alaw expected output',
          )
          insert_anchor = "  test('validates the Twilio input inactivity timeout', () => {\n"
          insert = (
              "  test('normalizes object PCMA format to mu-law', () => {\n"
              "    const transport = new TwilioRealtimeTransportLayer({\n"
              "      twilioWebSocket: asTwilioWebSocket(new FakeTwilioWebSocket()),\n"
              "    });\n\n"
              "    expect(\n"
              "      transport._setInputAndOutputAudioFormat({\n"
              "        audio: { input: { format: { type: 'audio/pcma' } } },\n"
              "      } as any),\n"
              "    ).toMatchObject({\n"
              "      audio: { input: { format: 'g711_ulaw' } },\n"
              "    });\n"
              "  });\n\n"
          )
          test = replace_once(test, insert_anchor, insert + insert_anchor, 'PCMA regression')
          test_path.write_text(test)
          PY
      - name: Commit patch
        run: |
          rm .github/workflows/apply-review-fix-1676.yml
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add packages/agents-extensions/src/TwilioRealtimeTransport.ts packages/agents-extensions/test/TwilioRealtimeTransport.test.ts .github/workflows/apply-review-fix-1676.yml
          git commit -m "fix(extensions): normalize Twilio audio to mu-law"
          git push origin HEAD:${GITHUB_REF_NAME}
