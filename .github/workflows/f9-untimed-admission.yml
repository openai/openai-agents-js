name: F9 untimed Docker admission

on:
  push:
    branches: ['ci/f9-untimed-admission']
    paths:
      - '.github/workflows/f9-untimed-admission.yml'
      - 'scripts/benchmarks/agents-parity/hosted-admission.mjs'
      - 'scripts/benchmarks/agents-parity/fixtures/f9-r4-warm-server.mjs'

permissions:
  contents: read

jobs:
  admission:
    if: github.repository == 'openai/openai-agents-js' && github.event_name == 'push' && github.ref == 'refs/heads/ci/f9-untimed-admission'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      F9_OWNER: ${{ github.run_id }}:${{ github.run_attempt }}
    steps:
      - name: Checkout exact test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare exact Node runtime
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.11.1'
          check-latest: false
          package-manager-cache: false
      - name: Prepare existing pinned Docker test image
        run: docker pull docker.io/library/python:3.14-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
      - name: Admit boundary without SDK execution or timing
        run: node scripts/benchmarks/agents-parity/hosted-admission.mjs
      - name: Remove only this run's owned container
        if: ${{ always() && steps.node.outcome == 'success' }}
        run: node scripts/benchmarks/agents-parity/hosted-admission.mjs --cleanup
      - name: Retain untimed admission receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: f9-untimed-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f9-untimed-admission-result/*.json
          if-no-files-found: warn
          retention-days: 7
