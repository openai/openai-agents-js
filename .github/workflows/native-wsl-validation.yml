name: Native WSL capability probe

on:
  push:
    branches: [markstuart/native-wsl-validation]
  workflow_dispatch:

permissions: {}

jobs:
  capabilities:
    if: github.ref == 'refs/heads/markstuart/native-wsl-validation'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Probe real WSL2 and WSLg prerequisites
        timeout-minutes: 13
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $reportPath = Join-Path $env:RUNNER_TEMP 'native-wsl-capabilities.json'
          $report = [ordered]@{
            schema_version = 1
            probe_only = $true
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            capabilities = [ordered]@{}
          }
          $names = @('wsl2_launch', 'linux_tools', 'windows_interop', 'interop_bind_alias', 'no_proc_prerequisites', 'root_reentry', 'wslg_duplicate_root')
          foreach ($name in $names) {
            $report.capabilities[$name] = @{ status = 'not_run' }
          }
          function Save-Report {
            $report | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $reportPath
          }
          function Invoke-Wsl([string] $Stage, [string[]] $Arguments) {
            # Windows-generated here-strings must reach Linux shells with LF endings.
            $Arguments = @($Arguments | ForEach-Object { $_.Replace("`r`n", "`n").Replace("`r", "`n") })
            $output = & wsl.exe @Arguments 2>&1 | Out-String
            $code = $LASTEXITCODE
            $output = $output.Replace("`0", '').Trim()
            if ($code -ne 0) {
              $failure = [Exception]::new('WSL command failed.')
              $failure.Data['native_exit_code'] = $code
              $failure.Data['stage'] = $Stage
              $check = [regex]::Match($output, '(?m)^probe-check=(script_start|linux_tools|package_index|package_install|create_probe_user|nonroot_tools|wsl_directory|interop_environment|interop_socket|init_binary|powershell_path|powershell_binary|powershell_execution|powershell_marker|alias_namespace|fresh_proc|no_proc|distro_environment|wsl_path|wsl_binary|root_execution|root_marker|wslg_directory|wslg_identity)\r?$')
              if ($check.Success) { $failure.Data['check'] = $check.Groups[1].Value }
              $failure.Data['error_codes'] = @([regex]::Matches($output, '(?:Wsl/[A-Za-z0-9_/-]+|HCS_E_[A-Z0-9_]+|0x[0-9A-Fa-f]{8})') | ForEach-Object { $_.Value } | Select-Object -Unique)
              throw $failure
            }
            return $output
          }
          function Test-Capability([string] $Name, [scriptblock] $Probe) {
            try {
              & $Probe | Out-Null
              $report.capabilities[$Name] = @{ status = 'passed' }
            } catch {
              # Keep native output and environment values out of public diagnostics.
              $report.capabilities[$Name] = @{ status = 'failed' }
              if ($_.Exception.Data.Contains('stage')) {
                $report.capabilities[$Name].stage = $_.Exception.Data['stage']
              }
              if ($_.Exception.Data.Contains('check')) {
                $report.capabilities[$Name].check = $_.Exception.Data['check']
              }
              if ($_.Exception.Data.Contains('native_exit_code')) {
                $report.capabilities[$Name].native_exit_code = $_.Exception.Data['native_exit_code']
                $report.capabilities[$Name].error_codes = $_.Exception.Data['error_codes']
              }
            }
            Save-Report
            Write-Host "$Name`: $($report.capabilities[$Name].status)"
          }
          function Invoke-Linux([string] $Stage, [string] $Script, [string] $User = 'wslprobe') {
            $directory = Join-Path $env:RUNNER_TEMP ("native-wsl-script-" + [guid]::NewGuid().ToString('N'))
            [System.IO.Directory]::CreateDirectory($directory) | Out-Null
            try {
              $path = Join-Path $directory 'probe.sh'
              $preamble = @'
          set -euo pipefail
          check=script_start
          trap 'printf "probe-check=%s\n" "$check" >&2' ERR
          '@
              $body = ("$preamble`n$Script`n").Replace("`r`n", "`n").Replace("`r", "`n")
              [System.IO.File]::WriteAllText($path, $body, [System.Text.UTF8Encoding]::new($false))
              $linuxPath = Invoke-Wsl -Stage "$($Stage)_path" -Arguments @('-d', 'Ubuntu-24.04', '-u', $User, '--exec', 'wslpath', '-u', $path)
              Invoke-Wsl -Stage $Stage -Arguments @('-d', 'Ubuntu-24.04', '-u', $User, '--exec', '/bin/bash', $linuxPath) | Out-Null
            } finally {
              Remove-Item -LiteralPath $directory -Recurse -Force
            }
          }
          Save-Report
          Test-Capability 'wsl2_launch' {
            $version = Invoke-Wsl -Stage 'version' -Arguments @('--version')
            $report['versions'] = [ordered]@{}
            foreach ($match in [regex]::Matches($version, '(?im)^(WSL|Kernel|WSLg|MSRDC|Direct3D|DXCore|Windows) version:\s*([0-9][0-9A-Za-z.+()-]*)\s*$')) {
              $report.versions[$match.Groups[1].Value] = $match.Groups[2].Value
            }
            $status = Invoke-Wsl -Stage 'status' -Arguments @('--status')
            if ($status -match '(?im)^Default Version:\s*([12])\s*$') {
              $report['default_wsl_version'] = [int] $Matches[1]
            }
            Save-Report
            Invoke-Wsl -Stage 'set_default_wsl2' -Arguments @('--set-default-version', '2') | Out-Null
            Invoke-Wsl -Stage 'install_distro' -Arguments @('--install', '-d', 'Ubuntu-24.04', '--no-launch', '--web-download') | Out-Null
            $report['distro_registered'] = $false
            $list = Invoke-Wsl -Stage 'list_distro_version' -Arguments @('--list', '--verbose')
            if ($list -match '(?m)^\s*\*?\s*Ubuntu-24\.04\s+\S+\s+([12])\s*$') {
              $report['distro_registered'] = $true
              $report['distro_version_before_conversion'] = [int] $Matches[1]
            }
            Save-Report
            if (-not $report.distro_registered) {
              $failure = [Exception]::new('Installed distro registration is not visible.')
              $failure.Data['stage'] = 'verify_registration'
              throw $failure
            }
            if ($report.distro_version_before_conversion -eq 1) {
              Invoke-Wsl -Stage 'convert_wsl1_to_wsl2' -Arguments @('--set-version', 'Ubuntu-24.04', '2') | Out-Null
              $list = Invoke-Wsl -Stage 'verify_conversion' -Arguments @('--list', '--verbose')
            }
            if ($list -notmatch '(?m)^\s*\*?\s*Ubuntu-24\.04\s+\S+\s+2\s*$') {
              $failure = [Exception]::new('The registered probe distro is not listed as WSL2.')
              $failure.Data['stage'] = 'verify_wsl2'
              throw $failure
            }
            Invoke-Linux -Stage 'launch_linux' -User root -Script 'test "$(uname -s)" = Linux'
          }
          if ($report.capabilities.wsl2_launch.status -eq 'passed') {
            Test-Capability 'linux_tools' {
              Invoke-Linux -Stage 'install_linux_tools' -User root -Script @'
          check=linux_tools
          export DEBIAN_FRONTEND=noninteractive
          check=package_index
          apt-get update >/dev/null
          check=package_install
          apt-get install --yes --no-install-recommends bubblewrap util-linux bash coreutils >/dev/null
          check=create_probe_user
          useradd --create-home --shell /bin/bash wslprobe
          '@
              Invoke-Linux -Stage 'nonroot_tools' -Script 'check=nonroot_tools; test "$(id -u)" -ne 0; test -x /usr/bin/unshare; test -x /usr/bin/mount; test -x /usr/bin/bwrap'
            }
          }
          if ($report.capabilities.linux_tools.status -eq 'passed') {
            # Use the real WSL-provided socket and Windows executable paths.
            $interop = @'
          check=wsl_directory
          test -d /run/WSL
          check=interop_environment
          test -n "${WSL_INTEROP:-}"
          check=interop_socket
          test -S "$WSL_INTEROP"
          check=init_binary
          test -x /init
          check=powershell_path
          ps="$(wslpath -u 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe')"
          check=powershell_binary
          test -x "$ps"
          check=powershell_execution
          baseline="$(timeout 20s "$ps" -NoProfile -NonInteractive -Command 'Write-Output interop-baseline-ok' | tr -d '\r')"
          check=powershell_marker
          test "$baseline" = interop-baseline-ok
          '@
            Test-Capability 'windows_interop' { Invoke-Linux -Stage 'windows_interop' -Script $interop }
            Test-Capability 'interop_bind_alias' {
              Invoke-Linux -Stage 'interop_bind_alias' -Script ($interop + "`n" + @'
          alias_dir="$(mktemp -d)"
          trap 'rmdir "$alias_dir"' EXIT
          check=alias_namespace
          unshare --user --map-root-user --mount --propagation private -- /bin/bash -c '
            set -euo pipefail
            mount --bind /run/WSL "$1"
            trap '\''umount "$1"'\'' EXIT
            export WSL_INTEROP="$1/${WSL_INTEROP##*/}"
            alias_result="$(timeout 20s "$2" -NoProfile -NonInteractive -Command "Write-Output alias-baseline-ok" | tr -d "\r")"
            test "$alias_result" = alias-baseline-ok
            direct_result="$(timeout 20s bash -c '\''exec -a "$1" /init "$1" -NoProfile -NonInteractive -Command "Write-Output direct-init-baseline-ok"'\'' bash "$2" | tr -d "\r")"
            test "$direct_result" = direct-init-baseline-ok
          ' bash "$alias_dir" "$ps"
          '@)
            }
            Test-Capability 'no_proc_prerequisites' {
              Invoke-Linux -Stage 'no_proc_prerequisites' -Script ($interop + "`n" + @'
          # Check namespace and procfs support, without claiming an SDK assertion ran.
          check=fresh_proc
          bwrap --ro-bind / / --dev /dev --unshare-pid --proc /proc -- /bin/sh -c 'test -r /proc/self/status'
          check=no_proc
          bwrap --ro-bind / / --dev /dev --unshare-pid --tmpfs /proc -- /bin/sh -c 'test ! -e /proc/1'
          '@)
            }
            Test-Capability 'root_reentry' {
              Invoke-Linux -Stage 'root_reentry' -Script @'
          check=wsl_directory
          test -d /run/WSL
          check=distro_environment
          test -n "${WSL_DISTRO_NAME:-}"
          test "$WSL_DISTRO_NAME" = Ubuntu-24.04
          check=wsl_path
          wsl="$(wslpath -u 'C:\Windows\System32\wsl.exe')"
          check=wsl_binary
          test -x "$wsl"
          check=root_execution
          root_uid="$(timeout 20s "$wsl" -d "$WSL_DISTRO_NAME" -u root -- /usr/bin/id -u | tr -d '\r')"
          check=root_marker
          test "$root_uid" = 0
          '@
            }
            Test-Capability 'wslg_duplicate_root' {
              Invoke-Linux -Stage 'wslg_duplicate_root' -Script @'
          check=wslg_directory
          test -d /mnt/wslg/distro
          test ! -L /mnt/wslg/distro
          check=wslg_identity
          root_identity="$(stat -c '%d:%i' /)"
          alias_identity="$(stat -c '%d:%i' /mnt/wslg/distro)"
          test "$root_identity" = "$alias_identity"
          '@
            }
          }
          $incomplete = @($report.capabilities.Values | Where-Object { $_.status -ne 'passed' })
          if ($incomplete.Count -ne 0) {
            throw 'Required host capabilities failed or were not run. No SDK build or runtime test ran.'
          }
      - name: Publish capability JSON and summary
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $reportPath = Join-Path $env:RUNNER_TEMP 'native-wsl-capabilities.json'
          if (-not (Test-Path -LiteralPath $reportPath)) {
            'Capability report unavailable. Probe did not complete.' >> $env:GITHUB_STEP_SUMMARY
            throw 'Capability report unavailable.'
          }
          $json = Get-Content -Raw -LiteralPath $reportPath
          $report = $json | ConvertFrom-Json
          @('# WSL host capabilities', '', 'Capability probe only. No SDK compilation or runtime tests ran.', '', '| Capability | Status |', '| --- | --- |') >> $env:GITHUB_STEP_SUMMARY
          foreach ($capability in $report.capabilities.PSObject.Properties) {
            "| $($capability.Name) | $($capability.Value.status) |" >> $env:GITHUB_STEP_SUMMARY
          }
          @('', '```json', $json, '```') >> $env:GITHUB_STEP_SUMMARY
          Write-Output $json
          $incomplete = @($report.capabilities.PSObject.Properties | Where-Object { $_.Value.status -ne 'passed' })
          if ($incomplete.Count -ne 0) {
            throw 'Capability report contains failed or unexecuted prerequisites.'
          }
