name: Apply fix 466

on:
  push:
    branches:
      - feat/realtime-session-payload-transform-466

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matched {count} times')
              return text.replace(old, new)

          source_path = Path('packages/agents-realtime/src/openaiRealtimeBase.ts')
          source = source_path.read_text()

          source = replace_once(
              source,
              """  /**\n   * The API key to use for the connection.\n   */\n  apiKey?: ApiKey;\n};\n""",
              """  /**\n   * The API key to use for the connection.\n   */\n  apiKey?: ApiKey;\n  /**\n   * Optional hook for rewriting SDK-managed `session.update` payloads before\n   * they are sent. This allows Realtime-compatible providers with a different\n   * session schema to adapt the normalized OpenAI payload.\n   */\n  transformSessionPayload?: RealtimeSessionPayloadTransformer;\n};\n""",
              'options',
          )

          source = replace_once(
              source,
              """export type RealtimeSessionPayload = { type: 'realtime' } & Record<string, any>;\n\nfunction normalizeRealtimeMessageContent(\n""",
              """export type RealtimeSessionPayload = { type: 'realtime' } & Record<string, any>;\n\n/**\n * Shape sent inside a `session.update` event after optional transport-level rewriting.\n */\nexport type RealtimeSessionUpdatePayload = Record<string, any>;\n\n/**\n * Rewrites a normalized OpenAI Realtime session payload before it is sent in\n * a `session.update` event.\n */\nexport type RealtimeSessionPayloadTransformer = (\n  payload: RealtimeSessionPayload,\n) => RealtimeSessionUpdatePayload;\n\nfunction normalizeRealtimeMessageContent(\n""",
              'payload types',
          )

          source = replace_once(
              source,
              """  #model: string;\n  #apiKey: ApiKey | undefined;\n  #tracingConfig: RealtimeTracingConfig | null = null;\n""",
              """  #model: string;\n  #apiKey: ApiKey | undefined;\n  #transformSessionPayload: RealtimeSessionPayloadTransformer | undefined;\n  #tracingConfig: RealtimeTracingConfig | null = null;\n""",
              'private field',
          )

          source = replace_once(
              source,
              """    this.#model = options.model ?? DEFAULT_OPENAI_REALTIME_MODEL;\n    this.#apiKey = options.apiKey;\n  }\n""",
              """    this.#model = options.model ?? DEFAULT_OPENAI_REALTIME_MODEL;\n    this.#apiKey = options.apiKey;\n    this.#transformSessionPayload = options.transformSessionPayload;\n  }\n""",
              'constructor',
          )

          source = replace_once(
              source,
              """  buildSessionPayload(\n    config: Partial<RealtimeSessionConfig>,\n  ): RealtimeSessionPayload {\n    return this._getMergedSessionConfig(config);\n  }\n\n  private static buildTurnDetectionConfig(\n""",
              """  buildSessionPayload(\n    config: Partial<RealtimeSessionConfig>,\n  ): RealtimeSessionPayload {\n    return this._getMergedSessionConfig(config);\n  }\n\n  protected _sendSessionUpdate(payload: RealtimeSessionPayload): void {\n    const session = this.#transformSessionPayload?.(payload) ?? payload;\n    this.sendEvent({\n      type: 'session.update',\n      session,\n    });\n  }\n\n  private static buildTurnDetectionConfig(\n""",
              'send helper',
          )

          blocks = [
              (
                  """      this.sendEvent({\n        type: 'session.update',\n        session: {\n          type: 'realtime',\n          tracing: 'auto',\n        },\n      });\n""",
                  """      this._sendSessionUpdate({\n        type: 'realtime',\n        tracing: 'auto',\n      });\n""",
                  'tracing auto',
              ),
              (
                  """      this.sendEvent({\n        type: 'session.update',\n        session: {\n          type: 'realtime',\n          tracing: null,\n        },\n      });\n""",
                  """      this._sendSessionUpdate({\n        type: 'realtime',\n        tracing: null,\n      });\n""",
                  'tracing null',
              ),
              (
                  """      this.sendEvent({\n        type: 'session.update',\n        session: {\n          type: 'realtime',\n          tracing: tracingConfig,\n        },\n      });\n""",
                  """      this._sendSessionUpdate({\n        type: 'realtime',\n        tracing: tracingConfig,\n      });\n""",
                  'tracing initial',
              ),
          ]
          for old, new, label in blocks:
              source = replace_once(source, old, new, label)

          final_tracing = """    this.sendEvent({\n      type: 'session.update',\n      session: {\n        type: 'realtime',\n        tracing: tracingConfig,\n      },\n    });\n"""
          source = replace_once(
              source,
              final_tracing,
              """    this._sendSessionUpdate({\n      type: 'realtime',\n      tracing: tracingConfig,\n    });\n""",
              'tracing final',
          )

          source = replace_once(
              source,
              """  updateSessionConfig(config: Partial<RealtimeSessionConfig>): void {\n    const sessionData = this.buildSessionPayload(config);\n\n    this.sendEvent({\n      type: 'session.update',\n      session: sessionData,\n    });\n  }\n""",
              """  updateSessionConfig(config: Partial<RealtimeSessionConfig>): void {\n    const sessionData = this.buildSessionPayload(config);\n    this._sendSessionUpdate(sessionData);\n  }\n""",
              'session config update',
          )
          source_path.write_text(source)

          index_path = Path('packages/agents-realtime/src/index.ts')
          index = index_path.read_text()
          index = replace_once(
              index,
              """  RealtimeSessionPayload,\n} from './openaiRealtimeBase';\n""",
              """  RealtimeSessionPayload,\n  RealtimeSessionPayloadTransformer,\n  RealtimeSessionUpdatePayload,\n} from './openaiRealtimeBase';\n""",
              'exports',
          )
          index_path.write_text(index)

          test_path = Path('packages/agents-realtime/test/sessionPayloadTransform.test.ts')
          test_path.write_text("""import { describe, expect, it, vi } from 'vitest';\n\nimport type { RealtimeClientMessage } from '../src/clientMessages';\nimport { OpenAIRealtimeBase } from '../src/openaiRealtimeBase';\n\nclass TestBase extends OpenAIRealtimeBase {\n  status: 'connected' | 'disconnected' | 'connecting' | 'disconnecting' =\n    'connected';\n  events: RealtimeClientMessage[] = [];\n  connect = vi.fn(async () => {});\n  sendEvent(event: RealtimeClientMessage) {\n    this.events.push(event);\n  }\n  mute = vi.fn();\n  close = vi.fn();\n  interrupt = vi.fn();\n  get muted() {\n    return false;\n  }\n\n  updateTracing(tracing: 'auto' | null) {\n    this._updateTracingConfig(tracing);\n  }\n}\n\ndescribe('Realtime session payload transform', () => {\n  it('rewrites SDK-managed session updates', () => {\n    const base = new TestBase({\n      transformSessionPayload: (payload) => {\n        const { type: _type, output_modalities: _modalities, audio, ...rest } =\n          payload;\n        return {\n          ...rest,\n          modalities: ['audio', 'text'],\n          voice: audio?.output?.voice,\n        };\n      },\n    });\n\n    base.updateSessionConfig({ instructions: 'hi', voice: 'echo' });\n\n    expect(base.events).toHaveLength(1);\n    expect(base.events[0]?.session).toMatchObject({\n      instructions: 'hi',\n      model: 'gpt-realtime-2.1',\n      modalities: ['audio', 'text'],\n      voice: 'echo',\n    });\n    expect(base.events[0]?.session.type).toBeUndefined();\n    expect(base.events[0]?.session.output_modalities).toBeUndefined();\n    expect(base.events[0]?.session.audio).toBeUndefined();\n  });\n\n  it('keeps buildSessionPayload canonical', () => {\n    const base = new TestBase({\n      transformSessionPayload: ({ type: _type, ...rest }) => rest,\n    });\n\n    const payload = base.buildSessionPayload({ instructions: 'hi' });\n\n    expect(payload.type).toBe('realtime');\n    expect(payload.output_modalities).toEqual(['audio']);\n  });\n\n  it('also rewrites tracing session updates', () => {\n    const base = new TestBase({\n      transformSessionPayload: ({ type: _type, ...rest }) => rest,\n    });\n\n    base.updateTracing('auto');\n\n    expect(base.events).toEqual([\n      {\n        type: 'session.update',\n        session: { tracing: 'auto' },\n      },\n    ]);\n  });\n});\n""")
          PY

      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/apply-fix-466.yml
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add packages/agents-realtime/src/openaiRealtimeBase.ts packages/agents-realtime/src/index.ts packages/agents-realtime/test/sessionPayloadTransform.test.ts .github/workflows/apply-fix-466.yml
          git commit -m "feat(realtime): add session payload transform hook"
          git push origin HEAD:${GITHUB_REF_NAME}
