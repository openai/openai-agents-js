name: Check the managed local command on Apple Silicon
on:
  push:
    branches: [test/managed-macos-command-qualification-20261104]

permissions:
  contents: read

jobs:
  package:
    name: Build and test the exact JS SDK package
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      ALPHA_VERSION: 0.22.0-alpha.1
      EXPECTED_PLATFORM: darwin-arm64
      QUALIFIED_SDK_COMMIT: 870938847d43d628657867861eaaf48b092f6fbf
      QUALIFIED_SDK_TREE: 811ab6844c983ef34d859182ad87f9886d1b0104
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 870938847d43d628657867861eaaf48b092f6fbf
          persist-credentials: false
      - name: Check exact source
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SDK_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$QUALIFIED_SDK_TREE"
          sw_vers
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm

      - name: Check runner platform
        run: |
          node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'

      - name: Install Rust
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-target" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf protobuf openssl@3
      - name: Restore the Rust downloads
        id: rust-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            packages/agents/native/.cache/v8
          key: js-managed-macos-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('packages/agents/native/Cargo.lock') }}
      - name: Build the SDK and native runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node packages/agents/scripts/native.mjs package
      - name: Build the macOS WSS test fixture
        if: runner.os == 'macOS'
        working-directory: packages/agents/native
        run: |
          # Reuse the verified V8 files and target from native.mjs package.
          export RUSTY_V8_ARCHIVE="$PWD/.cache/v8/librusty_v8_ptrcomp_sandbox_release_aarch64-apple-darwin.a.gz"
          export RUSTY_V8_SRC_BINDING_PATH="$PWD/.cache/v8/src_binding_ptrcomp_sandbox_release_aarch64-apple-darwin.rs"
          cargo build --locked --release --example exec-server-fixture
          fixture="$CARGO_TARGET_DIR/release/examples/exec-server-fixture"
          test -x "$fixture"
          echo "CODEX_EXEC_SERVER_TEST_BINARY=$fixture" >> "$GITHUB_ENV"
      - name: Save the Rust downloads
        if: ${{ !cancelled() && steps.rust-downloads.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            packages/agents/native/.cache/v8
          key: js-managed-macos-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('packages/agents/native/Cargo.lock') }}
      - name: Check the portable sleep fixture on macOS
        run: |
          test -x /bin/sleep
          /bin/sleep 0
          PATH=/usr/bin:/bin /bin/sh -c 'command -v sleep; exec sleep 0'
      - name: Qualify local executor grants on macOS
        if: runner.os == 'macOS'
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: >-
          pnpm test:native packages/agents/test/native/local-executor-policy-native.test.ts
          -t 'blocks delegation from a local command to launchd|joins a detached local child at|joins an interrupted local command|joins a yielded local process|applies a per-turn write policy|keeps the opening write policy on a WSS executor that reports macOS|rejects a local executor grant to the runtime home'
          --reporter=verbose
      - name: Qualify native cancellation and model-step resume on macOS
        run: |
          pnpm test:native packages/agents/test/native/executor-stop-native.test.ts \
            -t 'fences a direct result before native' --maxWorkers=1 --reporter=verbose
          pnpm test:native packages/agents/test/native/model-preparation-cap.test.ts \
            --maxWorkers=1 --reporter=verbose
          pnpm test:native packages/agents/test/native/executor-receipt-resume-native.test.ts \
            -t 'can attach a trusted implicit remote executor' --maxWorkers=1 --reporter=verbose
          pnpm test:native \
            packages/agents/test/native/embedded-commands.test.ts \
            packages/agents/test/native/turn-controls.test.ts \
            packages/agents/test/native/parity-child-manual.test.ts \
            -t 'returns the actual native compact Turn|lets a graceful exact stop preserve|accepts a live child manual reply' \
            --maxWorkers=1 --reporter=verbose
          pnpm test:native packages/agents/test/native/compaction-late-admission-native.test.ts \
            --maxWorkers=1 --reporter=verbose
      - name: Create the release bundles
        run: node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$RUNNER_TEMP/agents-alpha"
      - name: Test the extracted bundles
        run: node scripts/verify-alpha-package.mjs --directory "$RUNNER_TEMP/agents-alpha"
      - name: Verify launchd denial from the installed npm package
        id: install
        run: |
          cat > "$RUNNER_TEMP/js-install.mjs" <<'INSTALL'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { cpSync, readFileSync, realpathSync } from "node:fs";
          import { join, sep } from "node:path";
          import { pathToFileURL } from "node:url";

          const checkout = process.argv[2];
          const { hashes, verifyArtifactDirectory } = await import(
            pathToFileURL(join(checkout, "scripts/verify-alpha-package.mjs"))
          );
          const { verifyNativeReceipt, verifyStarterLock } = await import(
            pathToFileURL(join(checkout, "scripts/alpha-package.mjs"))
          );
          const { ARTIFACT_DIRECTORY, PRODUCER_SDK, RECEIPT_SOURCE, RUNNER_TEMP } =
            process.env;
          assert.equal(process.platform + "-" + process.arch, "darwin-arm64");
          const build = await verifyArtifactDirectory(ARTIFACT_DIRECTORY);
          assert.equal(build.sourceCommit, PRODUCER_SDK);
          const readJson = (path) => JSON.parse(readFileSync(path, "utf8"));
          for (const profile of ["starter", "app"]) {
            const installed = readJson(
              join(ARTIFACT_DIRECTORY, `installed-${profile}-darwin-arm64.json`),
            );
            assert.equal(installed.profile, profile);
            assert(installed.verified.includes("native-receipt"));
            for (const field of Object.keys(build))
              assert.deepEqual(installed[field], build[field]);
          }

          execFileSync("/usr/bin/tar", [
            "-xzf",
            join(ARTIFACT_DIRECTORY, build.starter.archive),
            "-C",
            RUNNER_TEMP,
          ]);
          const consumer = join(RUNNER_TEMP, "agents-starter");
          const manifest = readJson(join(consumer, "package.json"));
          for (const [name, record] of Object.entries(build.packages)) {
            assert.equal(
              manifest.dependencies[name],
              `file:vendor/agents/${record.archive}`,
            );
            assert.equal(
              (await hashes(join(consumer, "vendor/agents", record.archive))).sha256,
              record.sha256,
            );
          }
          verifyStarterLock(
            readJson(join(consumer, "package-lock.json")),
            build.packages,
          );
          const npm = join(process.execPath, "../../lib/node_modules/npm/bin/npm-cli.js");
          execFileSync(process.execPath, [npm, "ci", "--ignore-scripts"], {
            cwd: consumer,
            env: { ...process.env, NODE_PATH: "", PATH: "" },
            stdio: "inherit",
          });

          const installed = realpathSync(join(consumer, "node_modules/@openai/agents"));
          assert(installed.startsWith(realpathSync(consumer) + sep));
          const checked = join(RECEIPT_SOURCE, "packages/agents");
          const nativeReceipt = readJson(join(installed, "native/build-receipt.json"));
          const inputs = execFileSync(
            "git",
            [
              "ls-files",
              "--",
              "native/CODEX_REVISION",
              "native/Cargo.toml",
              "native/Cargo.lock",
              "native/build.rs",
              "native/tests/fixtures/exec_server.rs",
              "native/rust",
              "native/patches",
              "native/rmcp-patches",
              "scripts",
            ],
            { cwd: join(checkout, "packages/agents"), encoding: "utf8" },
          )
            .trim()
            .split("\n");
          assert.deepEqual(Object.keys(nativeReceipt.inputs).sort(), inputs.sort());
          cpSync(
            join(installed, "native/build-receipt.json"),
            join(checked, "native/build-receipt.json"),
          );
          cpSync(
            join(installed, "native/codex.node"),
            join(checked, "native/codex.node"),
          );
          cpSync(join(installed, "bin"), join(checked, "bin"), { recursive: true });
          const { revision } = await verifyNativeReceipt(RECEIPT_SOURCE, build.platform);
          assert.equal(revision, build.codexRevision);

          execFileSync(
            process.execPath,
            [
              "--input-type=module",
              "-e",
              `
            import assert from 'node:assert/strict';
            import { createRequire } from 'node:module';
            import { fileURLToPath } from 'node:url';
            const root = process.env.INSTALLED_AGENT_ROOT;
            const sdk = fileURLToPath(import.meta.resolve('@openai/agents'));
            assert(sdk.startsWith(root + '/dist/'), sdk);
            const { Environment } = await import('@openai/agents');
            assert.equal(typeof Environment.local, 'function');
            const require = createRequire(import.meta.url);
            const native = root + '/native/codex.node';
            assert.equal(typeof require(native).create_engine, 'function');
            console.log('Loaded installed SDK and native addon', sdk, native);
          `,
            ],
            {
              cwd: consumer,
              env: { ...process.env, NODE_PATH: "", INSTALLED_AGENT_ROOT: installed },
              stdio: "inherit",
            },
          );
          console.log(
            "Verified native source, products and installed package",
            build.sourceCommit,
            revision,
          );
          INSTALL
          TEST_FILE=packages/agents/test/native/local-executor-policy-native.test.ts
          set -euo pipefail
          checkout="$PWD"
          artifacts="$RUNNER_TEMP/agents-alpha"
          stage="$RUNNER_TEMP/native-receipt-source"
          mkdir "$stage"
          git archive HEAD packages/agents | tar -x -C "$stage"

          export ARTIFACT_DIRECTORY="$artifacts" RECEIPT_SOURCE="$stage"
          export PRODUCER_SDK="$QUALIFIED_SDK_COMMIT"
          node "$RUNNER_TEMP/js-install.mjs" "$checkout"
          consumer="$RUNNER_TEMP/agents-starter"
          test_dir="$consumer/test/native"
          mkdir -p "$test_dir"
          cp "$TEST_FILE" "$test_dir/"
          cp -R packages/agents/test/native/fixtures "$test_dir/"
          ln -s "$checkout/node_modules/vitest" "$consumer/node_modules/vitest"
          printf 'export default {};\n' > "$consumer/vitest.config.mjs"
          cd "$consumer"
          unset NODE_PATH OPENAI_API_KEY
          export OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX=1
          node "$checkout/node_modules/vitest/vitest.mjs" run \
            --pool=forks --maxWorkers=1 --root "$consumer" --config "$consumer/vitest.config.mjs" \
            "test/native/${TEST_FILE##*/}" -t '^blocks delegation from a local command to launchd$' \
            --reporter=verbose --reporter=json --outputFile.json="$RUNNER_TEMP/launchd.json"

          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/launchd.json', 'utf8'));
          const cases = report.testResults.flatMap(({ assertionResults }) =>
            assertionResults.filter(({ status }) => status === 'passed')
          );
          assert.equal(cases.length, 1);
          assert.equal(cases[0].fullName, 'blocks delegation from a local command to launchd');
          const native = JSON.parse(readFileSync('node_modules/@openai/agents/native/build-receipt.json', 'utf8'));
          const evidence = { sourceCommit: process.env.PRODUCER_SDK, platform: process.platform + '-' + process.arch,
            test: cases[0].fullName, status: cases[0].status, products: native.products };
          writeFileSync(process.env.ARTIFACT_DIRECTORY + '/acceptance-launchd-darwin-arm64.json',
            JSON.stringify(evidence, null, 2) + '\n');
          console.log('Verified installed npm regression', cases[0].fullName);
          JS
      - name: Check the installed package evidence
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const output = join(process.env.RUNNER_TEMP, 'agents-alpha');
          const records = readdirSync(output).filter((file) =>
            /^(build|installed)-.*\.json$/.test(file),
          );
          assert(records.some((file) => file.startsWith('build-')));
          assert(records.some((file) => file.startsWith('installed-')));
          for (const record of records) {
            const manifest = JSON.parse(readFileSync(join(output, record), 'utf8'));
            assert.equal(manifest.sourceCommit, process.env.QUALIFIED_SDK_COMMIT);
            assert.equal(manifest.platform, process.env.EXPECTED_PLATFORM);
            console.log(record, manifest.sourceCommit, manifest.platform);
          }
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agents-alpha-darwin-arm64
          path: |
            ${{ runner.temp }}/agents-alpha/*.tgz
            ${{ runner.temp }}/agents-alpha/*.tar.gz
            ${{ runner.temp }}/agents-alpha/SHA256SUMS-*
            ${{ runner.temp }}/agents-alpha/build-*.json
            ${{ runner.temp }}/agents-alpha/installed-*.json
            ${{ runner.temp }}/agents-alpha/acceptance-launchd-darwin-arm64.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Verify hard-link guards through the installed release package
        env:
          OPENAI_AGENTS_NATIVE_TESTS: '1'
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
          PROBE_SHA256: 67a034d435e172531a892e4017a0166457fdc77290cd908d45fc2a0eb6a46b6b
          PROBE_SLUG: helper-alias
          PROBE_TITLE: qualifies native helper hard-link grants in an installed macOS package
          OPENAI_AGENTS_EXPECT_HELPER_ALIAS_REJECT: '1'
        run: "set -euo pipefail\ncheckout=\"$PWD\"\nconsumer=\"$RUNNER_TEMP/agents-starter\"\nproduct_hashes() {\n  (cd \"$1/node_modules/@openai/agents\" && shasum -a 256 native/{codex.node,build-receipt.json} bin/codex-*)\n}\n\noriginal=\"$consumer\"\nconsumer=\"$RUNNER_TEMP/agents-alias-starter\"\nmkdir \"$consumer\"\ncp -RP \"$original/node_modules\" \"$original/package.json\" \"$consumer/\"\ncmp <(product_hashes \"$original\") <(product_hashes \"$consumer\")\n\ntest_dir=\"$consumer/test/native\"\nmkdir -p \"$test_dir\"\nfixture=\"$test_dir/managed-$PROBE_SLUG.test.ts\"\ncp packages/agents/test/native/local-executor-policy-native.test.ts \"$fixture\"\ncp -R packages/agents/test/native/fixtures \"$test_dir/\"\nif [[ ! -e \"$consumer/node_modules/vitest\" ]]; then\n  ln -s \"$checkout/node_modules/vitest\" \"$consumer/node_modules/vitest\"\nfi\nprintf 'export default {};\\n' > \"$consumer/vitest.config.mjs\"\nprobe=\"$RUNNER_TEMP/$PROBE_SLUG-probe.ts\"\nbase64 -D >\"$probe\" <<'PROBE'\nCmltcG9ydCB7IGNvcHlGaWxlIGFzIGNvcHlEYXJ3aW5BbGlhc0ZpbGUsIGxpbmsgYXMgbGlua0Rh\n\
          cndpbkFsaWFzRmlsZSwgcmVuYW1lIGFzIHJlbmFtZURhcndpbkFsaWFzRmlsZSwgc3RhdCBhcyBz\ndGF0RGFyd2luQWxpYXNGaWxlIH0gZnJvbSAnbm9kZTpmcy9wcm9taXNlcyc7CgppdCgncXVhbGlm\naWVzIG5hdGl2ZSBoZWxwZXIgaGFyZC1saW5rIGdyYW50cyBpbiBhbiBpbnN0YWxsZWQgbWFjT1Mg\ncGFja2FnZScsIGFzeW5jICgpID0+IHsKICBleHBlY3QocHJvY2Vzcy5wbGF0Zm9ybSkudG9CZSgn\nZGFyd2luJyk7CiAgY29uc3QgY29uc3VtZXIgPSBhd2FpdCByZWFscGF0aChwYWNrYWdlUm9vdCk7\nCiAgY29uc3QgaGVscGVyID0gYXdhaXQgcmVhbHBhdGgoam9pbihjb25zdW1lciwgJ25vZGVfbW9k\ndWxlcy9Ab3BlbmFpL2FnZW50cy9iaW4vY29kZXgtY29kZS1tb2RlLWhvc3QnKSk7CiAgZXhwZWN0\nKGhlbHBlci5zdGFydHNXaXRoKGNvbnN1bWVyICsgJy8nKSkudG9CZSh0cnVlKTsKICBjb25zdCB7\nIG1vZGUsIHNpemUgfSA9IGF3YWl0IHN0YXREYXJ3aW5BbGlhc0ZpbGUoaGVscGVyKTsKICBleHBl\nY3Qoc2l6ZSkudG9CZUdyZWF0ZXJUaGFuKDEwMDAwKTsKICBjb25zdCBzY3JhdGNoID0gYXdhaXQg\nbWtkdGVtcChqb2luKGNvbnN1bWVyLCAnZGFyd2luLWhlbHBlci1hbGlhcy0nKSk7CiAgY29uc3Qg\nc2F2ZWQgPSBqb2luKHNjcmF0Y2gsICdvcmlnaW5hbC1jb2RlLW1vZGUtaG9zdCcpOwogIGNvbnN0\nIHN0b3JlID0gam9pbihzY3JhdGNoLCAnc3RvcmUnKTsKICBjb25zdCBjd2QgPSBqb2luKHNjcmF0\nY2gsICdjd2QnKTsKICBjb25zdCBvdmVybGFwID0gam9pbihzY3JhdGNoLCAnb3ZlcmxhcCcpOwog\n\
