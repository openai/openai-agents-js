name: Check the managed local command on Apple Silicon
on:
  push:
    branches: [test/managed-macos-command-qualification-20261104]

permissions:
  contents: read

jobs:
  package:
    name: Build and test the exact JS SDK package
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      ALPHA_VERSION: 0.22.0-alpha.1
      EXPECTED_PLATFORM: darwin-arm64
      QUALIFIED_SDK_COMMIT: cb3fa9ec8dc9fab3d2a41b3503184f0a07b14e3b
      QUALIFIED_SDK_TREE: 972c34c7f36b7bb287f61c6d7f758dd1f3fd79cb
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cb3fa9ec8dc9fab3d2a41b3503184f0a07b14e3b
          persist-credentials: false
      - name: Check exact source
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SDK_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$QUALIFIED_SDK_TREE"
          sw_vers
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm

      - name: Check runner platform
        run: |
          node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'

      - name: Install Rust
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-target" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf protobuf openssl@3
      - name: Restore the Rust downloads
        id: rust-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            packages/agents/native/.cache/v8
          key: js-managed-macos-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('packages/agents/native/Cargo.lock') }}
      - name: Build the SDK and native runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node packages/agents/scripts/native.mjs package
      - name: Build the macOS WSS test fixture
        if: runner.os == 'macOS'
        working-directory: packages/agents/native
        run: |
          # Reuse the verified V8 files and target from native.mjs package.
          export RUSTY_V8_ARCHIVE="$PWD/.cache/v8/librusty_v8_ptrcomp_sandbox_release_aarch64-apple-darwin.a.gz"
          export RUSTY_V8_SRC_BINDING_PATH="$PWD/.cache/v8/src_binding_ptrcomp_sandbox_release_aarch64-apple-darwin.rs"
          cargo build --locked --release --example exec-server-fixture
          fixture="$CARGO_TARGET_DIR/release/examples/exec-server-fixture"
          test -x "$fixture"
          echo "CODEX_EXEC_SERVER_TEST_BINARY=$fixture" >> "$GITHUB_ENV"
      - name: Save the Rust downloads
        if: ${{ !cancelled() && steps.rust-downloads.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            packages/agents/native/.cache/v8
          key: js-managed-macos-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('packages/agents/native/Cargo.lock') }}
      - name: Check the portable sleep fixture on macOS
        run: |
          test -x /bin/sleep
          /bin/sleep 0
          PATH=/usr/bin:/bin /bin/sh -c 'command -v sleep; exec sleep 0'
      - name: Qualify local executor grants on macOS
        if: runner.os == 'macOS'
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: >-
          pnpm test:native packages/agents/test/native/local-executor-policy-native.test.ts
          -t 'blocks delegation from a local command to launchd|joins a detached local child at|joins an interrupted local command|joins a yielded local process|applies a per-turn write policy|keeps the opening write policy on a WSS executor that reports macOS|rejects a local executor grant to the runtime home'
          --reporter=verbose
      - name: Qualify native cancellation and model-step resume on macOS
        run: |
          pnpm test:native packages/agents/test/native/executor-stop-native.test.ts \
            -t 'fences a direct result before native' --maxWorkers=1 --reporter=verbose
          pnpm test:native packages/agents/test/native/model-preparation-cap.test.ts \
            --maxWorkers=1 --reporter=verbose
          pnpm test:native packages/agents/test/native/executor-receipt-resume-native.test.ts \
            -t 'can attach a trusted implicit remote executor' --maxWorkers=1 --reporter=verbose
          pnpm test:native \
            packages/agents/test/native/embedded-commands.test.ts \
            packages/agents/test/native/turn-controls.test.ts \
            packages/agents/test/native/parity-child-manual.test.ts \
            -t 'returns the actual native compact Turn|lets a graceful exact stop preserve|accepts a live child manual reply' \
            --maxWorkers=1 --reporter=verbose
          pnpm test:native packages/agents/test/native/compaction-late-admission-native.test.ts \
            --maxWorkers=1 --reporter=verbose
      - name: Qualify grant replacement after managed network denial
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: |
          set -euo pipefail
          fixture=packages/agents/test/native/local-executor-policy-native.test.ts
          case_name='applies a per-turn write policy after a managed network denial'
          probe_dir="$(mktemp -d "$RUNNER_TEMP/js-darwin-policy-probe.XXXXXX")"
          patch="$probe_dir/private.patch"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            writeFileSync(process.argv[1], Buffer.from(readFileSync(0, "utf8"), "base64"));
          ' "$patch" <<'PRIVATE_PROBE_PATCH'
          LS0tIGEvcGFja2FnZXMvYWdlbnRzL3Rlc3QvbmF0aXZlL2xvY2FsLWV4ZWN1dG9yLXBvbGljeS1u
