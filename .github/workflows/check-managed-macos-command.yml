          J10gYXMgY29uc3QpKAogICAnYXBwbGllcyBhIHBlci10dXJuIHdyaXRlIHBvbGljeSBhbmQgcmVx
          dWlyZXMgdGhlIGN1cnJlbnQgcG9saWN5IG9uICVzIHJlc3RvcmUnLAogICB7IHRpbWVvdXQ6IDQ1
          XzAwMCB9LAo=
          PRIVATE_PROBE_PATCH
          printf '%s  %s\n' '25fe2d5ffc4a2a5855c7ca936565664df5308b2de2c24920d960034208a7a965' "$patch" | shasum -a 256 -c -
          printf 'Private driver fixture patch %s on SDK %s\n' '25fe2d5ffc4a2a5855c7ca936565664df5308b2de2c24920d960034208a7a965' "$QUALIFIED_SDK_COMMIT"
          mkdir -p "$probe_dir/$(dirname "$fixture")"
          cp "$fixture" "$probe_dir/$fixture"
          (cd "$probe_dir" && git apply --no-index "$patch")
          temporary_test="${fixture%.test.ts}.qualification.test.ts"
          test ! -e "$temporary_test"
          trap 'rm -f -- "$temporary_test"' EXIT
          cp "$probe_dir/$fixture" "$temporary_test"
          git diff --exit-code
          pnpm test:native "$temporary_test" -t "$case_name" --maxWorkers=1 \
            --reporter=verbose --reporter=json --outputFile "$probe_dir/result.json"
          node --input-type=module - "$probe_dir/result.json" "$case_name" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const [, , path, name] = process.argv;
          const report = JSON.parse(readFileSync(path, 'utf8'));
          const cases = report.testResults.flatMap((file) => file.assertionResults)
            .filter((test) => test.title === name);
          assert.equal(cases.length, 1);
          assert.equal(cases[0].status, 'passed');
