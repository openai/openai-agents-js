name: Check the managed local command on Apple Silicon
on:
  push:
    branches: [test/managed-macos-command-qualification-20261104]

permissions:
  contents: read

jobs:
  package:
    name: Build and test the exact JS SDK package
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      ALPHA_VERSION: 0.22.0-alpha.1
      EXPECTED_PLATFORM: darwin-arm64
      QUALIFIED_SDK_COMMIT: 4dc9c03355cd7453ce3b8f85d10a64b6f261de22
      QUALIFIED_SDK_TREE: aae0735c823654ee9a2598a0780a99bc23467b1c
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4dc9c03355cd7453ce3b8f85d10a64b6f261de22
          persist-credentials: false
      - name: Check exact source
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SDK_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$QUALIFIED_SDK_TREE"
          sw_vers
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm

      - name: Check runner platform
        run: |
          node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'

      - name: Install Rust
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-target" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf protobuf openssl@3
      - name: Restore the Rust downloads
        id: rust-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            packages/agents/native/.cache/v8
          key: js-managed-macos-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('packages/agents/native/Cargo.lock') }}
      - name: Build the SDK and native runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node packages/agents/scripts/native.mjs package
      - name: Save the Rust downloads
        if: ${{ !cancelled() && steps.rust-downloads.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            packages/agents/native/.cache/v8
          key: js-managed-macos-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('packages/agents/native/Cargo.lock') }}
      - name: Qualify local executor grants on macOS
        if: runner.os == 'macOS'
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: >-
          pnpm test:native packages/agents/test/native/local-executor-policy-native.test.ts
          -t 'blocks delegation from a local command to launchd|joins a detached local child at|joins an interrupted local command|joins a yielded local process|applies a per-turn write policy|keeps the opening write policy on a WSS executor that reports macOS'
          --reporter=verbose
      - name: Qualify native cancellation and model-step resume on macOS
        run: |
          pnpm test:native packages/agents/test/native/executor-stop-native.test.ts \
            -t 'fences a direct result before native' --maxWorkers=1 --reporter=verbose
          pnpm test:native packages/agents/test/native/model-preparation-cap.test.ts \
            --maxWorkers=1 --reporter=verbose
          pnpm test:native packages/agents/test/native/executor-receipt-resume-native.test.ts \
            -t 'can attach a trusted implicit remote executor' --maxWorkers=1 --reporter=verbose
      - name: Create the release bundles
        run: node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$RUNNER_TEMP/agents-alpha"
      - name: Test the extracted bundles
        run: node scripts/verify-alpha-package.mjs --directory "$RUNNER_TEMP/agents-alpha"
      - name: Check the installed package evidence
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const output = join(process.env.RUNNER_TEMP, 'agents-alpha');
          const records = readdirSync(output).filter((file) =>
            /^(build|installed)-.*\.json$/.test(file),
          );
          assert(records.some((file) => file.startsWith('build-')));
          assert(records.some((file) => file.startsWith('installed-')));
          for (const record of records) {
            const manifest = JSON.parse(readFileSync(join(output, record), 'utf8'));
            assert.equal(manifest.sourceCommit, process.env.QUALIFIED_SDK_COMMIT);
            assert.equal(manifest.platform, process.env.EXPECTED_PLATFORM);
            console.log(record, manifest.sourceCommit, manifest.platform);
          }
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agents-alpha-darwin-arm64
          path: |
            ${{ runner.temp }}/agents-alpha/*.tgz
            ${{ runner.temp }}/agents-alpha/*.tar.gz
            ${{ runner.temp }}/agents-alpha/SHA256SUMS-*
            ${{ runner.temp }}/agents-alpha/build-*.json
            ${{ runner.temp }}/agents-alpha/installed-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
