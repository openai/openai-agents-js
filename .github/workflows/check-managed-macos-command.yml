name: Observe managed Darwin wrapper recovery from an installed package
'on':
  push:
    branches:
    - test/managed-macos-package-probes-20261104
    paths:
    - .github/workflows/check-managed-macos-command.yml
permissions:
  actions: read
  contents: read
jobs:
  qualify:
    name: Observe delayed managed Darwin wrapper cleanup
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_PLATFORM: darwin-arm64
      QUALIFIED_SDK_COMMIT: e652e7c0f4e68c8ded39dcde50c7aa36574758a6
      QUALIFIED_SDK_TREE: 10edee35289482253537c256c8fc6081ee4fdeb7
      PRODUCER_RUN: '41884309711'
      PRODUCER_DRIVER: 9063c0145be619f23a214bbe29fb97ecddbc1f82
      ARTIFACT_ID: '13354896244'
      ARTIFACT_SHA256: f5cd7a5508dc2b1355c35c6d7bb3381a4dbbc71e7a8878898d91552fa8a38ce0
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: e652e7c0f4e68c8ded39dcde50c7aa36574758a6
        persist-credentials: false
    - name: Check exact source
      run: 'test "$(git rev-parse HEAD)" = "$QUALIFIED_SDK_COMMIT"

        test "$(git rev-parse HEAD^{tree})" = "$QUALIFIED_SDK_TREE"

        sw_vers

        '
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        run_install: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        cache: pnpm
    - name: Check runner platform
      run: 'node -e ''require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)''

        '
    - name: Install the locked test runner
      run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Fetch the verified producer archive
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nrepo=\"repos/$GITHUB_REPOSITORY\"\nmetadata=\"$RUNNER_TEMP/wrapper-artifact.json\"\ngh api \"$repo/actions/artifacts/$ARTIFACT_ID\" > \"$metadata\"\njq -e --arg id \"$ARTIFACT_ID\" --arg run \"$PRODUCER_RUN\" --arg driver \"$PRODUCER_DRIVER\" --arg digest \"sha256:$ARTIFACT_SHA256\" \\\n  '(.id|tostring)==$id and (.workflow_run.id|tostring)==$run and .workflow_run.head_sha==$driver and .digest==$digest and .expired==false and .name==\"agents-alpha-darwin-arm64\"' \"$metadata\"\nmkdir \"$RUNNER_TEMP/agents-alpha\"\narchive=\"$RUNNER_TEMP/wrapper-artifact.zip\"\ngh api \"$repo/actions/artifacts/$ARTIFACT_ID/zip\" > \"$archive\"\nprintf '%s  %s\\n' \"$ARTIFACT_SHA256\" \"$archive\" | shasum -a 256 -c\nunzip -q \"$archive\" -d \"$RUNNER_TEMP/agents-alpha\"\n"
    - id: install
      name: Verify and install the exact archive
      run: "cat > \"$RUNNER_TEMP/js-install.mjs\" <<'INSTALL'\nimport assert from \"node:assert/strict\";\nimport { execFileSync } from \"node:child_process\";\nimport { cpSync, readFileSync, realpathSync } from \"node:fs\";\nimport { join, sep } from \"node:path\";\nimport { pathToFileURL } from \"node:url\";\n\nconst checkout = process.argv[2];\nconst { hashes, verifyArtifactDirectory } = await import(\n  pathToFileURL(join(checkout, \"scripts/verify-alpha-package.mjs\"))\n);\nconst { verifyNativeReceipt, verifyStarterLock } = await import(\n  pathToFileURL(join(checkout, \"scripts/alpha-package.mjs\"))\n);\nconst { ARTIFACT_DIRECTORY, PRODUCER_SDK, RECEIPT_SOURCE, RUNNER_TEMP } =\n  process.env;\nassert.equal(process.platform + \"-\" + process.arch, \"darwin-arm64\");\nconst build = await verifyArtifactDirectory(ARTIFACT_DIRECTORY);\nassert.equal(build.sourceCommit, PRODUCER_SDK);\nconst readJson = (path) => JSON.parse(readFileSync(path, \"utf8\"));\nfor (const profile of [\"starter\", \"app\"]) {\n  const installed\
        \ = readJson(\n    join(ARTIFACT_DIRECTORY, `installed-${profile}-darwin-arm64.json`),\n  );\n  assert.equal(installed.profile, profile);\n  assert(installed.verified.includes(\"native-receipt\"));\n  for (const field of Object.keys(build))\n    assert.deepEqual(installed[field], build[field]);\n}\n\nexecFileSync(\"/usr/bin/tar\", [\n  \"-xzf\",\n  join(ARTIFACT_DIRECTORY, build.starter.archive),\n  \"-C\",\n  RUNNER_TEMP,\n]);\nconst consumer = join(RUNNER_TEMP, \"agents-starter\");\nconst manifest = readJson(join(consumer, \"package.json\"));\nfor (const [name, record] of Object.entries(build.packages)) {\n  assert.equal(\n    manifest.dependencies[name],\n    `file:vendor/agents/${record.archive}`,\n  );\n  assert.equal(\n    (await hashes(join(consumer, \"vendor/agents\", record.archive))).sha256,\n    record.sha256,\n  );\n}\nverifyStarterLock(\n  readJson(join(consumer, \"package-lock.json\")),\n  build.packages,\n);\nconst npm = join(process.execPath, \"../../lib/node_modules/npm/bin/npm-cli.js\"\
        );\nexecFileSync(process.execPath, [npm, \"ci\", \"--ignore-scripts\"], {\n  cwd: consumer,\n  env: { ...process.env, NODE_PATH: \"\", PATH: \"\" },\n  stdio: \"inherit\",\n});\n\nconst installed = realpathSync(join(consumer, \"node_modules/@openai/agents\"));\nassert(installed.startsWith(realpathSync(consumer) + sep));\nconst checked = join(RECEIPT_SOURCE, \"packages/agents\");\nconst nativeReceipt = readJson(join(installed, \"native/build-receipt.json\"));\nconst inputs = execFileSync(\n  \"git\",\n  [\n    \"ls-files\",\n    \"--\",\n    \"native/CODEX_REVISION\",\n    \"native/Cargo.toml\",\n    \"native/Cargo.lock\",\n    \"native/build.rs\",\n    \"native/tests/fixtures/exec_server.rs\",\n    \"native/rust\",\n    \"native/patches\",\n    \"native/rmcp-patches\",\n    \"scripts\",\n  ],\n  { cwd: join(checkout, \"packages/agents\"), encoding: \"utf8\" },\n)\n  .trim()\n  .split(\"\\n\");\nassert.deepEqual(Object.keys(nativeReceipt.inputs).sort(), inputs.sort());\ncpSync(\n  join(installed, \"native/build-receipt.json\"\
        ),\n  join(checked, \"native/build-receipt.json\"),\n);\ncpSync(\n  join(installed, \"native/codex.node\"),\n  join(checked, \"native/codex.node\"),\n);\ncpSync(join(installed, \"bin\"), join(checked, \"bin\"), { recursive: true });\nconst { revision } = await verifyNativeReceipt(RECEIPT_SOURCE, build.platform);\nassert.equal(revision, build.codexRevision);\n\nexecFileSync(\n  process.execPath,\n  [\n    \"--input-type=module\",\n    \"-e\",\n    `\n  import assert from 'node:assert/strict';\n  import { createRequire } from 'node:module';\n  import { fileURLToPath } from 'node:url';\n  const root = process.env.INSTALLED_AGENT_ROOT;\n  const sdk = fileURLToPath(import.meta.resolve('@openai/agents'));\n  assert(sdk.startsWith(root + '/dist/'), sdk);\n  const { Environment } = await import('@openai/agents');\n  assert.equal(typeof Environment.local, 'function');\n  const require = createRequire(import.meta.url);\n  const native = root + '/native/codex.node';\n  assert.equal(typeof require(native).create_engine,\
        \ 'function');\n  console.log('Loaded installed SDK and native addon', sdk, native);\n`,\n  ],\n  {\n    cwd: consumer,\n    env: { ...process.env, NODE_PATH: \"\", INSTALLED_AGENT_ROOT: installed },\n    stdio: \"inherit\",\n  },\n);\nconsole.log(\n  \"Verified native source, products and installed package\",\n  build.sourceCommit,\n  revision,\n);\nINSTALL\nTEST_FILE=packages/agents/test/native/local-executor-policy-native.test.ts\nset -euo pipefail\ncheckout=\"$PWD\"\nartifacts=\"$RUNNER_TEMP/agents-alpha\"\nstage=\"$RUNNER_TEMP/native-receipt-source\"\nmkdir \"$stage\"\ngit archive HEAD packages/agents | tar -x -C \"$stage\"\n\nexport ARTIFACT_DIRECTORY=\"$artifacts\" RECEIPT_SOURCE=\"$stage\"\nexport PRODUCER_SDK=\"$QUALIFIED_SDK_COMMIT\"\nnode \"$RUNNER_TEMP/js-install.mjs\" \"$checkout\"\n"
    - name: Observe delayed Darwin wrapper cleanup through installed SDK
      env:
        OPENAI_AGENTS_NATIVE_TESTS: '1'
        OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        PROBE_SHA256: 421d097cdb929950a8b381b636236ef3bdda6428244cf71bca3c428b3f2676d9
        PROBE_SLUG: wrapper
        PROBE_TITLE: observes a published local command after close with its trusted wrapper paused
      run: "set -euo pipefail\ncheckout=\"$PWD\"\nconsumer=\"$RUNNER_TEMP/agents-starter\"\nproduct_hashes() {\n  (cd \"$1/node_modules/@openai/agents\" && shasum -a 256 native/{codex.node,build-receipt.json} bin/codex-*)\n}\n\ntest_dir=\"$consumer/test/native\"\nmkdir -p \"$test_dir\"\nfixture=\"$test_dir/managed-$PROBE_SLUG.test.ts\"\ncp packages/agents/test/native/local-executor-policy-native.test.ts \"$fixture\"\ncp -R packages/agents/test/native/fixtures \"$test_dir/\"\nif [[ ! -e \"$consumer/node_modules/vitest\" ]]; then\n  ln -s \"$checkout/node_modules/vitest\" \"$consumer/node_modules/vitest\"\nfi\nprintf 'export default {};\\n' > \"$consumer/vitest.config.mjs\"\nprobe=\"$RUNNER_TEMP/$PROBE_SLUG-probe.ts\"\nbase64 -D >\"$probe\" <<'PROBE'\naXQuc2tpcElmKHByb2Nlc3MucGxhdGZvcm0gIT09ICdkYXJ3aW4nKSgKICAnb2JzZXJ2ZXMgYSBw\ndWJsaXNoZWQgbG9jYWwgY29tbWFuZCBhZnRlciBjbG9zZSB3aXRoIGl0cyB0cnVzdGVkIHdyYXBw\nZXIgcGF1c2VkJywKICBhc3luYyAoKSA9PiB7CiAgICBjb25zdCBkaXJlY3RvcnkgPSBhd2FpdCBy\nZWFscGF0aCgKICAgICAgYXdhaXQgbWtkdGVtcChqb2luKHRtcGRpcigpLCAnYWdlbnRzLWRhcndp\n\
