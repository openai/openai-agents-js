name: ARM64 selected-child Turn fixture diagnostic

on:
  push:
    branches: [mark/nov9-js-child-turn-readiness-arm64]
    paths: [.github/workflows/arm64-selected-child-turn-diagnostic.yml]

permissions:
  contents: read
  actions: read

jobs:
  pair:
    name: Exact ARM64 child Turn fixture pair
    if: github.repository == 'openai/openai-agents-js' && github.ref == 'refs/heads/mark/nov9-js-child-turn-readiness-arm64'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      BASE_SHA: 91eb0398584a7000cb4afdeda76e17e72e202da7
      BASE_TREE: e333a0456584646f489dcce07a345c4afdbfca23
      CANDIDATE_SHA: 99134d5601121160f2f0410ca6ca694141cdf0a4
      CANDIDATE_TREE: 05402469e2d97af8b13564cd14d504f2ca0437ff
      NATIVE_INPUTS: a22ce0556587982ac0a522b046060a8f49b8b756b7b4d0758534a22c235c6b4f
      OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 99134d5601121160f2f0410ca6ca694141cdf0a4
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - name: Verify exact trees and stock ARM64 runner
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test "$(git rev-parse 'HEAD^')" = "$BASE_SHA"
          test "$(git rev-parse 'HEAD^^{tree}')" = "$BASE_TREE"
          test "$(uname -m)" = aarch64
          test "$(id -u)" -ne 0
          node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, "linux-arm64")'
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor-profiles bubblewrap
          if ! bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict \
            && sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true
          test "$(cat /sys/module/apparmor/parameters/enabled)" = Y
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          uname -srmo
          node --version
          pnpm --version
      - name: Restore and verify the exact native transfer
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT: '{"artifact-id":"13762542999","artifact-digest":"07ab0543dfe4fe760b7161b5fbb70e7af7fe95b5fb3d0390e029bf07796eb098"}'
        run: |
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$BASE_TREE"
          node scripts/restore-native-bundle.mjs
          cat > "$RUNNER_TEMP/child-turn-native.sha256" <<'SHA'
          f1eb49e7c941324cea7def5336295f05a8b43c47f965a8ea9acfd78798c5bb65  packages/agents-codex/native/codex.node
          6a3a3ba28e2baf6f14ec6d725796d1c63520d4dc05dd27b08c7fec9244508154  packages/agents-codex/bin/codex-linux-sandbox
          ef0aceaed252afefea9b9ae03bd6e006e0730b537822421f1260788d1434e195  packages/agents-codex/bin/codex-code-mode-host
          6a3a3ba28e2baf6f14ec6d725796d1c63520d4dc05dd27b08c7fec9244508154  packages/agents-codex/bin/codex-execve-wrapper
          6a3a3ba28e2baf6f14ec6d725796d1c63520d4dc05dd27b08c7fec9244508154  packages/agents-codex/bin/codex-sdk-runtime
          fa9d51b6678eb0b59060dd7fba07e97b1f1002494a8f8ab597bf203a0a201538  packages/agents-codex/native/build-receipt.json
          5add94955ba3ba1388a9dc261ddddd2c1662f167a75d2ec8b5a46d036f37e7d7  packages/agents-codex/native/test-bin/exec-server-fixture
          SHA
          sha256sum --check "$RUNNER_TEMP/child-turn-native.sha256"
      - name: Install frozen SDK test dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the unchanged and candidate fixtures once each
        shell: bash
        run: |
          out="$RUNNER_TEMP/child-turn-fixture"
          mkdir -p "$out"
          run_case() {
            local label=$1 sha=$2 tree=$3 code=0
            git checkout --detach "$sha"
            test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
            test "$(node --input-type=module -e 'import { nativeInputs } from "./scripts/native-bundle-inputs.mjs"; console.log(nativeInputs());')" = "$NATIVE_INPUTS"
            sha256sum --check "$RUNNER_TEMP/child-turn-native.sha256"
            printf '%s source %s tree %s inputs %s\n' "$label" "$sha" "$tree" "$NATIVE_INPUTS"
            TMPDIR="$(mktemp -d /tmp/ct.XXXXXX)" \
              env -u OPENAI_API_KEY -u GH_TOKEN -u GITHUB_TOKEN \
              pnpm test:native packages/agents-codex/test/native/child-turn-events-native.test.ts \
                -t 'cancels the selected child while refusing a sibling Turn and preserving its work$' \
                --mode full --maxWorkers=1 --reporter=verbose --reporter=json \
                --outputFile.json="$out/$label.json" || code=$?
            printf '%s\n' "$code" > "$out/$label.exit"
            git diff --exit-code HEAD
          }
          run_case unchanged "$BASE_SHA" "$BASE_TREE"
          run_case candidate "$CANDIDATE_SHA" "$CANDIDATE_TREE"
          node --input-type=module - "$out" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const out = process.argv[2];
          const title = 'cancels the selected child while refusing a sibling Turn and preserving its work';
          for (const label of ['unchanged', 'candidate']) {
            const exit = Number(readFileSync(join(out, label + '.exit'), 'utf8'));
            const report = JSON.parse(readFileSync(join(out, label + '.json'), 'utf8'));
            assert.equal(report.testResults.length, 1);
            const active = report.testResults[0].assertionResults.filter(({ status }) => status === 'passed' || status === 'failed');
            assert.equal(active.length, 1);
            assert.equal(active[0].title, title);
            if (label === 'unchanged' && active[0].status === 'failed') {
              assert.equal(exit, 1);
              assert.match(active[0].failureMessages.join('\n'), /Missing real native child Turns/);
              console.log('unchanged: reproduced Missing real native child Turns');
            } else {
              assert.equal(exit, 0);
              assert.equal(active[0].status, 'passed');
              console.log(label + ': passed the exact selected-child cancellation row');
            }
          }
          NODE
          (cd "$out" && sha256sum *.json *.exit > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: arm64-child-turn-fixture-evidence-99134d56
          path: ${{ runner.temp }}/child-turn-fixture
          if-no-files-found: warn
          retention-days: 14
