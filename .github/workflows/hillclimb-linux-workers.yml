name: Linux native worker scheduling crossover
'on':
  push:
    branches:
      - ci/hillclimb/js-current-linux-workers-39
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-native-workers-crossover-${{ github.sha }}
  cancel-in-progress: false
jobs:
  qualify:
    name: Linux native crossover (${{ matrix.first }} then ${{ matrix.second }} workers)
    if: github.repository == 'openai/openai-agents-js' && github.event_name == 'push' && github.ref == 'refs/heads/ci/hillclimb/js-current-linux-workers-39'
    runs-on:
      group: codex-runners
      labels: codex-linux-x64-xl
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - first: 4
            second: 8
          - first: 8
            second: 4
    defaults:
      run:
        shell: bash
    env:
      ALPHA_VERSION: 0.22.0-alpha.2
      EXPECTED_PLATFORM: linux-x64
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_JOBS: '64'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check runner platform
        run: node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'
      - name: Record runner capacity
        run: node -e 'const os = require("node:os"); console.log(JSON.stringify({platform:process.platform,arch:process.arch,cpus:os.availableParallelism(),memory:os.totalmem(),model:os.cpus()[0].model}));'
      - name: Authenticate and restore the pinned qualified native bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/hillclimb-linux-workers.mjs
      - name: Install Linux worker prerequisites
        if: runner.os == 'Linux'
        run: |
          bash scripts/use-ubuntu-archive-if-needed.sh
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor-profiles bubblewrap
          if ! bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          uname -sr
          bwrap --version
          bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the current SDK
        id: build_sdk
        run: |
          pnpm install --frozen-lockfile
          node --input-type=module -e 'import { verifyNativeReceipt } from "./scripts/alpha-package.mjs"; await verifyNativeReceipt(process.cwd(), "linux-x64"); console.log("Verified pinned native inputs and product hashes");'
          pnpm build
      - name: Qualify canonical native storage
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: pnpm test:native packages/agents-codex/test/native/custom-storage-durability-native.test.ts packages/agents-codex/test/custom-thread-store.test.ts packages/agents-codex/test/file-thread-store.test.ts --maxWorkers=4 --reporter=verbose
      - name: Save the initial Vitest scheduling cache
        run: |
          test ! -L node_modules
          test ! -L node_modules/.vite
          test ! -L node_modules/.vite/vitest
          mkdir "$RUNNER_TEMP/worker-scheduling-baseline"
          if [ -d node_modules/.vite/vitest ]; then
            cp -a node_modules/.vite/vitest "$RUNNER_TEMP/worker-scheduling-baseline/cache"
          fi
      - name: Qualify the Linux worker (first pass)
        id: first
        continue-on-error: true
        if: runner.os == 'Linux'
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: |
          pnpm test:native \
            packages/agents-codex/test/native/supervised-worker-example.test.ts \
            packages/agents-codex/test/native/supervised-worker-cleanup.test.ts \
            --reporter=verbose
          pnpm test:native \
            packages/agents-codex/test/native/local-executor-policy-native.test.ts \
            -t 'joins an interrupted local command|ignores sandbox helper candidates|isolates local command reads and environment|rejects a missing write root|rejects an alias to the installed helpers|applies a per-turn write policy|keeps relocated (sessions|dated sessions|archives) outside local grants on open and replacement|keeps a selected local rollout outside grants on resume and replacement|rejects a profile database hard link in a local grant|keeps relocated checklist state outside local grants|rejects unverifiable directory aliases in the private native runtime home' \
            --reporter=verbose
          pnpm test:native \
            packages/agents-codex/test/native/storage-mounts.test.ts \
            packages/agents-codex/test/native/storage-mounts-native.test.ts \
            --reporter=verbose
          pnpm test:native --mode full --maxWorkers=${{ matrix.first }} --reporter=verbose
      - name: Restore the initial Vitest scheduling cache
        id: reset
        if: ${{ !cancelled() && (steps.first.outcome == 'success' || steps.first.outcome == 'failure') }}
        run: |
          test ! -L node_modules
          test ! -L node_modules/.vite
          test ! -L node_modules/.vite/vitest
          rm -rf node_modules/.vite/vitest
          if [ -d "$RUNNER_TEMP/worker-scheduling-baseline/cache" ]; then
            mkdir -p node_modules/.vite
            cp -a "$RUNNER_TEMP/worker-scheduling-baseline/cache" node_modules/.vite/vitest
            diff -qr "$RUNNER_TEMP/worker-scheduling-baseline/cache" node_modules/.vite/vitest
          else
            test ! -e node_modules/.vite/vitest
          fi
      - name: Qualify the Linux worker (second pass)
        id: second
        continue-on-error: true
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: |
          pnpm test:native \
            packages/agents-codex/test/native/supervised-worker-example.test.ts \
            packages/agents-codex/test/native/supervised-worker-cleanup.test.ts \
            --reporter=verbose
          pnpm test:native \
            packages/agents-codex/test/native/local-executor-policy-native.test.ts \
            -t 'joins an interrupted local command|ignores sandbox helper candidates|isolates local command reads and environment|rejects a missing write root|rejects an alias to the installed helpers|applies a per-turn write policy|keeps relocated (sessions|dated sessions|archives) outside local grants on open and replacement|keeps a selected local rollout outside grants on resume and replacement|rejects a profile database hard link in a local grant|keeps relocated checklist state outside local grants|rejects unverifiable directory aliases in the private native runtime home' \
            --reporter=verbose
          pnpm test:native \
            packages/agents-codex/test/native/storage-mounts.test.ts \
            packages/agents-codex/test/native/storage-mounts-native.test.ts \
            --reporter=verbose
          pnpm test:native --mode full --maxWorkers=${{ matrix.second }} --reporter=verbose
      - name: Require both qualification passes to succeed
        if: ${{ !cancelled() }}
        env:
          FIRST_OUTCOME: ${{ steps.first.outcome }}
          SECOND_OUTCOME: ${{ steps.second.outcome }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          console.log(JSON.stringify({first: process.env.FIRST_OUTCOME, second: process.env.SECOND_OUTCOME}));
          assert.equal(process.env.FIRST_OUTCOME, 'success');
          assert.equal(process.env.SECOND_OUTCOME, 'success');
          NODE
      - name: Qualify native tracing and decoded OTLP transports
        if: runner.os == 'Linux'
        env:
          AGENTS_REQUIRE_TRACING_QUALIFICATION: '1'
          OPENAI_AGENTS_NATIVE_TESTS: '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/agents-otel-collector"
          "$RUNNER_TEMP/agents-otel-collector/bin/python" -m pip install grpcio==1.85.0 opentelemetry-proto==1.45.1
          OTLP_TEST_PYTHON="$RUNNER_TEMP/agents-otel-collector/bin/python" pnpm exec vitest run --project @openai/agents-codex packages/agents-codex/test/native/tracing-parity.test.ts packages/agents-codex/test/native/telemetry-transports.test.ts
          pnpm test:native packages/agents-codex/test/native/mcp-policy-native.test.ts -t 'restores the native MCP carrier'
      - name: Create the release bundles
        run: node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$RUNNER_TEMP/agents-alpha"
      - name: Test the extracted bundles
        run: node scripts/verify-alpha-package.mjs --directory "$RUNNER_TEMP/agents-alpha"
