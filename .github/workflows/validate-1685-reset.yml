name: Validate realtime session update tracking reset

on:
  push:
    branches:
      - feat/realtime-session-payload-transform-466-rebased

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/realtime-session-payload-transform-466-rebased
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Focused tests
        run: pnpm exec vitest run packages/agents-realtime/test/sessionPayloadTransform.test.ts
      - name: Lint changed runtime and tests
        run: pnpm exec eslint packages/agents-realtime/src/openaiRealtimeBase.ts packages/agents-realtime/src/openaiRealtimeWebsocket.ts packages/agents-realtime/src/openaiRealtimeWebRtc.ts packages/agents-realtime/test/sessionPayloadTransform.test.ts
      - name: Format check
        run: pnpm exec prettier --check packages/agents-realtime/src/openaiRealtimeBase.ts packages/agents-realtime/src/openaiRealtimeWebsocket.ts packages/agents-realtime/src/openaiRealtimeWebRtc.ts packages/agents-realtime/test/sessionPayloadTransform.test.ts
      - name: Remove validation workflow
        if: success()
        run: |
          rm -f .github/workflows/validate-1685-reset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove focused reset validation" || exit 0
          git push origin HEAD:feat/realtime-session-payload-transform-466-rebased
