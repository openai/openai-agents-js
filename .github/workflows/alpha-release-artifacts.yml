name: Alpha release artifacts

on:
  push:
    branches: [feat/codex-harness]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
  pull_request:
    branches: [feat/codex-harness]

permissions:
  contents: read

concurrency:
  group: alpha-release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and test (${{ matrix.platform }})
    if: >-
      github.repository == 'openai/openai-agents-js' &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: darwin-arm64
            runner: macos-15
          - platform: win32-x64
            runner: windows-2025
    # Keep macOS on its ARM runner and preserve standard runners for fork-owned repositories.
    runs-on: ${{ fromJSON(github.repository == 'openai/openai-agents-js' && matrix.platform == 'linux-x64' && '{"group":"codex-runners","labels":"codex-linux-x64"}' || github.repository == 'openai/openai-agents-js' && matrix.platform == 'win32-x64' && '{"group":"codex-runners","labels":"codex-windows-x64"}' || toJSON(matrix.runner)) }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      ALPHA_VERSION: 0.22.0-alpha.1
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm

      - name: Check runner platform
        run: |
          node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'

      - name: Install Rust
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-target" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install --yes clang cmake pkg-config protobuf-compiler libssl-dev
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf protobuf openssl@3
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Build the SDK and native runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node packages/agents/scripts/native.mjs package
      - name: Create the release bundles
        run: node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$RUNNER_TEMP/agents-alpha"
      - name: Test the extracted bundles
        run: node scripts/verify-alpha-package.mjs --directory "$RUNNER_TEMP/agents-alpha"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agents-alpha-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/agents-alpha/*.tgz
            ${{ runner.temp }}/agents-alpha/*.tar.gz
            ${{ runner.temp }}/agents-alpha/SHA256SUMS-*
            ${{ runner.temp }}/agents-alpha/build-*.json
            ${{ runner.temp }}/agents-alpha/installed-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
