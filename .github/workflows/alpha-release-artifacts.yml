name: Alpha release artifacts

on:
  push:
    branches: [ci/hillclimb/js-core-cgu4-arm64-20261117]

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha-release-artifacts-${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/codex-harness' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select native bundles
    if: github.repository == 'openai/openai-agents-js'
    runs-on: ubuntu-24.04
    outputs:
      inputs_hash: ${{ steps.select.outputs.inputs_hash }}
      linux_hit: ${{ steps.select.outputs.linux_hit }}
      linux_artifact: ${{ toJSON(steps.upload_linux.outputs) }}
      linux-arm64_hit: ${{ steps.select.outputs.linux-arm64_hit }}
      linux-arm64_artifact: ${{ toJSON(steps.upload_linux-arm64.outputs) }}
      macos_hit: ${{ steps.select.outputs.macos_hit }}
      macos_artifact: ${{ toJSON(steps.upload_macos.outputs) }}
      windows_hit: ${{ steps.select.outputs.windows_hit }}
      windows_artifact: ${{ toJSON(steps.upload_windows.outputs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Hash inputs for the cold ARM64 build
        id: select
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { nativeInputs } from './scripts/native-bundle-inputs.mjs';
          const outputs = ['inputs_hash=' + nativeInputs()];
          for (const platform of ['linux', 'linux-arm64', 'macos', 'windows']) {
            outputs.push(platform + '_hit=false');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, outputs.join('\n') + '\n');
          JS
      - name: Publish native bundle (linux-x64)
        id: upload_linux
        if: steps.select.outputs.linux_hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/native-${{ steps.select.outputs.inputs_hash }}-linux-x64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Publish native bundle (linux-arm64)
        id: upload_linux-arm64
        if: steps.select.outputs.linux-arm64_hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/native-${{ steps.select.outputs.inputs_hash }}-linux-arm64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Publish native bundle (darwin-arm64)
        id: upload_macos
        if: steps.select.outputs.macos_hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/native-${{ steps.select.outputs.inputs_hash }}-darwin-arm64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Publish native bundle (win32-x64)
        id: upload_windows
        if: steps.select.outputs.windows_hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/native-${{ steps.select.outputs.inputs_hash }}-win32-x64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 90

  produce-linux:
    needs: select
    if: github.ref == 'refs/heads/feat/codex-harness'
    uses: ./.github/workflows/native-bundle.yml
    with:
      platform: linux-x64
      inputs_hash: ${{ needs.select.outputs.inputs_hash }}

  produce-linux-arm64:
    needs: select
    if: needs.select.outputs.linux-arm64_hit != 'true'
    uses: ./.github/workflows/native-bundle.yml
    with:
      platform: linux-arm64
      inputs_hash: ${{ needs.select.outputs.inputs_hash }}
      managed_arm: &managed_arm true

  produce-macos:
    needs: select
    if: github.ref == 'refs/heads/feat/codex-harness'
    uses: ./.github/workflows/native-bundle.yml
    with:
      platform: darwin-arm64
      inputs_hash: ${{ needs.select.outputs.inputs_hash }}

  produce-windows:
    needs: select
    if: github.ref == 'refs/heads/feat/codex-harness'
    uses: ./.github/workflows/native-bundle.yml
    with:
      platform: win32-x64
      inputs_hash: ${{ needs.select.outputs.inputs_hash }}

  qualify-native-docker:
    name: Qualify native Docker path and identity grants
    needs: [select, produce-linux]
    if: github.ref == 'refs/heads/feat/codex-harness'
    # Keep the Docker daemon inside a dedicated, ephemeral GitHub-hosted VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NATIVE_INPUTS: ${{ needs.select.outputs.inputs_hash }}
      CODEX_DOCKER_TEST_SOCKET: /var/run/docker.sock
      CODEX_EXEC_SERVER_TEST_BINARY: ${{ github.workspace }}/packages/agents-codex/native/test-bin/exec-server-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - name: Verify confined gate and cleanup regressions
        run: |
          node --test scripts/aggregate-native-docker.test.mjs
          python3 -m unittest discover -s .github/docker -p 'test_*.py'
      - name: Restore the current-run Linux native transfer
        id: native_transfer
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PLATFORM: linux-x64
          NATIVE_ARTIFACT: ${{ needs.select.outputs.linux_hit == 'true' && needs.select.outputs.linux_artifact || needs.produce-linux.outputs.artifact }}
        run: node scripts/restore-native-bundle.mjs
      - name: Install packages and build the current SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build the native Docker fixture
        run: |
          test -S "$CODEX_DOCKER_TEST_SOCKET"
          mkdir -p results/native-docker
          date --iso-8601=seconds > "$RUNNER_TEMP/native-docker-profile-start"
          env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_CUSTOM_HEADERS \
            docker --host "unix://$CODEX_DOCKER_TEST_SOCKET" build --pull \
            --iidfile results/native-docker/image.id \
            --file .github/docker/native-executor.Dockerfile .github/docker
          CODEX_DOCKER_TEST_IMAGE=$(cat results/native-docker/image.id)
          [[ $CODEX_DOCKER_TEST_IMAGE =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "CODEX_DOCKER_TEST_IMAGE=$CODEX_DOCKER_TEST_IMAGE" >> "$GITHUB_ENV"
          docker --host "unix://$CODEX_DOCKER_TEST_SOCKET" version --format '{{json .Server.Version}}' > results/native-docker/docker-version.json
          docker --host "unix://$CODEX_DOCKER_TEST_SOCKET" info --format '{{json .SecurityOptions}}' > results/native-docker/docker-security.json
          docker --host "unix://$CODEX_DOCKER_TEST_SOCKET" run --rm --network none --entrypoint /usr/bin/bwrap "$CODEX_DOCKER_TEST_IMAGE" --version > results/native-docker/bubblewrap-version.txt
          uname -r > results/native-docker/kernel-version.txt
      - name: Install the diagnostic-only confined runner profiles
        run: |
          command -v apparmor_parser
          CODEX_DOCKER_TEST_IMAGE=$(docker --host "unix://$CODEX_DOCKER_TEST_SOCKET" image inspect "$CODEX_DOCKER_TEST_IMAGE" --format '{{.Id}}') \
            NATIVE_DOCKER_RECIPE=.github/docker/native-executor.Dockerfile \
            bash .github/docker/install-hosted-diagnostic.sh
      - name: Diagnose strict Docker path and identity grants
        env:
          NATIVE_FIXTURE_SHA256: ${{ steps.native_transfer.outputs.fixture_sha256 }}
        run: node scripts/diagnose-native-docker.mjs
      - name: Collect unique-profile audit and unload the diagnostic policy
        if: always()
        run: bash .github/docker/finish-hosted-diagnostic.sh
      - name: Aggregate current-job qualification after cleanup
        if: always()
        run: |
          rm -f results/native-docker/qualification.json
          node scripts/aggregate-native-docker.mjs results/native-docker \
            > "$RUNNER_TEMP/native-docker-aggregation.json"
          mv "$RUNNER_TEMP/native-docker-aggregation.json" results/native-docker/qualification.json
      - name: Retain native Docker qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-docker-qualification-linux-x64-${{ github.run_attempt }}
          path: results/native-docker/
          if-no-files-found: ignore

  package-linux:
    name: Package and test (${{ matrix.platform }})
    needs: [select, produce-linux]
    if: github.ref == 'refs/heads/feat/codex-harness'
    strategy:
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            cargo_jobs: 64
            managed_arm: false
            artifact: ${{ needs.select.outputs.linux_hit == 'true' && needs.select.outputs.linux_artifact || needs.produce-linux.outputs.artifact }}
    runs-on: &package_runs_on >-
      ${{ fromJSON(
        github.repository == 'openai/openai-agents-js' && matrix.platform == 'linux-x64' &&
          '{"group":"codex-runners","labels":"codex-linux-x64-xl"}' ||
        github.repository == 'openai/openai-agents-js' && matrix.platform == 'win32-x64' &&
          '{"group":"codex-runners","labels":"codex-windows-x64"}' ||
        matrix.managed_arm && '{"group":"codex-runners","labels":"codex-linux-arm64"}' ||
        toJSON(matrix.runner)
      ) }}
    timeout-minutes: 180
    defaults: &package_defaults
      run:
        shell: bash
    env: &package_env
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: ${{ matrix.managed_arm && 16 || matrix.cargo_jobs }}
      CARGO_INCREMENTAL: '0'
    steps: &package_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check runner platform
        run: node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'
      - name: Restore the current-run native transfer
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT: ${{ matrix.artifact }}
          NATIVE_INPUTS: ${{ needs.select.outputs.inputs_hash }}
        run: node scripts/restore-native-bundle.mjs
      - name: Install Linux worker prerequisites
        if: runner.os == 'Linux'
        run: |
          bash scripts/use-ubuntu-archive-if-needed.sh
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor-profiles bubblewrap
          if ! bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          uname -sr
          bwrap --version
          bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: ${{ matrix.platform != 'darwin-arm64' && 'pnpm' || '' }}
      - name: Build the current SDK
        id: build_sdk
        timeout-minutes: 15
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Qualify native browser interactions, audio, and MCP Apps
        if: runner.os == 'macOS'
        env:
          OPENAI_AGENTS_NATIVE_TESTS: '1'
          OPENAI_AGENTS_BROWSER_TESTS: '1'
        run: |
          npm ci --prefix examples/codex/mcp-ui --ignore-scripts
          npm run build --prefix examples/codex/mcp-ui
          node node_modules/playwright/cli.js install chromium
          node examples/codex/mcp-ui/node_modules/playwright/cli.js install chromium
          env -u OPENAI_API_KEY node node_modules/vitest/vitest.mjs run --pool=forks \
            --project @openai/agents-codex \
            packages/agents-codex/test/native/browser-interaction-audio.test.ts \
            packages/agents-codex/test/native/mcp-ui-browser.test.ts --maxWorkers 1
      - name: Qualify checkpoint compatibility on macOS and Windows
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          OPENAI_AGENTS_NATIVE_TESTS: '1'
        run: >-
          pnpm exec vitest run --pool=forks --project @openai/agents-codex
          packages/agents-codex/test/native/checkpoint-upgrades-native.test.ts
          --maxWorkers=1 --reporter=verbose
      - name: Qualify canonical native storage
        if: runner.os == 'macOS'
        run: >-
          pnpm test:native
          packages/agents-codex/test/native/custom-storage-durability-native.test.ts
          packages/agents-codex/test/custom-thread-store.test.ts
          packages/agents-codex/test/file-thread-store.test.ts
          --maxWorkers=4 --reporter=verbose
      - name: Qualify MCP environment names on Windows
        if: runner.os == 'Windows'
        env:
          OPENAI_AGENTS_NATIVE_TESTS: '1'
          CODEX_EXEC_SERVER_TEST_BINARY: ${{ github.workspace }}/packages/agents-codex/native/test-bin/exec-server-fixture.exe
        run: >-
          pnpm exec vitest run --pool=forks --project @openai/agents-codex
          packages/agents-codex/test/native/mcp-owned-stdio-native.test.ts
          -t 'environment name rules' --maxWorkers=1 --reporter=verbose
      - name: Qualify the Linux worker
        if: runner.os == 'Linux'
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: >-
          pnpm test:native --mode full
          --maxWorkers=${{ (matrix.managed_arm || (github.repository == 'openai/openai-agents-js' && matrix.platform == 'linux-x64')) && 8 || 4 }}
          --reporter=verbose
      - name: Qualify local executor grants on macOS
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.build_sdk.outcome == 'success' }}
        env:
          CODEX_EXEC_SERVER_TEST_BINARY: ${{ github.workspace }}/packages/agents-codex/native/test-bin/exec-server-fixture
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: >-
          pnpm test:native packages/agents-codex/test/native/local-executor-policy-native.test.ts
          -t 'blocks delegation from a local command to launchd|allows trusted local workspace commands to use macOS identity, toolchains and TLS within write grants|scopes trusted local workspace writes, private authentication and command temp|scopes Git and SSH settings for local commands|keeps telemetry configurable after rejecting trusted writes for a remote environment|joins a detached local child at|joins an interrupted local command|joins a yielded local process|confirms Session close with a stopped macOS command wrapper|applies a per-turn write policy|keeps the opening write policy on a WSS executor that reports macOS|keeps relocated (sessions|dated sessions|archives) outside local grants on open and replacement|keeps a selected local rollout outside grants on resume and replacement|rejects a profile database hard link in a local grant|keeps relocated checklist state outside local grants|rejects unverifiable directory aliases in the private native runtime home'
          --reporter=verbose
      - name: Qualify completed child history on macOS
        if: runner.os == 'macOS'
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: >-
          pnpm test:native packages/agents-codex/test/native/local-descendant-reopen-native.test.ts
          -t settled --maxWorkers=4 --reporter=verbose
      - name: Qualify executor stop and process cleanup on macOS
        if: runner.os == 'macOS'
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: >-
          pnpm test:native packages/agents-codex/test/native/executor-stop-native.test.ts
          packages/agents-codex/test/native/project-search-native.test.ts
          packages/agents-codex/test/native/selected-process-termination-native.test.ts
          --maxWorkers=4 --reporter=verbose
      - name: Qualify owned child tracing on macOS
        if: runner.os == 'macOS'
        run: |
          pnpm test:native packages/agents-codex/test/native/child-turn-events-native.test.ts -t 'keeps child tracing policy for explicit starts and active steering'
          pnpm test:native packages/agents-codex/test/native/native-questions.test.ts -t 'keeps original child tracing through question reply and physical handler cleanup'
      - name: Qualify native tracing and decoded OTLP transports
        if: runner.os == 'Linux'
        env:
          AGENTS_REQUIRE_TRACING_QUALIFICATION: '1'
          OPENAI_AGENTS_NATIVE_TESTS: '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/agents-otel-collector"
          "$RUNNER_TEMP/agents-otel-collector/bin/python" -m pip install grpcio==1.85.0 opentelemetry-proto==1.45.1
          OTLP_TEST_PYTHON="$RUNNER_TEMP/agents-otel-collector/bin/python" pnpm exec vitest run --project @openai/agents-codex packages/agents-codex/test/native/tracing-parity.test.ts packages/agents-codex/test/native/telemetry-transports.test.ts
          pnpm test:native packages/agents-codex/test/native/mcp-policy-native.test.ts -t 'restores the native MCP carrier'
      - name: Create the release bundles
        run: |
          version=$(node -p "require('node:fs').readFileSync('.github/alpha-version.txt', 'utf8').trim()")
          node scripts/alpha-package.mjs --version "$version" --output "$RUNNER_TEMP/agents-alpha"
      - name: Test the extracted bundles
        run: node scripts/verify-alpha-package.mjs --directory "$RUNNER_TEMP/agents-alpha"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agents-alpha-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/agents-alpha/*.tgz
            ${{ runner.temp }}/agents-alpha/*.tar.gz
            ${{ runner.temp }}/agents-alpha/SHA256SUMS-*
            ${{ runner.temp }}/agents-alpha/build-*.json
            ${{ runner.temp }}/agents-alpha/installed-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package-linux-arm64:
    name: Package and test (${{ matrix.platform }})
    needs: [select, produce-linux-arm64]
    if: >-
      !cancelled() && needs.select.result == 'success' &&
      ((needs.select.outputs.linux-arm64_hit == 'true' && needs.produce-linux-arm64.result == 'skipped') ||
       (needs.select.outputs.linux-arm64_hit != 'true' && needs.produce-linux-arm64.result == 'success'))
    strategy:
      matrix:
        include:
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            cargo_jobs: 4
            managed_arm: *managed_arm
            artifact: ${{ needs.select.outputs.linux-arm64_hit == 'true' && needs.select.outputs.linux-arm64_artifact || needs.produce-linux-arm64.outputs.artifact }}
    runs-on: *package_runs_on
    timeout-minutes: 180
    defaults: *package_defaults
    env: *package_env
    steps: *package_steps

  package-macos:
    name: Package and test (${{ matrix.platform }})
    needs: [select, produce-macos]
    if: github.ref == 'refs/heads/feat/codex-harness'
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            cargo_jobs: 5
            managed_arm: false
            artifact: ${{ needs.select.outputs.macos_hit == 'true' && needs.select.outputs.macos_artifact || needs.produce-macos.outputs.artifact }}
    runs-on: *package_runs_on
    timeout-minutes: 180
    defaults: *package_defaults
    env: *package_env
    steps: *package_steps

  package-windows:
    name: Package and test (${{ matrix.platform }})
    needs: [select, produce-windows]
    if: github.ref == 'refs/heads/feat/codex-harness'
    strategy:
      matrix:
        include:
          - platform: win32-x64
            runner: windows-2025
            cargo_jobs: 16
            managed_arm: false
            artifact: ${{ needs.select.outputs.windows_hit == 'true' && needs.select.outputs.windows_artifact || needs.produce-windows.outputs.artifact }}
    runs-on: *package_runs_on
    timeout-minutes: 180
    defaults: *package_defaults
    env: *package_env
    steps: *package_steps
