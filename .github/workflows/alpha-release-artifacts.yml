name: Alpha release artifacts

on:
  push:
    branches: [feat/codex-harness, 'ci/native-bundle/**']
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
  pull_request:
    branches: [feat/codex-harness]
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha-release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and test (${{ matrix.platform }})
    if: github.repository == 'openai/openai-agents-js'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: darwin-arm64
            runner: macos-15
          - platform: win32-x64
            runner: windows-2025
    # Keep macOS on its ARM runner and preserve standard runners for fork-owned repositories.
    runs-on: ${{ fromJSON(github.repository == 'openai/openai-agents-js' && matrix.platform == 'linux-x64' && '{"group":"codex-runners","labels":"codex-linux-x64"}' || github.repository == 'openai/openai-agents-js' && matrix.platform == 'win32-x64' && '{"group":"codex-runners","labels":"codex-windows-x64"}' || toJSON(matrix.runner)) }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      ALPHA_VERSION: 0.22.0-alpha.1
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: ${{ matrix.platform == 'darwin-arm64' && '3' || '8' }}
      CARGO_INCREMENTAL: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check runner platform
        run: |
          node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'

      - name: Restore the pinned native bundle
        id: native
        env:
          PIN_REF: ${{ github.event.pull_request.base.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-native-bundle.mjs

      - name: Install Rust
        if: steps.native.outputs.restored != 'true'
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-target" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install Linux worker prerequisites and any build tools
        if: runner.os == 'Linux'
        env:
          RESTORED: ${{ steps.native.outputs.restored }}
        run: |
          packages=(apparmor-profiles bubblewrap)
          if [[ "$RESTORED" != true ]]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet
            packages+=(clang cmake pkg-config protobuf-compiler libssl-dev)
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "${packages[@]}"
          # Ubuntu supplies a profile for bwrap that keeps its children restricted.
          if ! bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          uname -sr
          bwrap --version
          bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true
      - name: Install macOS build tools
        if: runner.os == 'macOS' && steps.native.outputs.restored != 'true'
        run: brew install cmake pkgconf protobuf openssl@3
      - name: Install Windows build tools
        if: runner.os == 'Windows' && steps.native.outputs.restored != 'true'
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Build the native runtime
        if: steps.native.outputs.restored != 'true'
        run: node packages/agents-codex/scripts/native.mjs package
      - name: Build the macOS WSS test fixture
        if: runner.os == 'macOS' && steps.native.outputs.restored != 'true'
        working-directory: packages/agents-codex/native
        run: |
          export RUSTY_V8_ARCHIVE="$PWD/.cache/v8/librusty_v8_ptrcomp_sandbox_release_aarch64-apple-darwin.a.gz"
          export RUSTY_V8_SRC_BINDING_PATH="$PWD/.cache/v8/src_binding_ptrcomp_sandbox_release_aarch64-apple-darwin.rs"
          cargo build --locked --release --example exec-server-fixture
          mkdir -p test-bin
          install -m 0755 "$CARGO_TARGET_DIR/release/examples/exec-server-fixture" test-bin/exec-server-fixture
      - name: Archive the native bundle
        if: steps.native.outputs.restored != 'true'
        working-directory: packages/agents-codex
        env:
          INPUTS: ${{ steps.native.outputs.inputs }}
        run: |
          products=(native/codex.node native/build-receipt.json bin)
          if [[ "$EXPECTED_PLATFORM" == darwin-arm64 ]]; then
            products+=(native/test-bin/exec-server-fixture)
          fi
          tar -czf - "${products[@]}" > "$RUNNER_TEMP/native-$INPUTS-$EXPECTED_PLATFORM-$GITHUB_RUN_ATTEMPT.tar.gz"
      - name: Upload the native bundle for pinning
        if: steps.native.outputs.restored != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/native-${{ steps.native.outputs.inputs }}-${{ matrix.platform }}-${{ github.run_attempt }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 90

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - name: Build the current SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Qualify the Linux worker
        if: runner.os == 'Linux'
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: |
          pnpm test:native \
            packages/agents-codex/test/native/supervised-worker-example.test.ts \
            packages/agents-codex/test/native/supervised-worker-cleanup.test.ts \
            --reporter=verbose
          pnpm test:native \
            packages/agents-codex/test/native/local-executor-policy-native.test.ts \
            -t 'joins an interrupted local command|ignores sandbox helper candidates|isolates local command reads and environment|rejects a missing write root|rejects an alias to the installed helpers|applies a per-turn write policy|keeps relocated (sessions|dated sessions|archives) outside local grants on open and replacement|keeps a selected local rollout outside grants on resume and replacement|rejects a profile database hard link in a local grant|keeps relocated checklist state outside local grants|rejects unverifiable directory aliases in the private native runtime home' \
            --reporter=verbose
      - name: Qualify local executor grants on macOS
        if: runner.os == 'macOS'
        env:
          CODEX_EXEC_SERVER_TEST_BINARY: ${{ github.workspace }}/packages/agents-codex/native/test-bin/exec-server-fixture
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: >-
          pnpm test:native packages/agents-codex/test/native/local-executor-policy-native.test.ts
          -t 'blocks delegation from a local command to launchd|joins a detached local child at|joins an interrupted local command|joins a yielded local process|confirms Session close with a stopped macOS command wrapper|applies a per-turn write policy|keeps the opening write policy on a WSS executor that reports macOS|keeps relocated (sessions|dated sessions|archives) outside local grants on open and replacement|keeps a selected local rollout outside grants on resume and replacement|rejects a profile database hard link in a local grant|keeps relocated checklist state outside local grants|rejects unverifiable directory aliases in the private native runtime home'
          --reporter=verbose
      - name: Create the release bundles
        run: node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$RUNNER_TEMP/agents-alpha"
      - name: Test the extracted bundles
        run: node scripts/verify-alpha-package.mjs --directory "$RUNNER_TEMP/agents-alpha"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agents-alpha-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/agents-alpha/*.tgz
            ${{ runner.temp }}/agents-alpha/*.tar.gz
            ${{ runner.temp }}/agents-alpha/SHA256SUMS-*
            ${{ runner.temp }}/agents-alpha/build-*.json
            ${{ runner.temp }}/agents-alpha/installed-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
