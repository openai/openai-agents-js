name: Alpha release artifacts

on:
  push:
    branches: [feat/codex-harness]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
  pull_request:
    branches: [feat/codex-harness]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: alpha-release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and test (${{ matrix.platform }})
    if: >-
      github.repository == 'openai/openai-agents-js' &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: darwin-arm64
            runner: macos-15
          - platform: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      ALPHA_VERSION: 0.22.0-alpha.1
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm

      - name: Check runner platform
        run: |
          node -e 'require("node:assert/strict").equal(process.platform + "-" + process.arch, process.env.EXPECTED_PLATFORM)'

      - name: Install Rust
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/agents-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/agents-target" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apparmor-profiles bubblewrap clang cmake pkg-config protobuf-compiler libssl-dev
          # Ubuntu supplies a profile for bwrap that keeps its children restricted.
          if ! bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          uname -sr
          bwrap --version
          bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf protobuf openssl@3
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc --yes --no-progress

      - name: Build the SDK and native runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node packages/agents/scripts/native.mjs package
      - name: Qualify the Linux worker
        if: runner.os == 'Linux'
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: |
          pnpm test:native \
            packages/agents/test/native/supervised-worker-example.test.ts \
            packages/agents/test/native/supervised-worker-cleanup.test.ts \
            --reporter=verbose
          pnpm test:native \
            packages/agents/test/native/local-executor-policy-native.test.ts \
            -t 'joins an interrupted local command|ignores sandbox helper candidates|isolates local command reads and environment|rejects a missing write root|rejects an alias to the installed helpers|applies a per-turn write policy' \
            --reporter=verbose
      - name: Build the macOS WSS test fixture
        if: runner.os == 'macOS'
        working-directory: packages/agents/native
        run: |
          # Reuse the verified V8 files and target from native.mjs package.
          export RUSTY_V8_ARCHIVE="$PWD/.cache/v8/librusty_v8_ptrcomp_sandbox_release_aarch64-apple-darwin.a.gz"
          export RUSTY_V8_SRC_BINDING_PATH="$PWD/.cache/v8/src_binding_ptrcomp_sandbox_release_aarch64-apple-darwin.rs"
          cargo build --locked --release --example exec-server-fixture
          fixture="$CARGO_TARGET_DIR/release/examples/exec-server-fixture"
          test -x "$fixture"
          echo "CODEX_EXEC_SERVER_TEST_BINARY=$fixture" >> "$GITHUB_ENV"
      - name: Qualify local executor grants on macOS
        if: runner.os == 'macOS'
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: >-
          pnpm test:native packages/agents/test/native/local-executor-policy-native.test.ts
          -t 'blocks delegation from a local command to launchd|joins a detached local child at|joins an interrupted local command|joins a yielded local process|applies a per-turn write policy|keeps the opening write policy on a WSS executor that reports macOS'
          --reporter=verbose
      - name: Create the release bundles
        run: node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$RUNNER_TEMP/agents-alpha"
      - name: Test the extracted bundles
        run: node scripts/verify-alpha-package.mjs --directory "$RUNNER_TEMP/agents-alpha"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agents-alpha-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/agents-alpha/*.tgz
            ${{ runner.temp }}/agents-alpha/*.tar.gz
            ${{ runner.temp }}/agents-alpha/SHA256SUMS-*
            ${{ runner.temp }}/agents-alpha/build-*.json
            ${{ runner.temp }}/agents-alpha/installed-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
