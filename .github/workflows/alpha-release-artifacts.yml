name: Alpha release artifacts

on:
  push:
    branches: [feat/codex-harness]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
  pull_request:
    branches: [feat/codex-harness]
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha-release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    uses: ./.github/workflows/alpha-native-package.yml
