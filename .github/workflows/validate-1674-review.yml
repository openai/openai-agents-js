name: Validate 1674 review fix

on:
  push:
    branches:
      - feat/realtime-session-payload-transform-466

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install
      - run: pnpm exec prettier --write packages/agents-realtime/src/openaiRealtimeBase.ts packages/agents-realtime/test/sessionPayloadTransform.test.ts
      - run: pnpm exec eslint packages/agents-realtime/src/openaiRealtimeBase.ts packages/agents-realtime/test/sessionPayloadTransform.test.ts
      - run: pnpm exec vitest --run --project '@openai/agents-realtime' packages/agents-realtime/test/sessionPayloadTransform.test.ts
      - name: Commit formatting and remove validation workflow
        if: success()
        run: |
          rm .github/workflows/validate-1674-review.yml
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add packages/agents-realtime/src/openaiRealtimeBase.ts packages/agents-realtime/test/sessionPayloadTransform.test.ts .github/workflows/validate-1674-review.yml
          git commit -m "chore(realtime): validate canonical session state"
          git push origin HEAD:${GITHUB_REF_NAME}
