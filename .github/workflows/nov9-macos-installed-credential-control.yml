name: macOS installed credential replacement control

on:
  push:
    branches: [codex/2352-macos-installed-credential-control]
    paths:
      - .github/workflows/nov9-macos-installed-credential-control.yml
      - .github/diagnostics/nov9-installed-darwin-credential-atomic.mjs

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SDK_COMMIT: 11edcbb2be4eb2e43179aac133cbe04d8234212a
      SDK_BASE: fae5fe6bf594e5f3234da4c5039bfb00f9b82a50
      SDK_HEAD: 63f03f79c6ecfcfddda97c67510baaf5b5a7d662
      SDK_TREE: 159057f420c7581f35c9c87030cec7a08eafff9f
      NATIVE_INPUTS: 95ea144d6d19acb8fdf60e1a8e5599d08831e400453be7f07e498d6035e19b0e
      ALPHA_VERSION: 0.22.0-alpha.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SDK_COMMIT }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the diagnostic from the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: diagnostics-checkout
          persist-credentials: false
      - name: Stage the exact fixture
        run: |
          fixture=diagnostics-checkout/.github/diagnostics/nov9-installed-darwin-credential-atomic.mjs
          echo "cc1cd46c60bc453dc4c0aa6d616714abfbafc62d667185bbd330822ad7071a93  $fixture" | shasum -a 256 -c -
          cp "$fixture" "$RUNNER_TEMP/installed-darwin-credential-atomic.mjs"
          rm -rf diagnostics-checkout
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the exact checkout, platform, and native fingerprint
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { nativeInputs } from './scripts/native-bundle-inputs.mjs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const { SDK_COMMIT, SDK_BASE, SDK_HEAD, SDK_TREE, NATIVE_INPUTS } = process.env;
          assert.equal(process.platform + '-' + process.arch, 'darwin-arm64');
          assert.equal(git('rev-parse', 'HEAD'), SDK_COMMIT);
          assert.equal(git('rev-parse', 'HEAD^{tree}'), SDK_TREE);
          assert.equal(git('show', '-s', '--format=%P', 'HEAD'), SDK_BASE + ' ' + SDK_HEAD);
          assert.equal(nativeInputs(), NATIVE_INPUTS);
          console.log('Verified', SDK_COMMIT, SDK_TREE, NATIVE_INPUTS, process.version);
          JS
      - name: Restore the pinned transfer from Alpha run 42903346108
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT: '{"artifact-id":"13805987392","artifact-digest":"b1cb7a2602afcb52fc635d76f29a8d6b3dce5dc252ecbbbee1f547912957dac3"}'
        run: node scripts/restore-native-bundle.mjs
      - name: Package the pinned wrappers and verify the standalone install
        run: |
          export CREDENTIAL_SCRATCH="$RUNNER_TEMP/agents-credential-control"
          mkdir "$CREDENTIAL_SCRATCH"
          pnpm install --frozen-lockfile
          node scripts/build-packages.mjs
          node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$CREDENTIAL_SCRATCH/alpha"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { verifyNativeReceipt, verifyStarterLock } from './scripts/alpha-package.mjs';
          import { verifyArtifactDirectory } from './scripts/verify-alpha-package.mjs';
          await verifyNativeReceipt(process.cwd(), 'darwin-arm64');
          const scratch = process.env.CREDENTIAL_SCRATCH;
          const artifacts = join(scratch, 'alpha');
          const build = await verifyArtifactDirectory(artifacts, 'darwin-arm64');
          assert.equal(build.sourceCommit, process.env.SDK_COMMIT);
          assert.equal(build.version, process.env.ALPHA_VERSION);
          execFileSync('/usr/bin/tar', ['-xzf', join(artifacts, build.starter.archive), '-C', scratch]);
          const lockfile = join(scratch, 'agents-starter', 'package-lock.json');
          verifyStarterLock(JSON.parse(await readFile(lockfile, 'utf8')), build.packages);
          console.log('Verified starter and five SDK archive hashes and starter lock');
          JS
          cp "$RUNNER_TEMP/installed-darwin-credential-atomic.mjs" "$CREDENTIAL_SCRATCH/agents-starter/"
          node_bin=$(command -v node)
          npm_cli="$(dirname "$node_bin")/../lib/node_modules/npm/bin/npm-cli.js"
          cd "$CREDENTIAL_SCRATCH/agents-starter"
          PATH='' "$node_bin" "$npm_cli" ci --ignore-scripts --no-audit --no-fund
          env -u OPENAI_API_KEY -u CODEX_HOME -u NODE_PATH -u CODEX_THREAD_ID \
            "$node_bin" installed-darwin-credential-atomic.mjs
