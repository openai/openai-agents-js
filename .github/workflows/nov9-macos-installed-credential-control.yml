name: macOS installed trusted workspace controls

on:
  push:
    branches: [codex/2352-macos-trusted-focused]
    paths:
      - .github/workflows/nov9-macos-installed-credential-control.yml
      - .github/diagnostics/nov9-trusted-darwin-focused.patch

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SDK_COMMIT: 11edcbb2be4eb2e43179aac133cbe04d8234212a
      SDK_BASE: fae5fe6bf594e5f3234da4c5039bfb00f9b82a50
      SDK_HEAD: 63f03f79c6ecfcfddda97c67510baaf5b5a7d662
      SDK_TREE: 159057f420c7581f35c9c87030cec7a08eafff9f
      NATIVE_INPUTS: 95ea144d6d19acb8fdf60e1a8e5599d08831e400453be7f07e498d6035e19b0e
      ALPHA_VERSION: 0.22.0-alpha.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SDK_COMMIT }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the diagnostic from the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: diagnostics-checkout
          persist-credentials: false
      - name: Stage the exact fixture
        run: |
          fixture=diagnostics-checkout/.github/diagnostics/nov9-trusted-darwin-focused.patch
          echo "dbe1657b936fc63c42e8a30be7ed8deaee12e27ce24a4bff33dd03451b7d8d23  $fixture" | shasum -a 256 -c -
          cp "$fixture" "$RUNNER_TEMP/trusted-mac-fixture.patch"
          rm -rf diagnostics-checkout
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Verify the exact checkout, platform, and native fingerprint
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { nativeInputs } from './scripts/native-bundle-inputs.mjs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const { SDK_COMMIT, SDK_BASE, SDK_HEAD, SDK_TREE, NATIVE_INPUTS } = process.env;
          assert.equal(process.platform + '-' + process.arch, 'darwin-arm64');
          assert.equal(git('rev-parse', 'HEAD'), SDK_COMMIT);
          assert.equal(git('rev-parse', 'HEAD^{tree}'), SDK_TREE);
          assert.equal(git('show', '-s', '--format=%P', 'HEAD'), SDK_BASE + ' ' + SDK_HEAD);
          assert.equal(nativeInputs(), NATIVE_INPUTS);
          console.log('Verified', SDK_COMMIT, SDK_TREE, NATIVE_INPUTS, process.version);
          JS
      - name: Restore the pinned transfer from Alpha run 42903346108
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT: '{"artifact-id":"13805987392","artifact-digest":"b1cb7a2602afcb52fc635d76f29a8d6b3dce5dc252ecbbbee1f547912957dac3"}'
        run: node scripts/restore-native-bundle.mjs
      - name: Install the verified pinned packages and run the two focused cases
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          node scripts/build-packages.mjs
          export DIAGNOSTIC_ROOT
          DIAGNOSTIC_ROOT=$(mktemp -d "$PWD/.trusted-mac.XXXXXX")
          trap 'rm -rf "$DIAGNOSTIC_ROOT"' EXIT
          node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$DIAGNOSTIC_ROOT/alpha"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { verifyNativeReceipt, verifyStarterLock } from './scripts/alpha-package.mjs';
          import { verifyArtifactDirectory } from './scripts/verify-alpha-package.mjs';
          await verifyNativeReceipt(process.cwd(), 'darwin-arm64');
          const root = process.env.DIAGNOSTIC_ROOT;
          const artifacts = join(root, 'alpha');
          const build = await verifyArtifactDirectory(artifacts, 'darwin-arm64');
          assert.equal(build.sourceCommit, process.env.SDK_COMMIT);
          assert.equal(build.version, process.env.ALPHA_VERSION);
          execFileSync('/usr/bin/tar', ['-xzf', join(artifacts, build.starter.archive), '-C', root]);
          const lock = await readFile(join(root, 'agents-starter', 'package-lock.json'), 'utf8');
          verifyStarterLock(JSON.parse(lock), build.packages);
          console.log('Verified starter archive, five SDK archives and package lock');
          JS
          fixture="$RUNNER_TEMP/trusted-mac-fixture.patch"
          git apply --index "$fixture"
          git diff --cached --check
          test "$(git write-tree)" = 1cb38ac9e8787309779994c410eab2ae0cca6477

          starter="$DIAGNOSTIC_ROOT/agents-starter"
          tests=packages/agents-codex/test/native
          mkdir -p "$starter/focused/fixtures"
          cp "$tests/local-executor-policy-native.test.ts" "$tests/saved-codex-login-native.test.ts" "$starter/focused/"
          for name in model-server.ts native-descendant-model.ts public-executor.ts saved-codex-login-loopback.ts saved-codex-login-child.mjs; do
            cp "$tests/fixtures/$name" "$starter/focused/fixtures/"
          done
          cat > "$starter/focused.vitest.config.mjs" <<'JS'
          export default {
            test: {
              include: ['focused/*.test.ts'],
              fileParallelism: false,
              pool: 'forks',
            },
          };
          JS
          node_bin=$(command -v node)
          npm_cli="$(dirname "$node_bin")/../lib/node_modules/npm/bin/npm-cli.js"
          (
            cd "$starter"
            PATH='' "$node_bin" "$npm_cli" ci --ignore-scripts --no-audit --no-fund
            "$node_bin" --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFile, realpath, stat } from 'node:fs/promises';
          import { join, sep } from 'node:path';
          import { fileURLToPath } from 'node:url';
          const installed = join(await realpath(process.cwd()), 'node_modules');
          for (const name of ['@openai/agents', '@openai/agents/testing', '@openai/agents-codex']) {
            assert((await realpath(fileURLToPath(import.meta.resolve(name)))).startsWith(installed + sep), name);
          }
          const pkg = join(installed, '@openai', 'agents-codex');
          const digest = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const bytes = await readFile(join(pkg, 'native/build-receipt.json'));
          assert.equal(digest(bytes), 'a9a0be05f1eda57fd06bc7dd6d780a65ac914384577e99d64fba37a0c7e50505');
          const receipt = JSON.parse(bytes);
          assert.equal(receipt.host, 'aarch64-apple-darwin');
          assert.equal(receipt.sources.codex.result_tree, '01e0d9de80133812abe0c5a0d96156c437c80b7d');
          assert.equal(Object.keys(receipt.inputs).length, 318);
          assert.equal(Object.keys(receipt.products).length, 4);
          for (const [name, expected] of Object.entries(receipt.products)) {
            const file = join(pkg, name);
            assert((await realpath(file)).startsWith(pkg + sep), name);
            assert.equal('sha256:' + digest(await readFile(file)), expected, name);
            if (name.startsWith('bin/')) assert.ok((await stat(file)).mode & 0o111, name);
          }
          console.log('Verified the fresh install receipt and all four native products');
          JS
          )

          # The selected-login child supplies its own CONNECT proxy and test CA.
          # Keep stock system settings and fail closed if a system proxy is active.
          if /usr/sbin/scutil --proxy | /usr/bin/grep -Eq 'Enable[[:space:]]*:[[:space:]]*1'; then
            echo 'Stock Darwin diagnostic requires an unconfigured system proxy' >&2
            exit 1
          fi
          report="$RUNNER_TEMP/trusted-mac-focused.json"
          env -u OPENAI_API_KEY -u CODEX_HOME -u NODE_PATH -u CODEX_THREAD_ID             OPENAI_AGENTS_NATIVE_TESTS=1 OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX=1             OPENAI_AGENTS_TEST_DARWIN_TRUSTED_CREDENTIALS=1             pnpm exec vitest run --root "$starter" --config "$starter/focused.vitest.config.mjs"             -t 'blocks delegation from a trusted local command to launchd|keeps selected saved-login credentials private in trusted commands'             --reporter=default --reporter=json "--outputFile.json=$report"
          node --input-type=module - "$report" <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.argv[2], 'utf8'));
          const cases = report.testResults.flatMap((file) => file.assertionResults);
          const expected = [
            'blocks delegation from a trusted local command to launchd',
            'keeps selected saved-login credentials private in trusted commands',
          ];
          for (const title of expected) {
            assert.deepEqual(cases.filter((row) => row.title === title).map((row) => row.status), ['passed']);
          }
          assert.equal(report.numPassedTests, 2);
          assert.equal(report.numFailedTests, 0);
          console.log('Verified 2 selected Darwin native cases, 0 selected skips');
          JS
