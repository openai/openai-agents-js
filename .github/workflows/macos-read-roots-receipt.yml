name: Compare stock GitHub CLI trust in one strict macOS SDK Session

on:
  push:
    branches: [mark/nov9-js-macos-read-roots-receipt]
    paths:
      - '.github/workflows/macos-read-roots-receipt.yml'
      - '.github/diagnostics/macos-gh-trust.mjs'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.repository == 'openai/openai-agents-js' && github.ref == 'refs/heads/mark/nov9-js-macos-read-roots-receipt'
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # Exact merge preview for draft #2352.
      SDK_COMMIT: 11edcbb2be4eb2e43179aac133cbe04d8234212a
      SDK_BASE: fae5fe6bf594e5f3234da4c5039bfb00f9b82a50
      SDK_HEAD: 63f03f79c6ecfcfddda97c67510baaf5b5a7d662
      SDK_TREE: 159057f420c7581f35c9c87030cec7a08eafff9f
      NATIVE_INPUTS: 95ea144d6d19acb8fdf60e1a8e5599d08831e400453be7f07e498d6035e19b0e
      ALPHA_VERSION: 0.22.0-alpha.2
      GO_VERSION: '1.26.10'
      GH_VERSION: '2.103.3'
      GH_ZIP_SHA256: d700207eae9ae98fe2b89535c2c087c07823d4628c56364695a5a07ef311c062
      GH_BINARY_SHA256: 5f8d7527e2bdf584249b030cdd1550c91d75e8afb40aa3c11573d416817a1260
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SDK_COMMIT }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the diagnostics from the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .macos-receipt
          sparse-checkout: |
            /.github/diagnostics/macos-gh-trust.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Stage the exact diagnostic blobs
        run: |
          scratch="$RUNNER_TEMP/agents-gh-trust"
          mkdir "$scratch"
          test "$(git -C .macos-receipt rev-parse HEAD)" = "$GITHUB_SHA"
          git -C .macos-receipt show "$GITHUB_SHA:.github/diagnostics/macos-gh-trust.mjs" > "$scratch/macos-gh-trust.mjs"
          rm -rf .macos-receipt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the exact checkout and runner
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { nativeInputs } from './scripts/native-bundle-inputs.mjs';

          const { SDK_COMMIT, SDK_BASE, SDK_HEAD, SDK_TREE, NATIVE_INPUTS } = process.env;
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(git('rev-parse', 'HEAD'), SDK_COMMIT);
          assert.equal(git('rev-parse', 'HEAD^{tree}'), SDK_TREE);
          assert.equal(git('show', '-s', '--format=%P', 'HEAD'), `${SDK_BASE} ${SDK_HEAD}`);
          assert.equal(nativeInputs(), NATIVE_INPUTS);
          assert.equal(`${process.platform}-${process.arch}`, 'darwin-arm64');
          assert(process.getuid() > 0);
          assert.equal(process.versions.node.split('.')[0], '24');
          console.log('Verified SDK commit, tree and native inputs', SDK_COMMIT, SDK_TREE, NATIVE_INPUTS);
          JS
          printf 'Runner image %s %s, architecture %s\n' "${ImageOS:?}" "${ImageVersion:?}" "$(/usr/bin/uname -m)"
          /usr/bin/sw_vers
          printf 'Node %s, npm %s, pnpm %s\n' "$(node --version)" "$(npm --version)" "$(pnpm --version)"
      - name: Verify the official stock GitHub CLI release and embedded Go
        run: |
          scratch="$RUNNER_TEMP/agents-gh-trust"
          go_bin="$RUNNER_TOOL_CACHE/go/$GO_VERSION/arm64/bin/go"
          test -x "$go_bin"
          archive="gh_${GH_VERSION}_macOS_arm64.zip"
          /usr/bin/env -i /usr/bin/curl --disable --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --max-time 90 \
            --output "$scratch/gh.zip" "https://github.com/cli/cli/releases/download/v$GH_VERSION/$archive"
          zip_digest=$(/usr/bin/shasum -a 256 < "$scratch/gh.zip")
          test "${zip_digest%% *}" = "$GH_ZIP_SHA256"
          /usr/bin/unzip -p "$scratch/gh.zip" "${archive%.zip}/bin/gh" > "$scratch/gh"
          binary_digest=$(/usr/bin/shasum -a 256 < "$scratch/gh")
          test "${binary_digest%% *}" = "$GH_BINARY_SHA256"
          chmod 0700 "$scratch/gh"
          mkdir "$scratch/version-home" "$scratch/version-config"
          gh_version=$(/usr/bin/env -i HOME="$scratch/version-home" GH_CONFIG_DIR="$scratch/version-config" \
            GH_NO_UPDATE_NOTIFIER=1 GH_TELEMETRY=0 "$scratch/gh" --version | /usr/bin/sed -n '1p')
          case "$gh_version" in "gh version $GH_VERSION ("*) ;; *) exit 1 ;; esac
          go_build=$(/usr/bin/env -i HOME="$scratch/version-home" GOENV=off GOTOOLCHAIN=local \
            GOPROXY=off "$go_bin" version "$scratch/gh")
          test "${go_build##* }" = go1.27.3
          printf '%s; embedded Go %s; stock binary SHA-256 %s\n' \
            "$gh_version" "${go_build##* }" "$GH_BINARY_SHA256"
      - name: Restore the pinned transfer from Alpha run 42903346108
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT: '{"artifact-id":"13805987392","artifact-digest":"b1cb7a2602afcb52fc635d76f29a8d6b3dce5dc252ecbbbee1f547912957dac3"}'
        run: node scripts/restore-native-bundle.mjs
      - name: Verify native products and assemble the local diagnostic starter
        run: |
          scratch="$RUNNER_TEMP/agents-gh-trust"
          pnpm install --frozen-lockfile
          node --input-type=module <<'JS'
          import { verifyNativeReceipt } from './scripts/alpha-package.mjs';
          await verifyNativeReceipt(process.cwd(), 'darwin-arm64');
          JS
          node scripts/build-packages.mjs
          node scripts/alpha-package.mjs --version "$ALPHA_VERSION" --output "$scratch/alpha"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { copyFile, readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { verifyStarterLock } from './scripts/alpha-package.mjs';
          import { verifyArtifactDirectory } from './scripts/verify-alpha-package.mjs';

          const scratch = join(process.env.RUNNER_TEMP, 'agents-gh-trust');
          const artifacts = join(scratch, 'alpha');
          const build = await verifyArtifactDirectory(artifacts, 'darwin-arm64');
          assert.equal(build.sourceCommit, process.env.SDK_COMMIT);
          assert.equal(build.version, process.env.ALPHA_VERSION);
          execFileSync('/usr/bin/tar', ['-xzf', join(artifacts, build.starter.archive), '-C', scratch]);
          const starter = join(scratch, 'agents-starter');
          verifyStarterLock(JSON.parse(await readFile(join(starter, 'package-lock.json'), 'utf8')), build.packages);
          await writeFile(join(starter, 'verification-build.json'), JSON.stringify(build));
          await copyFile(
            'packages/agents-codex/native/build-receipt.json',
            join(starter, 'release-native-receipt.json'),
          );
          console.log('Verified the local starter assembly using the official Darwin native transfer.');
          JS
          cp "$scratch/macos-gh-trust.mjs" "$scratch/agents-starter/macos-gh-trust.mjs"
          node_bin=$(command -v node)
          npm_cli="$(dirname "$node_bin")/../lib/node_modules/npm/bin/npm-cli.js"
          cd "$scratch/agents-starter"
          PATH='' "$node_bin" "$npm_cli" ci --ignore-scripts --no-audit --no-fund
      - name: Compare default and explicit PEM with the stock CLI through one strict SDK listener
        run: |
          scratch="$RUNNER_TEMP/agents-gh-trust"
          node_bin=$(command -v node)
          mkdir "$scratch/codex-home" "$scratch/session-tmp"
          cd "$scratch/agents-starter"
          /usr/bin/env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SHELL="${SHELL:-/bin/bash}" CODEX_HOME="$scratch/codex-home" TMPDIR="$scratch/session-tmp" \
            OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX=1 \
            "$node_bin" macos-gh-trust.mjs "$scratch/gh" "$GH_BINARY_SHA256" 2>/dev/null
