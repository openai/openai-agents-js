name: Compare stock macOS PEM verification through one CONNECT listener

on:
  push:
    branches: [mark/nov9-js-macos-read-roots-receipt]
    paths:
      - '.github/workflows/macos-read-roots-receipt.yml'
      - '.github/diagnostics/macos-stock-pem-connect.test.ts'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.repository == 'openai/openai-agents-js' && github.ref == 'refs/heads/mark/nov9-js-macos-read-roots-receipt'
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SDK_COMMIT: 3a04fcda5e74b11bc5668bd07d0715fb38bc3f8e
      SDK_TREE: 2a023a8af4539af69cadb89213834d0e2fb11dd3
      NATIVE_INPUTS: 0e8037e90a550263d510f2ef54da1642b5234ef9168c087810638c04ff2857a9
      PEM_CASE: compares stock Darwin PEM verification through the same CONNECT listener
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SDK_COMMIT }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the exact checkout and runner
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { nativeInputs } from './scripts/native-bundle-inputs.mjs';

          const { SDK_COMMIT, SDK_TREE, NATIVE_INPUTS } = process.env;
          const git = (...args) => execFileSync('git', args, {encoding: 'utf8'}).trim();
          assert.equal(git('rev-parse', 'HEAD'), SDK_COMMIT);
          assert.equal(git('rev-parse', 'HEAD^{tree}'), SDK_TREE);
          assert.equal(nativeInputs(), NATIVE_INPUTS);
          assert.equal(process.platform + '-' + process.arch, 'darwin-arm64');
          assert.ok(process.getuid() > 0);
          console.log('Verified checkout, tree and native inputs', SDK_COMMIT, SDK_TREE, NATIVE_INPUTS);
          JS
      - name: Restore the pinned transfer from Alpha run 42890383494
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT: '{"artifact-id":"13799113376","artifact-digest":"f8d683937ec01c14ab03d0b4504f9c598baf644dea526dbd27d9a7d1e882bc5e"}'
        run: node scripts/restore-native-bundle.mjs
      - name: Verify the release receipt and build the exact JavaScript SDK
        run: |
          pnpm install --frozen-lockfile
          node --input-type=module <<'JS'
          import { verifyNativeReceipt } from './scripts/alpha-package.mjs';
          await verifyNativeReceipt(process.cwd(), 'darwin-arm64');
          console.log('Release receipt inputs and products match.');
          JS
          node scripts/build-packages.mjs
      - name: Check out the focused fixture from the diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .macos-receipt
          sparse-checkout: .github/diagnostics/macos-stock-pem-connect.test.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Compare stock PEM in host and strict Session
        env:
          OPENAI_AGENTS_REQUIRE_LOCAL_SANDBOX: '1'
        run: |
          probe=packages/agents-codex/test/native/macos-stock-pem-connect.test.ts
          result="$RUNNER_TEMP/strict-darwin-pem-test.json"
          export SDK_DARWIN_PEM_RECEIPT="$RUNNER_TEMP/strict-darwin-pem-receipt.json"
          test ! -e "$probe"
          test ! -e "$SDK_DARWIN_PEM_RECEIPT"
          cp ".macos-receipt/.github/diagnostics/macos-stock-pem-connect.test.ts" "$probe"
          trap 'rm -f "$probe"' EXIT
          status=0
          env -u OPENAI_API_KEY -u CODEX_API_KEY pnpm test:native "$probe" \
            -t "$PEM_CASE$" --maxWorkers=1 --reporter=verbose --reporter=json \
            --outputFile.json="$result" || status=$?
          if test -s "$SDK_DARWIN_PEM_RECEIPT"; then
            node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync(process.env.SDK_DARWIN_PEM_RECEIPT, 'utf8'));
          console.log('Stock Darwin PEM CONNECT comparison', JSON.stringify(receipt));
          JS
          fi
          test "$status" -eq 0
          test -s "$SDK_DARWIN_PEM_RECEIPT"
          node --input-type=module - "$result" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const tests = result.testResults.flatMap((file) => file.assertionResults);
          assert.equal(tests.length, 1);
          assert.equal(tests[0].title, process.env.PEM_CASE);
          assert.equal(tests[0].status, 'passed');
          assert.equal(result.numPassedTests, 1);
          assert.equal(result.numFailedTests, 0);
          console.log('Both peer comparisons completed through CONNECT, with zero selected skips.');
          JS
