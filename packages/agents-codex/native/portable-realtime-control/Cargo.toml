[package]
name = "codex-portable-realtime-control"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "codex_portable_realtime_control"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared_realtime_control = { package = "codex-realtime-control", path = "../.upstream/reviewed-codex/codex-rs/realtime-control" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
