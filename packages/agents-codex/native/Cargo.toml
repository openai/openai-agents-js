[package]
name = "codex-agents-node"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "agents_codex"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "codex-sdk-runtime"
path = "rust/runtime.rs"

[[bin]]
name = "codex-code-mode-host"
path = "rust/code_mode_host.rs"

[[example]]
name = "exec-server-fixture"
path = "tests/fixtures/exec_server.rs"

[dev-dependencies]
pretty_assertions = "=1.4.1"

[dependencies]
strum = "=0.27.2"
strum_macros = "=0.28.0"
codex-api = { path = ".upstream/reviewed-codex/codex-rs/codex-api" }
codex-client = { path = ".upstream/reviewed-codex/codex-rs/codex-client" }
codex-http-client = { path = ".upstream/reviewed-codex/codex-rs/http-client" }
codex-websocket-client = { path = ".upstream/reviewed-codex/codex-rs/websocket-client" }
codex-models-manager = { path = ".upstream/reviewed-codex/codex-rs/models-manager" }
base64 = "=0.22.1"
bytes = "=1.12.1"
chrono = "=0.4.43"
http = "=1.4.0"
http-body-util = "=0.1.3"
hyper = { version = "=1.8.1", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["client-legacy", "client-proxy", "http1", "tokio"] }
tokio-rustls = "=0.26.4"
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["proxy"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
url = "=2.5.8"
anyhow = "1"
opentelemetry = { version = "=0.31.0", default-features = false, features = ["trace"] }
codex-agent-graph-store = { path = ".upstream/reviewed-codex/codex-rs/agent-graph-store" }
codex-app-server-protocol = { path = ".upstream/reviewed-codex/codex-rs/app-server-protocol" }
codex-core-api = { path = ".upstream/reviewed-codex/codex-rs/core-api" }
codex-exec-server = { path = ".upstream/reviewed-codex/codex-rs/exec-server" }
codex-core = { path = ".upstream/reviewed-codex/codex-rs/core" }
codex-protocol = { path = ".upstream/reviewed-codex/codex-rs/protocol" }
codex-config = { path = ".upstream/reviewed-codex/codex-rs/config" }
codex-file-system = { path = ".upstream/reviewed-codex/codex-rs/file-system" }
codex-extension-api = { path = ".upstream/reviewed-codex/codex-rs/ext/extension-api" }
codex-rollout = { path = ".upstream/reviewed-codex/codex-rs/rollout" }
codex-history = { path = ".upstream/reviewed-codex/codex-rs/history" }
codex-state = { path = ".upstream/reviewed-codex/codex-rs/state" }
codex-thread-store = { path = ".upstream/reviewed-codex/codex-rs/thread-store" }
codex-tools = { path = ".upstream/reviewed-codex/codex-rs/tools" }
codex-arg0 = { path = ".upstream/reviewed-codex/codex-rs/arg0" }
codex-async-utils = { path = ".upstream/reviewed-codex/codex-rs/async-utils" }
codex-history-notes-extension = { path = ".upstream/reviewed-codex/codex-rs/ext/history-notes" }
codex-goal-extension = { path = ".upstream/reviewed-codex/codex-rs/ext/goal" }
codex-git-attribution = { path = ".upstream/reviewed-codex/codex-rs/ext/git-attribution" }
codex-guardian-v2 = { path = ".upstream/reviewed-codex/codex-rs/ext/guardian-v2" }
codex-mcp-extension = { path = ".upstream/reviewed-codex/codex-rs/ext/mcp" }
codex-mcp = { path = ".upstream/reviewed-codex/codex-rs/codex-mcp" }
codex-model-provider = { path = ".upstream/reviewed-codex/codex-rs/model-provider" }
codex-web-search-extension = { path = ".upstream/reviewed-codex/codex-rs/ext/web-search" }
codex-image-generation-extension = { path = ".upstream/reviewed-codex/codex-rs/ext/image-generation" }
codex-skills-extension = { path = ".upstream/reviewed-codex/codex-rs/ext/skills" }
codex-otel = { path = ".upstream/reviewed-codex/codex-rs/otel" }
codex-login = { path = ".upstream/reviewed-codex/codex-rs/login" }
codex-code-mode = { path = ".upstream/reviewed-codex/codex-rs/code-mode" }
codex-code-mode-host = { path = ".upstream/reviewed-codex/codex-rs/code-mode-host" }
codex-execpolicy = { path = ".upstream/reviewed-codex/codex-rs/execpolicy" }
codex-utils-path-uri = { path = ".upstream/reviewed-codex/codex-rs/utils/path-uri" }
futures-core = "0.3"
futures-util = "0.3"
napi = { version = "3", default-features = false, features = ["napi8", "async-runtime", "serde-json", "dyn-symbols"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_ignored = "0.1.14"
globset = "0.4.18"
regex = "1"
serde_yaml = "0.9.34"
serde_path_to_error = "0.1"
sha2 = "0.10"
tempfile = "3"
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "3e636cab26c013eca5131103c03d20237f12c4df", version = "=3.3.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
toml = "0.9.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
native-tls = "=0.2.14"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.186"

[target.'cfg(all(target_os = "linux", target_env = "gnu", target_arch = "x86_64"))'.dependencies]
mimalloc = { version = "=0.1.52", default-features = false, features = ["local_dynamic_tls", "v2"] }

[build-dependencies]
napi-build = "2"

[patch.crates-io]
hyper = { path = "rust/vendor/hyper-1.8.1" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."https://github.com/modelcontextprotocol/rust-sdk"]
rmcp = { path = ".upstream/reviewed-rust-sdk/crates/rmcp" }
rmcp-macros = { path = ".upstream/reviewed-rust-sdk/crates/rmcp-macros" }

[profile.dev]
debug = 0

[profile.release]
debug = 0
lto = "thin"
codegen-units = 1
