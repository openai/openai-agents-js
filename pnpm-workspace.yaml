packages:
  - packages/*
  - examples/*
  - docs

nodeLinker: hoisted

allowBuilds:
  '@tailwindcss/oxide': true
  cbor-extract: true
  esbuild: true
  protobufjs: true
  sharp: true
  # used only in examples/memory
  better-sqlite3: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true

overrides:
  '@types/node': 22.19.13

publishBranch: main
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - openai@7.2.0
blockExoticSubdeps: true
strictDepBuilds: true
patchedDependencies:
  # Preserve Prisma 6's BEGIN IMMEDIATE behavior and release on begin failure.
  # Recheck the contention tests before removing this patch on an adapter update.
  '@prisma/adapter-better-sqlite3@7.10.0': patches/@prisma__adapter-better-sqlite3@7.10.0.patch
