packages:
  - packages/*
  - examples/*
  - docs

nodeLinker: hoisted

allowBuilds:
  '@tailwindcss/oxide': true
  cbor-extract: true
  esbuild: true
  protobufjs: true
  sharp: true
  # used only in examples/memory
  better-sqlite3: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true

overrides:
  '@types/node': 22.19.13
  # Expo 55 pins Metro 0.83.7; 0.83.8 removes vulnerable image-size.
  'metro@0.83.7': 0.83.8
  'metro-babel-transformer@0.83.7': 0.83.8
  'metro-cache@0.83.7': 0.83.8
  'metro-cache-key@0.83.7': 0.83.8
  'metro-config@0.83.7': 0.83.8
  'metro-core@0.83.7': 0.83.8
  'metro-file-map@0.83.7': 0.83.8
  'metro-minify-terser@0.83.7': 0.83.8
  'metro-resolver@0.83.7': 0.83.8
  'metro-runtime@0.83.7': 0.83.8
  'metro-source-map@0.83.7': 0.83.8
  'metro-symbolicate@0.83.7': 0.83.8
  'metro-transform-plugins@0.83.7': 0.83.8
  'metro-transform-worker@0.83.7': 0.83.8

publishBranch: main
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - openai@7.2.0
blockExoticSubdeps: true
strictDepBuilds: true
patchedDependencies:
  # Preserve Prisma 6's BEGIN IMMEDIATE behavior and release on begin failure.
  # Recheck the contention tests before removing this patch on an adapter update.
  '@prisma/adapter-better-sqlite3@7.10.0': patches/@prisma__adapter-better-sqlite3@7.10.0.patch
