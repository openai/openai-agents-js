packages:
  - packages/*
  - examples/classic/*
  - docs

nodeLinker: hoisted

allowBuilds:
  '@tailwindcss/oxide': true
  cbor-extract: true
  esbuild: true
  # Use Koffi's packaged platform binary; never invoke its compiler fallback.
  koffi: false
  protobufjs: true
  sharp: true

overrides:
  '@types/node': 22.19.13
  # Keep xcode's CommonJS UUID API on a patched release until upstream removes it.
  'xcode@3.0.1>uuid': ^11.1.1
  # Remove when Express 4 and body-parser 1 resolve patched qs within the release-age policy.
  'express@4.22.2>qs': ^6.16.0
  'body-parser@1.20.6>qs': ^6.16.0
  # Keep the patched generator's parser on patched js-yaml until its pin is updated upstream.
  '@hey-api/json-schema-ref-parser@1.4.2>js-yaml': 4.3.2
  # Workspace-only security fix; remove when Blaxel ships a patched TOML dependency.
  '@blaxel/core@0.2.82>toml': 4.2.0

publishBranch: main
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - openai@7.2.0
blockExoticSubdeps: true
strictDepBuilds: true
patchedDependencies:
  # Restore the stream type mapping for TypeScript node resolution until upstream restores it.
  eventsource-parser@3.1.1: patches/eventsource-parser@3.1.1.patch
