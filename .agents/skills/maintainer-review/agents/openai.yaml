interface:
  display_name: "Maintainer Review"
  short_description: "Gate PR value on demonstrated user need"
  default_prompt: "Use $maintainer-review with this GitHub issue or PR URL. Before evaluating implementation quality, verify that linked evidence matches the exact runtime variant and assign Need evidence as Demonstrated, Plausible but unproven, Already covered, or Unsupported. Require either observed practical impact or a complete realistic trigger-to-material-consequence trace; reject harmless speculative logic-only improvements even when the patch is small and correct. Then compare existing and alternative approaches, complete the desk review and required lifecycle ownership checks, proactively run focused local-only probes for decision-relevant concerns, request approval before live API, credentialed, external, mutating, or materially broad runtime work, compare credible competing PRs, recommend the best maintainer action, and include an English comment draft when closure or changes are needed."
